; Required native-save profile for fixed UE4SS 3.0.1-1125-g527a483b.
; UE4SS parses the Conan vtable layout before engine detection.
; Both admitted Conan images require the UE 5.8 FField/FProperty hierarchy.
[General]
EnableHotReloadSystem = 0
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
SecondsToScanBeforeGivingUp = 30
bUseUObjectArrayCache = false
DoEarlyScan = 0
DefaultExecuteInGameThreadMethod = EngineTick
DefaultFNameToStringMethod = Scan

[EngineVersionOverride]
MajorVersion = 5
MinorVersion = 8

[Debug]
ConsoleEnabled = 0
GuiConsoleEnabled = 0
GuiConsoleVisible = 0

[Hooks]
HookProcessInternal = 1
HookProcessLocalScriptFunction = 0
HookInitGameState = 0
HookLoadMap = 0
HookCallFunctionByNameWithArguments = 0
HookBeginPlay = 0
HookEndPlay = 0
HookLocalPlayerExec = 0
HookAActorTick = 0
HookEngineTick = 1
EngineTickResolveMethod = Scan
HookGameViewportClientTick = 0
HookUObjectProcessEvent = 0
HookProcessConsoleExec = 0
HookUStructLink = 0

[CrashDump]
EnableDumping = 0
FullMemoryDump = 0
