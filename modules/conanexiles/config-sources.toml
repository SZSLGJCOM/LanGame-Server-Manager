id = "runtime_rcon"
kind = "runtime_rcon"
path = "RCON"
authority = "installed_server_protocol_probe"
description = "The installed Enhanced build 25488622 help response on 2026-10-01 lists listplayers, listbans, kickplayer, banplayer, unbanplayer, and shutdown. It does not list the ARK commands saveworld or DoExit. A real shutdown entered RequestExit(0), updated the world database, and closed its log after 86.5 seconds of native teardown; the module allows 120 seconds for complete process-tree exit. Loss of the RCON completion response is not itself proof of exit."

