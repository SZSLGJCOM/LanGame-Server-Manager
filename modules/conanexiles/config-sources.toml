[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://exiles-enhanced.inflexion.io/servers/settings/"
authority = "source_and_native_contract_semantic_review"
description = "Semantic review on 2026-09-30 checked all 292 fields against the official Enhanced settings page and the emitted INI inventory. Metadata covers distinct weekday labels, damage direction, access/follower/survival classification and twelve documented float types. Fractional fixture values cover these types through schema validation and native INI readback. Native defaults are retained; ambiguous time units are not inferred from documentation-only evidence. The official settings page remains non-exhaustive."

[[sources]]
id = "native_semantics_build_25488622"
kind = "documentation"
path = "ConanSandbox/Binaries/Win64/ConanSandboxServer-Win64-Shipping.exe"
authority = "first_party_installed_executable_static_analysis"
description = "2026-09-30 read-only analysis of Steam app 443030 build 25488622; executable SHA256 2c3fef162b159bd16124b7ea8030884aa1f66e7b1d966e63542407e590d04fa1. AServerSettings reflection identifies 23 additional FloatProperty controls. Its native constructor initializes UnconsciousTimeSeconds to 600, but the current packaged BP_ServerSettings class default object overrides it to 1800 (FloatProperty at asset offset 0x35a5; SHA256 8d207d799acc4ef815c9b4650a36ed42af612edf5845eef2f4cd9ea88a48c272); the module uses the Blueprint default 1800. ThrallDecayTime is subtracted from replicated world seconds; LQAVPUseTime and LQAVPFadeTime operate on UWorld time seconds. CheckPVPTimeRestrictions constructs hour*100+minute, includes the start, excludes the end, and wraps when start>=end. Synthetic acceptance inputs exercise fractions without changing historical observed INI files. The rotation-smoothing control maps to UCharacterMovementComponent.NetworkSimulatedSmoothRotationTime (seconds). OverrideDecayMaxBuildingPieces and OverrideDecayTime are Int32 properties with constructor defaults 6 and 3600; the official reference defines their small-building threshold and seconds semantics. This is static native-contract evidence, not a gameplay execution claim."

[[sources]]
id = "native_semantics_existing_unconscious"
kind = "documentation"
path = "ConanSandbox/Saved/Config/WindowsServer/ServerSettings.ini"
authority = "configuration_preservation_regression"
description = "The historical captured INI used UnconsciousTimeSeconds=1800. The current packaged BP_ServerSettings default is also 1800, overriding the native constructor value 600. This separate synthetic regression supplies explicit 600 and requires it to survive saving without replacement by the default. The 2026-09-30 fixture is synthetic acceptance input, not a newly observed server output."

[[sources]]
id = "epic_character_rotation_smoothing"
kind = "documentation"
path = "UCharacterMovementComponent.NetworkSimulatedSmoothRotationTime"
authority = "official_epic_unreal_engine_api"
url = "https://dev.epicgames.com/documentation/unreal-engine/API/Runtime/Engine/UCharacterMovementComponent"
description = "The engine API documents rotation interpolation duration with ForceUnits=s. In Conan build 25488622, the enabled LQAVP path copies the server float at offset 0x568 directly to the movement component reflected property at 0x454. No new clamp is imposed from editor-only metadata."

[[sources]]
id = "native_advanced_consumers_build_25488622"
kind = "documentation"
path = "ConanSandbox/Binaries/Win64/ConanSandboxServer-Win64-Shipping.exe"
authority = "first_party_installed_executable_static_consumer_trace"
description = "2026-09-30 bounded follow-up on nine already exposed advanced controls. LocalNavMeshVisualizationFrequency and LocalLandClaimVisualizationFrequency compare against UWorld.GetRealTimeSeconds; negative values skip updates, while radius/channel feed collection before ClientDrawNavMeshDebug/ClientDrawLandClaimDebug RPCs. These are diagnostic data paths present in the shipping server, not discarded repository-development leftovers. LQAVP selects native correction branches 0/1/2/3; unknown numeric values retain the native fallthrough, so no closed enum is added. ValidatePlayerStats checks attribute-point spending against the character-level allowance and resets excessive allocation with a native player notification. CapCharacterLayoutScalarParams clamps three CharacterScalarParameters members. ValidatePhysNavWalkWithRaycast is a reflected Boolean at offset 0x549, but the bounded native-consumer scan could not tie an observed read to that AServerSettings member; no claim that the setting is unused or server-only is made."

[[sources]]
id = "death_drop_numeric_contract_25488622"
kind = "documentation"
path = "ConanSandbox/Saved/Config/WindowsServer/ServerSettings.ini [ServerSettings] DropEquipmentOnDeath"
authority = "official_funcom_patch_notes_and_installed_executable"
url = "https://forums.funcom.com/t/pc-update-age-of-war-chapter-1-2023-06-22-latest-hotfix-2-2023-07-20/231320"
description = "2026-09-30 verification against installed Steam build 25488622: reflected EDropOnDeath has modes 0 (keep items), 1 (drop all; constructor default), and 2 (drop backpack). Drop_MAX=3 is a sentinel. AServerSettings reads enum configuration through its integer getter using _wtoi and writes the underlying value through its integer setter with %i formatting. This bypasses the general enum-name text exporter. The official Age of War release notes document the same three numeric modes. Death-drop selection is distinct from corpse lifetime and corpse-looting permission; the obsolete backpack/shortcut-bar Boolean controls are not duplicated. The three acceptance fixtures cover numeric modes 0, 1 and 2 without running a game server."

