reason = "Incomplete scope: build 25488622 confirms a configurable FloatProperty at AServerSettings member 0x4f8, with packaged DefaultServerSettings.ini overriding constructor 1 to 0.01. Consumer 0x144cd82a0 first applies BuildingDamageMultiplier at 0x4f4, then applies this independent multiplier only when virtual predicate 0x7c8 succeeds. Predicates 0x144d09b60 and 0x144d45e60 accept discriminator 0 or 2 and the exact DmgTypeHealth_BP_C class loaded from /Game/Systems/Progression/DmgTypeHealth_BP. The gameplay categories represented by 0 and 2 remain unverified, so no general player-attack control is exposed. This is neither a duplicate setting nor evidence of unused code."

