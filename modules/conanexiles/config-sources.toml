[[sources]]
id = "packaged_blueprint_contracts_25488622"
kind = "documentation"
path = "ConanSandbox/Content/Paks; BP_ServerSettings, BP_HungerSystem, BP_Durability, BuildingDestructionCapsule and BP_SiptahStormController"
authority = "installed_official_package_and_native_consumers"
description = "2026-09-30 read-only Steam build 25488622 package inspection. DefaultServerSettings.ini SHA256 98f4800cfe7a7e65253d38aae8226cdfb32ffa045e7defb033cfe3cc9cbad929 supplies EverybodyCanLootCorpse=False, ClientCatchUpTime=10, MaxNudity=None (the ByteProperty loader reads this through GetInt/_wtoi as 0), offline hunger/thirst=0, drinking recovery=1, shield durability loss=1, capsule cleanup=False, and storm HHMM starts0/ends2359. BP_ServerSettings CDO SHA256 8d207d799acc4ef815c9b4650a36ed42af612edf5845eef2f4cd9ea88a48c272 sets UnconsciousTimeSeconds=1800 and ClientCatchUpTime=10. Native CDO initialization loads the ServerSettings INI hierarchy at0x144f6a0df; instance initialization reads its marked properties at0x144f71347. BP_HungerSystem consumes the three hunger/thirst/drink multipliers; BP_Durability multiplies shield-hit and weapon-block durability loss. All four are DoubleProperty values admitted by the game loader. Capsule cleanup is server-gated and traces its map region before damaging buildings or destroying eligible placeables. Storm SetStormState compares HHMM >=start and <end with no midnight wrapping; its FuncomGenericLibrary.GetDayOfYear helper actually computes weekday modulo7, independently verified from native code. FeatsBlacklist parses quoted numeric strings into the nonconfig ServerBlacklistedFeatIDs cache; BuildingPVPWhitelist similarly owns its derived IDs. Neither cache gets a duplicate editor. Constructor-only and name-only assumptions were replaced with these package and consumer contracts."

[[sources]]
id = "action_stamina_consumer_25488622"
kind = "documentation"
path = "AServerSettings.StaminaCostMultiplier and BaseBPCombat"
authority = "native_property_and_complete_blueprint_consumers"
description = "Native StaminaCostMultiplier is a distinct marked property at AServerSettings member0x48c, read under its own name by LoadSetting. Its getter exec0x144c20870 is called in complete BaseBPCombat functions AdjustStaminaForAttack, GetStaminaJumpCost and OnSubstateChanged_Dodge; each multiplies the action cost by this value. Packaged DefaultServerSettings.ini sets1. The separate Blueprint PlayerStaminaCostMultiplier is DoubleProperty at class assetoffset0x23aa flags0x1014005 and CDOoffset0x2fdb default1; its current gameplay effect is unsupported after all92243 package name tables and the native executable were checked. It is removed from the ordinary form and default template while existing stored values are preserved. Neither is treated as a name alias. Synthetic native fixtures verify the action key at1.25."

[[sources]]
id = "authentication_ban_check_25488622"
kind = "documentation"
path = "AServerSettings.EnableBanCheck and CheckIdentityToken"
authority = "packaged_default_and_native_authentication_consumer"
description = "Packaged DefaultServerSettings.ini sets EnableBanCheck=True, overriding the native constructor zero at member0x611. JSON response parsing at0x144645894 reads IsBanned and0x1446458f9 stores responseoffset0x90. The login check at0x144df5352 reads ServerSettingsoffset0x611 and rejects an IsBanned response when enabled, with the explicit banned-user error. It separately continues local allow/ban eligibility checks via0x144dfe540. This is a global authentication policy, not another individual-player blacklist. No claim about VAC, Steam or EOS ownership is made. Synthetic fixtures cover defaulttrue and explicitfalse."
