[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "<validated-install-root>/WS/Config/GameplaySettings/GameXishuConfig_Template.json"
authority = "native_package_and_documentation_semantic_review"
description = "Semantic review on 2026-09-30 of 292 presentation entries in English and Chinese against the referenced native package and documentation. The titles of 282 native tuning fields follow their Chinese Desc text. Bonfire timing controls recognition and protection, rather than burn duration. The main-character setting controls the skill cooldown after releasing a controlled body. The fleet invasion toggle has IsShow=true. Variable hidden fields remain in their current categories. The fixed XiShuWeiLing constant is excluded from editing; official survival versus creative presets establish JingShenNoXiaoHao switch polarity as documented below. No gameplay experiment was performed."

[[sources]]
id = "native_semantics_build_25361728"
kind = "install_probe"
path = "WS/Config/GameplaySettings/GameXishuConfig_Template*.json"
authority = "current_official_package_read_only_consumer_evidence"
description = "2026-09-30: All five official preset files and their three profiles constrain XiShuWeiLing to default/min/max 0 and IsShow=false. It remains a preserved native constant but is excluded from editable controls. JingShenNoXiaoHao has native switch bounds 0..1 and description meaning mental-consumption switch, consuming by default; standard/action/management/PvP presets use 0, while creative uses 1, including all six difficulty defaults. Labels express normal consumption versus no consumption. Other hidden but variable coefficients remain independently configurable. SHA256: GameXishuConfig_Template.json c9f9128fe1df1608c18a7873f9bf9c5a50877fc3393fc7a439f91b0ae02cd00c; GameXishuConfig_Template_Action.json 2773f3e2b34641b1edd75d6cf7a50502b9c08825e319f0da1b8034b9ca505a7a; GameXishuConfig_Template_Creative.json 86b1ce415ce4fc80aa986420270ee1dadc8f85b4c213d52072d84f0436851696; GameXishuConfig_Template_Management.json e6dfac864872de7470cdac44ded5db2b8dde973f81da8bb7c42cc02fa4839dec; GameXishuConfig_Template_PVP.json da99d64378486cff3ba07c79697934b339e7408d69731eca4565a71fac185e96."

[[exclusions]]
source = "launch_args"
key = "-log"
reason = "Fixed first-party native console logging flag for the managed private-desktop launch profile; runtime control remains subject to real-server acceptance."
