status = "best_effort_verified"
last_verified = "2026-09-28"
notes = "SteamCMD anonymous app_update 3017310 validate completed against the validated package on 2026-07-13. The public manifest reports buildid 24123420 and SizeOnDisk 5692879739. LanGame crosswalks Soulmask launch arguments, the RCON runtime command surface, and all 276 keys in the installed GameXishu gameplay templates. The current package adds NewYingHuoTimeLenMul, JianDuiRuQinKaiGuan, and ReleaseControlStatusCDRatio and changes the four tenacity-damage defaults to 0.5 plus ZuRenDirectCunQu to 1. The GameXishu materializer writes one managed GameXishu.json profile under WS/Saved/GameplaySettings before launch. A 2026-09-28 static comparison of installed build 25117179 found six additional gameplay coefficients, bringing each profile to 282 keys; their defaults and ranges come from the matching native metadata. This comparison does not establish the latest public Steam build or a native launch result."

[[sources]]
id = "configuration_review_20260930"
kind = "documentation"
path = "https://steamcommunity.com/app/2646460/announcements/?l=english"
authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: The publisher feed lists 1.0 Patch 20 on 2026-09-17 UTC; Patch 18 introduced configurable collection-yard, logging-yard and excavation-pit limits. The installed app 3017310 manifest reports build 25361728. Each of its three GameXishu_Template.json profiles contains 282 keys, all covered by the current ledger, including the previously added six settings. This static package comparison does not reuse old-build runtime results as current-build proof."

