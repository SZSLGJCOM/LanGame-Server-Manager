id = "semantic_review_20260930"
kind = "documentation"
path = "https://steamcommunity.com/sharedfiles/filedetails/?id=2992700419"
authority = "native_package_and_documentation_semantic_review"
description = "2026-09-30: 44 presentation entries reviewed in EN/ZH against the referenced package/docs. 25 Chinese custom-game names expanded and scope identified as new Custom save creation. New mode overwrites the selected slot on each startup; existing saves are not silently reconfigured. LAN listing and connectivity tests separated from automatic port-opening assumptions. Empty-server timescale 0 pauses/1 normal; FPS units; timestamp-disabled logging overwrite behavior. Hunger/thirst and food-related player damage labels distinguish their specific effects. Boundaries: No new native runtime/gameplay acceptance is claimed; historical verification dates remain unchanged."
