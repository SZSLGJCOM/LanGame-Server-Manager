authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: The current Endnight dedicated-server guide lists the same top-level, GameSettings and 25 CustomGameModeSettings fields already modeled. The installed app 2465200 manifest remains build 20228410. Endnight publisher news identifies the 2025-10-03 Unity security update as affecting this dedicated server. SaveInterval remains maintenance-owned and owner identities remain in Player Access. Documentation and manifest inspection did not repeat native startup or client-join acceptance."

