authority = "installed_server_runtime_verification"
description = "2026-09-08: the configuration in -userdatapath controls native startup. A configuration left only under config/ was ignored despite -configfilepath. Materializing the JSON into data/ applied the instance ports and temporary network self-test setting, followed by a complete A2S player query and normal shutdown."

[[sources]]
id = "native_lan_lifecycle_build_20228410"
kind = "runtime_probe"
path = "../../apps/desktop/src-tauri/src/commands_native_lifecycle_tests.rs"
authority = "isolated_local_package_lifecycle_probe"
description = "2026-09-20: the existing build 20228410 completed isolated creation, startup with a complete A2S reply, stop, server-file uninstall and instance deletion using native LanOnly=true and SkipNetworkAccessibilityTest=true. No save was generated without players. With public network self-tests enabled, this environment remained in Testing public accessibility before binding the declared UDP endpoints. This fixture covers local hosting and does not certify public port forwarding, Steam listing or client joins. Production defaults are unchanged."

[[sources]]
id = "native_public_mode_self_test_comparison_20261001"
kind = "runtime_probe"
path = "../../apps/desktop/src-tauri/src/commands_native_lifecycle_tests.rs"
authority = "isolated_and_existing_instance_production_start_stop"
description = "2026-10-01: build 20228410 stalled during public accessibility testing and three native shutdown dumps identified Steam HTTP request release. A single-variable comparison retained LanOnly=false and set SkipNetworkAccessibilityTest=true. The isolated production start/stop probe and existing-instance run 112 both reached the exact native '#DSL Dedicated server loaded.' event, remained running for 30 seconds, and stopped normally with exit code 0. Existing ports and other settings were preserved; the self-test override was retained for this workstation's instance. This does not certify public reachability, port forwarding, Steam listing, client joins, or long-duration stability. Generic listening and A2S alone do not prove the world has finished loading. Product defaults remain unchanged."

