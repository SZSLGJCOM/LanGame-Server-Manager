status = "exhaustive_verified"
last_verified = "2026-09-08"
notes = "Installed Steam build 20228410 was started on 2026-09-08. Native configuration is read from -userdatapath/dedicatedserver.cfg; The Forest's -configfilepath argument is not supported. After materializing the instance JSON into that directory, the configured ports and SkipNetworkAccessibilityTest were applied and the server returned a complete zero-player query. Password and ownerswhitelist.txt are the native access settings; AdminPassword and GameDifficulty are not native keys. All current top-level, GameSettings, and CustomGameModeSettings fields are covered; bind and port values come from instance bindings."

