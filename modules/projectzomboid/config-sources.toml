status = "best_effort_verified"
last_verified = "2026-09-28"
notes = "2026-09-28: installed build 24909836 ServerOptions declares 144 native keys. Native constructor evidence supersedes old wiki-only INI controls; unsupported stored values remain preserved. New anti-cheat policies require review before startup when older security values were customized. Existing valid operational defaults remain unchanged. This is a read-only package audit, not fresh-install or native-start evidence. Lua, Mods and maintenance retain their dedicated surfaces."

