[[sources]]
id = "installed_start_server64_bat"
kind = "launch_arg"
path = "StartServer64.bat"
authority = "installed_project_zomboid_dedicated_server_package"
description = "StartServer64.bat launches the bundled jre64/bin/java.exe with -Djava.awt.headless=true, -Dzomboid.steam=1, -Dzomboid.znetlog=1, -XX:+UseZGC, -Xms16g -Xmx16g, classpath PZ_CLASSPATH, main class zombie.network.GameServer, and -statistic 0. LanGame adds -Duser.home so server.ini, SandboxVars.lua, spawnregions.lua, and saves are isolated under the instance runtime home."

[[sources]]
id = "installed_projectzomboid64_json"
kind = "launch_arg"
path = "ProjectZomboid64.json"
authority = "installed_project_zomboid_dedicated_server_package"
description = "ProjectZomboid64.json mirrors the Windows 64-bit Java wrapper metadata, including mainClass zombie/network/GameServer, classpath entries under java/, native paths, and vmArgs such as -XX:+UseZGC and the memory defaults represented by StartServer64.bat."

