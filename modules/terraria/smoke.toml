schema_version = 1
module_id = "terraria"
primary_process_key = "main"
readiness_timeout_ms = 60000
poll_interval_ms = 1000
stability_window_ms = 3000
probe_mode = "all"

[[probes]]
id = "game-endpoint"
kind = "process_endpoint"
process_key = "main"
port_name = "game"
protocol = "tcp"

[[probes]]
# Short-lived clients can race vanilla Terraria's network-stream teardown.
# Observe the owned listener and this run's startup log without adding a client.
id = "server-started"
kind = "log_marker"
sources = [{ kind = "process", process_key = "main" }]
any_of = ["Server started"]
