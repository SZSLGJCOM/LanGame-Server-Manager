[[sources]]
id = "native_semantic_resolution_20260930"
kind = "documentation"
path = "1458/Windows/TerrariaServer.exe"
authority = "read_only_installed_package_static_consumer_analysis"
description = "2026-09-30: Version 1.4.5.8 Windows TerrariaServer.exe Main.LoadDedConfig (060003E2) assigns npcstream to Main.npcStreamSpeed. NPC.UpdateNetworkCode (0600093A) invokes StreamUpdatesToNearbyPlayers (0600093B); the latter increments netStream, compares it with the configured threshold, and resets the counter when due. It separately weights outgoing updates by player distance. Nonpositive values disable this extra path; town NPCs, insufficiently moving NPCs and types outside the proximity-sync set are excluded. The unit is eligible NPC update count, not radius or a fixed wall-clock duration. Corrected the title, help and remaining radius validation message. Kept the packaged-sample/LGSM default 60; the compiled static default 30 is a distinct fallback. The prior unit uncertainty is resolved by consumer analysis. Primary binary SHA256 d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e."
