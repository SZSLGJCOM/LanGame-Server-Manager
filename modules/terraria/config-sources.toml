[[exclusions]]
source = "serverconfig"
key = "port"
reason = "Instance port binding state is rendered into serverconfig.txt from the declared game TCP port, not duplicated as a game schema field."

[[exclusions]]
source = "serverconfig"
key = "worldpath"
reason = "LanGame owns the instance saves directory and renders the full world path directly through the serverconfig world key."

[[exclusions]]
source = "serverconfig"
key = "banlist"
reason = "LanGame owns the generated banlist path in serverconfig.txt while banlist_entries materializes the server-read banlist.txt content."

[[exclusions]]
source = "launch_args"
key = "-config"
reason = "LanGame always owns this switch to point the server at the rendered instance serverconfig.txt."

[[exclusions]]
source = "launch_args"
key = "-ip"
reason = "Bind IP is instance-level state, not a game-specific schema field."

[[exclusions]]
source = "launch_args"
key = "-port"
reason = "Port is instance port binding state and is rendered into serverconfig.txt from the declared game port."

[[exclusions]]
source = "launch_args"
key = "-forcepriority"
reason = "The serverconfig.txt priority key is exposed instead; the command-line override would conflict with that field."

[[exclusions]]
source = "runtime_console"
key = "help"
reason = "Informational command; exposing it as a persistent game configuration field would not change server behavior."

[[exclusions]]
source = "runtime_console"
key = "exit-nosave"
reason = "Destructive shutdown path is intentionally not exposed because LanGame shutdown policy saves before exit."

