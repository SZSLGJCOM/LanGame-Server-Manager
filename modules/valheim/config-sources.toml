id = "native_control_and_save_20261030"
kind = "install_probe"
path = "modules/valheim/reference-fixtures/2026-10-30-native_build_26266951.json"
authority = "official_steamcmd_build_26266951_static_contract_and_isolated_native_save_reload"
description = "2026-10-30: Official Windows app 896660 validated as build 26266951 (Valheim 1.0.21, network 41), StateFlags 4, 2112248548 installed bytes. All three gated assembly hashes changed. Full method/field/property comparison against build 25909431 preserves ZNet, World, SyncedList, socket and PlatformUserID contracts, the dedicated disk check, native save worker and committed-generation update. Before admitting this tuple, an independent isolated probe under the existing verified BepInExPack 5.4.2351 completed native save generation 0 to 1; its five-file snapshot was captured before shutdown and restored to a new process, which loaded the same world UID and generation 1 with metadata version 42. Both phases exited normally with code 0 and no forced cleanup. Product host and plugin gates retain the two earlier complete tuples and reject mixed or unknown hashes. The fixture records artifact identities and the 31-pass C# boundary suite built against real candidate ABI references. This zero-player probe does not verify live clients, crossplay, public A2S or an existing player's world. Earlier configuration-review dates remain historical."

