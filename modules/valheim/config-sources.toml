id = "managed_native_lifecycle_build_26266951_20261031"
kind = "runtime_probe"
path = "reference-fixtures/2026-10-31-managed_native_lifecycle_build_26266951.json"
authority = "compiled_manager_backend_with_isolated_official_package"
description = "2026-10-31 Asia/Shanghai: final managed backend build 26266951 completed four native startup/stop cycles with exits 0 and verified cleanup. The first formal manual save returned confirmed; its five-file world snapshot was captured before shutdown and restored exactly to the next run, which loaded the matching saved world/generation without another save. Backup restore, interrupted archive commit recovery and library-only uninstall preserved instance data; later restored-world checks preceded two distinct additional confirmed saves. No multiplayer, populated old-world migration, power-loss durability or network program update is claimed."

