authority = "installed_valheim_0_221_12_and_official_dedicated_server_guide"
description = "Read-only IL inspection on 2026-09-20 of installed Valheim 0.221.12 (network version 36, Steam build 21981590) confirms SteamManager.Awake always initializes Steam with the configured game port and query port game+1, including private mode. The installed Steamworks.NET wrapper passes those ports to SteamInternal_GameServer_Init. Iron Gate's official dedicated-server guide likewise states that Valheim uses the specified port and port+1, so the module allocates and updates game/query together with fixed offsets 0/1."
url = "https://valheim.com/support/a-guide-to-dedicated-servers/"

