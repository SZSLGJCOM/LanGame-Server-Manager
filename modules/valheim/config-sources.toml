[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://valheim.com/support/a-guide-to-dedicated-servers/"
authority = "native_package_and_documentation_semantic_review"
description = "2026-09-30: 18 presentation entries reviewed in EN/ZH against the referenced package/docs. Disambiguates servers sharing the same MAC address and port; removed public-IP claim. Load existing named world or create it when absent. First backup interval versus subsequent backup interval distinguished. Log path help clarified. Boundaries: No new native runtime/gameplay acceptance is claimed; historical verification dates remain unchanged."
