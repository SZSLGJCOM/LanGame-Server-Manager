id = "private_steam_server_readiness"
kind = "install_probe"
path = "valheim_server_Data/Managed/assembly_valheim.dll: ZSteamMatchmaking.RegisterServer / UnregisterServer / ZNet.OpenServer"
authority = "installed_valheim_0_221_12_and_steamworks_interface_contract"
description = "Read-only IL inspection on 2026-09-20 of installed Valheim 0.221.12 (network version 36, Steam build 21981590) confirms RegisterServer first disables SetAdvertiseServerActive and enables it only when publicServer is true. Steamworks.NET documents that this switch also controls server-browser and LAN-discovery replies, so private mode does not promise an A2S response. ZNet.OpenServer starts the Steam host socket before logging Opened Steam server; the observed native run emitted that marker after world generation, while Game server connected appeared earlier. The smoke fixture selects public_server=0 and crossplay_enabled=false and requires owned game/query UDP sockets plus a current-run Opened Steam server marker. The real fixture completed creation, startup readiness, stop, generated-save backup, uninstall preserving seven save files, instance archival and cleanup on 2026-09-20. This run does not verify crossplay, public listing, public A2S responses or a player joining."
url = "https://github.com/rlabrecque/Steamworks.NET/blob/master/com.rlabrecque.steamworks.net/Runtime/autogen/isteamgameserver.cs#L258-L270"

