key = "-nographics"
reason = "Fixed for background dedicated-server hosting; exposing it would break the managed headless launch posture."

[[exclusions]]
source = "launch_args"
key = "-batchmode"
reason = "Fixed for background dedicated-server hosting; exposing it would break the managed headless launch posture."

[[exclusions]]
source = "launch_args"
key = "-port"
reason = "Game and query ports are instance port-binding state, not game-specific schema fields."

[[exclusions]]
source = "launch_args"
key = "-savedir"
reason = "LanGame owns the per-instance save root so worlds, adminlist, bannedlist, and permittedlist stay isolated."

[[exclusions]]
