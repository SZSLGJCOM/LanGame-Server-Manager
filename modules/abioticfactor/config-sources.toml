status = "exhaustive_verified"
last_verified = "2026-09-08"
notes = "The official launch-parameter and sandbox-option documentation was reviewed on 2026-09-08 against the current schema. ApocalypticAbilities and MaximizeEnemySpawns are now included with the documented false defaults; the exclusions tied to the July package have been removed. Their generated native INI values are covered by the current acceptance fixture; individual gameplay effects have not been verified. The July SteamCMD package record remains historical installation evidence. Installed build 24343458 boots and returns complete A2S_INFO/A2S_PLAYER responses. A controlled run changing only LANOnly from true to false restored Steam queries while UseLocalIPs stayed true; the original LAN-only configuration was restored afterward. LAN discovery uses the game-native port 14001. Admin.ini moderator entries remain separate from read-only online player names."

