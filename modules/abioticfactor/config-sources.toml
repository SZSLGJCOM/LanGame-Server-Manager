[[exclusions]]
source = "launch_args"
key = "-log"
reason = "Fixed by the module so this GUI-subsystem server creates the native console required by its CTRL_C shutdown strategy. The managed private desktop keeps the console hidden; this is not a user setting."

[[exclusions]]
source = "launch_args"
key = "-newconsole"
reason = "Excluded: Abiotic Factor build 24343458 with -newconsole does not expose the attachable Windows console required for CTRL_C, and ConPTY receives no output. The managed host uses -log without -newconsole, verified with native readiness and a normal exit."

[[exclusions]]
source = "launch_args"
key = "-stdout"
reason = "Fixed by the managed host to send Unreal log output to the captured standard-output stream."

[[exclusions]]
source = "launch_args"
key = "-FullStdOutLogOutput"
reason = "Fixed by the managed host so verbose native output is retained alongside warnings and errors."

[[exclusions]]
source = "launch_args"
key = "-PORT"
reason = "Game port is instance port-binding state, not a game-rule field on the settings page."

[[exclusions]]
source = "launch_args"
key = "-QueryPort"
reason = "Steam query port is instance port-binding state, not a game-rule field on the settings page."

[[exclusions]]
source = "launch_args"
key = "-MultiHome"
reason = "Rendered from the instance-level bind address so the native listener cannot diverge from shared network settings."

[[exclusions]]
source = "launch_args"
key = "-SandboxIniPath"
reason = "LanGame fixes this path to its generated per-instance SandboxSettings.ini so multiple instances cannot share one mutable file."

[[exclusions]]
source = "launch_args"
key = "-AdminIniPath"
reason = "LanGame fixes this path to its generated per-instance Admin.ini so moderator rosters stay isolated."

[[exclusions]]
source = "launch_args"
key = "-NOSTEAM"
reason = "Official launch-parameter docs explicitly warn not to use this for running the server."

[[exclusions]]
source = "launch_args"
key = "-NoAsyncLoadingThread"
reason = "Legacy quickstart spelling retained by older docs; LanGame now maps the setting to the current -DisableAsyncLoadingThread launch flag."

[[exclusions]]
source = "sandbox_settings"
key = "[SandboxSettings]"
reason = "Required INI section header materialized by the template, not a user-authored setting."

