[[sources]]
id = "a2s_player_probe_24343458"
kind = "install_probe"
path = "Steam dedicated-server build 24343458: isolated loopback A2S_INFO and A2S_PLAYER"
authority = "installed_windows_dedicated_server"
description = "2026-09-08 isolated blank-world probe of the installed build returned A2S_INFO with zero current players and an A2S_PLAYER response FF FF FF FF 44 00. The probe used separate files, saves and ports. Populated names are not yet verified; the runtime collector publishes only actual returned names, compares against INFO counts, and marks missing identities incomplete. No stable account identifiers or moderation are inferred from A2S. The temporary server was stopped after the probe."

[[sources]]
id = "semantic_review_2026_09_30"
kind = "documentation"
path = "https://github.com/DFJacob/AbioticFactorDedicatedServer/wiki/Technical-%E2%80%90-Sandbox-Options"
authority = "first_party_documentation_and_installed_package_semantic_review"
description = "Semantic review on 2026-09-30 of 58 active configuration fields in both languages. Continence depletion increases toilet frequency. The furniture stacking count is independent of global structural strength; zero removes the stacking limit. IronMode is a starting job that requires Hardcore. No fresh server/client run was performed; existing evidence dates and status remain unchanged."
