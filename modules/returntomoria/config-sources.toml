[[sources]]
id = "native_running_status_readiness"
kind = "install_probe"
path = "Moria/Saved/Config/Status.json"
authority = "installed_build_21872765_and_official_dedicated_server_guide"
description = "On 2026-09-20, native build 21872765 generated worlds and held its configured game UDP endpoint, while no persistent game TCP listener was observed in the same fixture. The official Console.Enabled guide identifies Status.json as a hosting-state observation; the installed file reports Status=running. The smoke therefore requires owned game UDP plus a bounded, valid running status that has been rewritten since the prestart metadata/content baseline. An unchanged status copied from the package cannot pass. The official TCP/UDP traffic recommendation does not itself require a persistent TCP listener; both production transport declarations remain intact. No status payload, invite code or address is emitted in diagnostics."
url = "https://www.returntomoria.com/news-updates/dedicated-server"

