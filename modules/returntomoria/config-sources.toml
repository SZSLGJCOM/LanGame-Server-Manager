status = "exhaustive_verified"
last_verified = "2026-07-13"
notes = "Steam public branch build 21872765 (updated 2026-02-12 UTC) is current on 2026-07-13. A clean first launch of that Windows package generated the native sectioned MoriaServerConfig.ini used for this crosswalk, including DurinsFolk DLC fields, host retry settings, eight custom-difficulty keys, ServerFPS 60, and LoadedAreaLimit 12. The official Free Range Games guide independently confirms the config, rules, permissions, TCP/UDP 7777 traffic, eight-player fixed session limit, console commands, and Ctrl-C save-and-stop behavior."

