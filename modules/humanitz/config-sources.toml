[[sources]]
id = "semantic_review_2026_09_30"
kind = "documentation"
path = "HumanitZServer/REF_GameServerSettings.ini"
authority = "first_party_documentation_and_installed_package_semantic_review"
description = "Semantic review on 2026-09-30 covers both languages and the current build 23914958 configuration import path. MapSeg2 is a per-side grid division count; 60 defines a 60-by-60 grid, with no invented object-type assignment. Sixteen old keys are excluded: fourteen have no exact key in current scripts, maps, configuration resources or executable; ClearInfection and LootRarity have residual gameplay reads but are absent from the dedicated file-import key set and receive missing-key defaults. Current threat and rarity controls use HumanHealth/HumanSpeed/HumanDamage and per-category Rarity fields. Historical values remain in stored JSON and unmanaged native INI values, whose formatting may be normalized on merge. No server/client gameplay run was performed; historical verification status is unchanged."

[[sources]]
id = "humanitz_developer_settings_2024_01_23"
kind = "documentation"
path = "Steam developer reply #6, gumbydust, 2024-01-23"
authority = "official_developer_historical_statement"
description = "Historical developer-authored settings explanation: ClearInfection=0 retains infection on respawn and 1 clears it; HumanDifficulty has six levels 0 through 5, from very easy through nightmare. EagleEye controlled skill purchase at that date. The LootRarity entry repeats numeric codes for different labels, so it cannot establish an unambiguous enum. These historical meanings do not establish continued support in build 23914958."
url = "https://steamcommunity.com/app/1766060/discussions/0/4031349199261079259/"

[[sources]]
id = "humanitz_update_0_908"
kind = "documentation"
path = "Dev Update 0.908, 2024-02-08, HumanitZ - Ashe"
authority = "official_developer_release_notes"
description = "The official update removes the eagle eye skill and replaces friend-location visibility with group invitations. The EagleEye skill-purchase switch is therefore removed from the current configuration UI and template. Existing stored JSON values remain untouched."
url = "https://store.steampowered.com/news/posts/?enddate=1707411741&feed=steam_community_announcements"

[[sources]]
id = "native_semantics_build_23914958"
kind = "install_probe"
path = "HumanitZServer/REF_GameServerSettings.ini; ReadMe.txt; HumanitZServer-Win64-Shipping.exe"
authority = "read_only_official_package_static_analysis"
description = "2026-09-30 read-only package inspection: REF Version=39 SHA256 5e6cb7befbef8308fbddf523b44d781acc5ef8e2e7bb24178003ddf693f9d833. MapSeg0/1/2 are grid divisions per side with defaults 12/20/60. The comments identify houses for segment 0 and broken vehicles for segment 1 but no object class for segment 2. GameState bytecode at .uexp offset 0xe6f0 reads MapSeg2 with fallback 60, converts it to an integer and at 0xe7e5 writes SegDivs[2] before InitWorldSeg. GameState .uexp SHA256 a565bd00c3ea4c39e1db67ac6650beb3bc8566346eff13d3381eccce3976ffde. ReadMe documents F_ReservedSlots.txt with NetIDs and ReserveSlots equal to MaxPlayers for whitelist behavior. See native_configuration_read_path_build_23914958 for complete import-path analysis."

[[sources]]
id = "native_configuration_read_path_build_23914958"
kind = "install_probe"
path = "HumanitZServer-Win64-Shipping.exe; Content/TSS_Game/Blueprints/GameInstanceSettings/BP_GameInstanceWithSettings; Content/TSS_Game/Blueprints/BP_GameStateBase"
authority = "read_only_official_package_static_analysis"
description = "Build 23914958 executable SHA256 c3f46f78220605e7a73151261b9bdb072786170dc0edc8c75da4ed872d67671a; GameInstance .uexp SHA256 67aa99b1e8faf6fc7eb964f9568ef4f2b323961de34853461e626ab99482343a. The package index and directory hashes were verified after read-only in-memory decoding; no credentials or assets are shipped with this module. All 80,253 .uasset/.uexp/.umap/.ini resources were read with bounded size checks, totaling 1,979,555,234 uncompressed bytes and no errors. DedicatedLoadGameDiff fully decodes from .uexp 0x37f58 to 0x3b0d3: SetArray at 0x38b58 supplies 79 entries, 77 unique keys. The loop calls native GetSettingValue at 0x3917f and Map_Add(DedServerSettings,key,value) at 0x39257 only for those keys. Native wrapper VA 0x140fca9e0 calls 0x140f79400, which initializes GameServerSettings.ini through 0x140f86360 and retrieves one key through 0x1410bf770. The complete DedServerSettings owner scan found GameInstance and UltraDynamicSky only; the latter only reads the map, and the import loop is its only map write. None of the sixteen retired keys belongs to this import list. Fourteen, including the ten VehicleSettings keys, have no exact name in the scanned resources or executable. ClearInfection is still compared with true/yes/1 before assignment to GameDiff.ClearInfectionOnDeath, but missing import yields false. LootRarity still flows through ParseServerVal, whose Map_Find/SelectString uses fallback 2, then into GameDiff.LootAmontMultiplier. Residual infection/loot consumers therefore do not establish that these ini keys remain configurable. The model and template no longer actively emit them; historical JSON and unmanaged native values remain preserved, without promising byte-identical file formatting."

[[sources]]
id = "native_roster_read_path_build_23914958"
kind = "install_probe"
path = "ReadMe.txt; BP_GameInstanceWithSettings.uexp"
authority = "first_party_readme_and_read_only_native_consumer_analysis"
description = "Current official ReadMe documents F_ReservedSlots.txt as the MVP roster and explains ReserveSlots=MaxPlayers for whitelist behavior. GameInstance .uexp SHA256 67aa99b1e8faf6fc7eb964f9568ef4f2b323961de34853461e626ab99482343a: the complete Load MVPPlayers script is 0x3e91a..0x3ec21; ReadFileData at 0x3e96a receives the literal F_ReservedSlots.txt at 0x3e96f, then ReadAllLines feeds Set_Add(MVPlayers). Current FetchAdminUsers reads AdminList.txt at 0x41fdd, and LoadBannedPlayers reads F_BannedPlayers.txt at 0x3c481. No F_MVPAccess name occurs in the executable or any of 80,253 script, map and INI resources. The old independent allow-list template and control are retired; existing F_MVPAccess.txt and stored settings remain preserved, and the old path stays in retention and runtime-copy exclusions."

[[sources]]
id = "native_netid_format_build_23914958"
kind = "install_probe"
path = "DedicatedServerEngine.ini; DefaultEngine.ini; HumanitZServer-Win64-Shipping.exe; BP_PlayerState; BP_HMZRCon"
authority = "read_only_official_package_static_analysis"
description = "Current DedicatedServerEngine.ini selects OnlineSubsystem EOS; DefaultEngine.ini has bUseEAS=False, bUseEOSConnect=True and bUseEOSSessions=True. Native GetEOSUserIDFromPS VA 0x140f74480 reads PlayerState UniqueNetID at +0x250, then 0x140866ea0 dispatches ToString at virtual slot +0x30. The EOS constructor 0x140c90e10 assigns type EOS and vtable 0x143869730; that ToString slot is 0x140866e80 and copies the stored string unchanged. Native login path 0x140caa87f stringifies EpicAccountId, 0x140caa88c stringifies ProductUserId, then 0x140caa89f appends | and the nonempty product ID before constructing the EOS identity through 0x140c8b590. Full IDs therefore retain the separator, including an empty EpicAccountId prefix when EAS is disabled; neither stripping the prefix nor assuming a standalone Steam64 ID is valid. Native 0x140cd1540 splits the two parts internally without replacing the stored display string. PlayerState .uexp SHA256 67c0c8c21cca0cc01460e97ec5a1f21dda214af9a7ee2f8cfcb1eab5e21d3444: GetNetID calls GetEOSUserIDFromPS at 0x3952; offline-host fallback is Host_Offline, not Steam64. RCON .uexp SHA256 d8d11e331920e236a3054efabc092a03dc0a4003e8cd06a7704257d35ded221e: FetchPlayers calls GetNetID at 0x1f7b1 and formats Name (NetID); FindPlayerByNetID at 0x22033 performs substring matching, so operator actions require the complete ID to avoid ambiguous targets. Admin/reserved/ban controls use a dedicated codec with unchanged stored setting keys; new entries use complete EOS IDs, while pre-existing Steam64 values are retained for explicit removal rather than silently discarded. No real player IDs were read and no gameplay connection was made. FetchBanned returns the complete file text or Empty! at the game-function boundary, but the current generic Source RCON transport does not establish a command-specific complete-list boundary. Direct NetID ban changes therefore report sent_unverified; list_bans remains available for manual readback rather than being used as automatic proof. Existing Steam64 removal is persisted for restart without sending an inferred current NetID action."
