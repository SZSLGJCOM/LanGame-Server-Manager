[[sources]]
id = "rcon_native_readiness"
kind = "install_probe"
path = "HumanitZServer/REF_GameServerSettings.ini / RCONCommands.txt / HumanitZServer/Binaries/Win64/HumanitZServer-Win64-Shipping.exe"
authority = "installed_humanitz_1_09a_native_protocol_observation"
description = "On 2026-09-20, installed Steam build 23914958 (reference Version=39, runtime Server BuildID=42) created an EOS session and owned the configured game/query UDP endpoints. A2S_INFO returned no accepted reply with RCON disabled or enabled; the RCON-enabled comparison additionally passed the existing authenticated read-only info transport and complete world/player-response validation. The shipped RCONEnabled comment associates RCON with browser ping, but does not establish that ping is A2S. The explicit RCON smoke mode therefore requires an owned game UDP endpoint, a current-run EOS session-created log marker and a complete native info reply over the owned RCON TCP endpoint. This real mode completed creation, readiness, stop, generated-save backup, uninstall preserving four save files, instance archival and cleanup. The actual player-center collector uses this same declared list_online_players transport. This lifecycle mode does not certify native A2S. The current module uses its authenticated complete player_list for overview and global counts; disabled, failed or incomplete RCON remains unknown. Later isolated session-provider evidence is recorded separately below."

[[sources]]
id = "a2s_owned_datagram_comparison"
kind = "install_probe"
path = "HumanitZServer/Binaries/Win64/HumanitZServer-Win64-Shipping.exe / ReadMe.txt"
authority = "installed_humanitz_1_09a_native_protocol_observation"
description = "On 2026-09-21, an isolated copy of build 23914958 completed the declared RCON lifecycle under source snapshot 7bae5a363236. Its actual command line used the documented -port=7777 and -queryport=27015, and its same-generation managed native process owned both UDP endpoints. During the 120-second ready observation window, eight bounded A2S_INFO cases compared loopback and the local Ethernet address, connected and unconnected UDP, and requests with and without an initial all-ones challenge. Sixteen requests received zero datagrams, including unconnected receives; therefore response parsing, split assembly and connected peer filtering do not explain this observation. The log confirms Steam Game Server API initialization and EOS session creation, but does not establish that Steam server advertisement was enabled. This datagram-only comparison did not establish an upstream root cause. A later same-day standalone comparison on the same build used AFD endpoint ownership and a successful UDP control: the default EOS provider received eight query-port datagram indications but sent no reply. Changing only OnlineSubsystem.DefaultPlatformService to Steam in a disposable copy was confirmed by the native provider-loaded log and returned two valid 207-byte A2S_INFO replies (35.5 and 47.5 ms). The native session-provider choice therefore changes A2S behavior in this build. The Steam override is diagnostic only: it changes multiplayer discovery and has no real-client compatibility acceptance. Production keeps the shipped provider, query port and arguments; manager counts use the authenticated complete roster without treating RCON as an A2S response."

