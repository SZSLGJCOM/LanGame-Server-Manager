status = "exhaustive_verified"
last_verified = "2026-09-28"
notes = "Mojang's version_manifest_v2.json resolves latest.release to 26.2, released 2026-06-16. Its version document identifies the formal server.jar as SHA1 823e2250d24b3ddac457a60c92a6a941943fcd6a (60894273 bytes) and requires Java 25. A clean launch with that exact artifact and a Temurin Java 25 runtime generated the 69-key upstream server.properties crosswalk used here. The 26.2 surface adds code-of-conduct, status heartbeat, management-server, spam-threshold, and text-filtering-version properties, and no longer emits the former allow-nether, pvp, command-block, spawn, or debug properties. LanGame replaces the native empty rcon.password default with one persisted 122-bit random secret per instance so the declared RCON command surface is immediately safe to enable. extra_properties remains available for future vanilla or fork-specific keys. On 2026-09-28 the live Mojang manifest resolves stable release 26.3 (2026-09-15); its official release notes change white-list to true by default. New instances follow that default; persisted explicit false remains false. The 69-key first-launch reference remains the historical 26.2 package probe, not a claimed 26.3 live-server run."

