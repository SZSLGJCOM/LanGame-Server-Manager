[[sources]]
id = "mojang_release_26_3_configuration"
kind = "documentation"
path = "server.properties:white-list"
authority = "official_mojang_java_release_notes"
url = "https://www.minecraft.net/en-us/article/minecraft-java-edition-26-3"
description = "Released 2026-09-15 and reverified 2026-09-28. The Server Properties section changes white-list default to true. Live version_manifest_v2.json resolves latest.release to 26.3, version document bc098d111a72e9f6178801544a42099bdfbb0cf2/26.3.json, server.jar SHA1 33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c, 62294556 bytes. The freshly downloaded package's version.json confirms stable 26.3, Java 25 and build_time 2026-09-15T11:20:48+00:00. Read-only inspection of META-INF/versions/26.3/server-26.3.jar!/net/minecraft/server/dedicated/DedicatedServerProperties.class confirms all 69 rendered property names; constructor bytecode at 0x02e4 loads white-list, iconst_1 and getMutable(String, boolean), while enforce-whitelist still uses iconst_0. The two additional legacy keys announce-player-achievements and resource-pack-hash use getLegacyBoolean/getLegacyString and are not new editable properties. Evidence is package metadata and static bytecode inspection; no 26.3 server or world was launched. On 2026-09-30 the live Mojang manifest still resolves latest.release to 26.3, released 2026-09-15, requiring Java 25. The installed 62294556-byte server.jar matches the official SHA1 33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c. This artifact and release-note check is not a new first-launch properties capture."

[[sources]]
id = "official_spam_threshold_semantics_26_2"
kind = "documentation"
path = "https://www.minecraft.net/en-us/article/minecraft-java-edition-26-2"
authority = "official_minecraft_release_notes"
description = "Semantic review on 2026-09-30: chat-spam-threshold-seconds and command-spam-threshold-seconds are independent decaying accumulation thresholds, not minimum intervals between messages. Each message adds one second; each tick removes 1/20 second; zero disables the corresponding kick check. Defaults remain 10. Current installed 26.3 exposes both keys."

[[sources]]
id = "semantic_review_2026_09_30"
kind = "documentation"
path = "https://www.minecraft.net/en-us/article/minecraft-java-edition-26-2"
authority = "first_party_documentation_and_installed_package_semantic_review"
description = "Semantic review on 2026-09-30 of 69 active configuration fields in both languages. Chat and command spam settings use separate accumulation-counter thresholds. allow-flight disables the floating kick check without granting flight. prevent-proxy-connections verifies the connection origin and player IP through the authentication service. No fresh server/client run was performed; existing evidence dates and status remain unchanged."
