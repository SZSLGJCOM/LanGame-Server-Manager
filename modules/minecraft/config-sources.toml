description = "2026-07-13 resolution: latest.release 26.2; version URL https://piston-meta.mojang.com/v1/packages/c8eb00be8a1f9fb9adf70ee415b7e1f746b636e8/26.2.json; server URL https://piston-data.mojang.com/v1/objects/823e2250d24b3ddac457a60c92a6a941943fcd6a/server.jar; server SHA1 823e2250d24b3ddac457a60c92a6a941943fcd6a; downloaded server SHA256 CDACDFB25898DE5E4B4B0E5DDCC2722F77067E46605709C2D886C000EBB63EC5; size 60894273; Java major version 25."

