[[runtime.player_actions]]
id = "whitelist_remove"
label = "Remove username from allowlist now"
label_zh_cn = "按用户名立即移出白名单"
transport = "source_rcon"
command_template = "whitelist remove {{target}}"
target_label = "Player"
target_label_zh_cn = "玩家"
target_placeholder = "Minecraft username from list or whitelist.json"
target_placeholder_zh_cn = "list 或 whitelist.json 中的 Minecraft 用户名"
target_required = true
port_name = "rcon"
password_setting_key = "rcon_password"
enabled_setting_key = "enable_rcon"
destructive = true

[storage]
program_sharing = "shared"
saves_path_template = "{{paths.instance_root}}/{{settings.level_name}}"

[player_management]
status = "runtime_actions"
planned_surface = "source_rcon_and_native_roster_json"
reason = "Minecraft Java reads online names and UUIDs with list uuids over the instance RCON port. Online rows are read-only; existing name-targeted moderation and native access rosters retain their separate controls."
verification = "Confirm enable-rcon/rcon.password/rcon.port, refresh the player list, and compare names and UUIDs with connected clients. The parser follows ListPlayersCommand and en_us.json in the verified Mojang 26.2 package; fixtures are synthetic. Verify existing moderation and native roster side effects separately."

[[runtime.port_roles]]
role = "player"
port_names = ["game", "query"]

[[runtime.port_roles]]
role = "service"
port_names = ["rcon"]
