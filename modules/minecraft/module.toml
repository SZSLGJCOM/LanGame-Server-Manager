[[runtime.player_actions]]
id = "op_player"
label = "Grant OP to username now"
label_zh_cn = "按用户名立即授予 OP"
transport = "source_rcon"
command_template = "op {{target}}"
target_label = "Player"
target_label_zh_cn = "玩家"
target_placeholder = "Minecraft username from list"
target_placeholder_zh_cn = "list 输出中的 Minecraft 用户名"
target_required = true
port_name = "rcon"
password_setting_key = "rcon_password"
enabled_setting_key = "enable_rcon"
destructive = true

[[runtime.player_actions]]
id = "deop_player"
label = "Revoke OP from username now"
label_zh_cn = "按用户名立即移除 OP"
transport = "source_rcon"
command_template = "deop {{target}}"
target_label = "Player"
target_label_zh_cn = "玩家"
target_placeholder = "Minecraft username from list"
target_placeholder_zh_cn = "list 输出中的 Minecraft 用户名"
target_required = true
port_name = "rcon"
password_setting_key = "rcon_password"
