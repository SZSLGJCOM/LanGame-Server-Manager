description = "2026-08-30 sanitized UDP A2S_INFO response from a direct-connection server for which LGSM allocated game port 27018 after UDP 27017 was occupied reported the full Steam game ID 1621690, answered on query port 27019, and carried EDF-advertised game port 27018. This proves query = game + 1 for status probing; it does not establish a steam://connect join contract."

