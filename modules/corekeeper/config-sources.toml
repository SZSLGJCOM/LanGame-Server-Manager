status = "verified_with_direct_connection"
last_verified = "2026-08-30"
notes = "Core Keeper Dedicated Server app 1963720 public build 23543502 was installed and verified on 2026-07-13. A clean-data-path probe generated ServerConfig.json with maxNumberPlayers 100, networkSendRate 20, and seasonOverride -1; ARGUMENTS.txt defines world slots 0 through 29 and season value 0 as disabled. Community roster docs still cover Admins.json and PlayerBans.json. The direct-connection runtime probe remains applicable: anonymous Steam relay login can fail, while -port, -ip, and -password kept the server listening, so LanGame defaults new instances to direct mode. A sanitized 2026-08-30 A2S_INFO probe verified that LGSM allocated game port 27018 after UDP 27017 was occupied, the server answered on UDP query port 27019, and EDF advertised game port 27018."

[[sources]]
id = "empty_world_readiness_2026_09_20"
kind = "runtime_probe"
path = "CoreKeeperServer_Data/Managed/Pug.Other.dll"
authority = "core_keeper_build_23543502_il_and_isolated_native_probe"
description = "Read-only inspection of build 23543502 Pug.Other.dll (SHA-256 3720e5530e22d594cd3ce68d6688b67fdbf68e39ce297504d2ff77ab45084c4b) establishes the fresh empty-server readiness marker. ECSManager.Update requires WorldsAreLoaded, a nonempty serverLoadingDoneQ (InitialLoadingDoneCD), an empty serverConnectionQ (NetworkStreamConnection), and no pending save before calling Pause. Pause emits timescale = 0 only when the loading manager is no longer loading, then disables simulation updates. SaveSystem normally counts 60 seconds of simulation DeltaTime before an automatic save. An isolated fresh-world native run on 2026-09-20 reached that marker and remained without a worlds file during a further 75-second wall-clock observation; this is an initialized, paused empty world, not evidence of a wrong save path. FilesystemManager maps world data to worlds and .world beneath -datapath. Smoke requires the fresh marker plus owned game/query UDP sockets; query ownership alone does not prove world initialization or a player join. The no-save result retains explicit empty-data uninstall/archive coverage and does not claim save generation."

[[sources]]
id = "official_package_window_shutdown"
kind = "runtime_probe"
path = "Launch.ps1"
authority = "installed_core_keeper_dedicated_server_package_and_native_window_probe"
description = "2026-10-01: packaged Quit-CoreKeeperServer uses a non-forced taskkill request for its launched PID and waits for the server. The managed GUI process has no attachable console; its hidden desktop contains Unity.BatchModeWindow. An identity-verified WM_CLOSE to that window exited with code 0 in 1931 ms. The native tail recorded Got quit request, Quit blocked, Running quit handlers and Shutdown, and generated worlds/0.world.gzip. LanGame therefore declares window_close/WM_CLOSE, verifies the target process identity and waits for the complete owned tree to exit without force fallback. This evidence covers the tested installed build and does not promise every future build processes WM_CLOSE."

