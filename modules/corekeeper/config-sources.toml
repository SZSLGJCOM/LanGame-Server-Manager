id = "semantic_review_2026_09_30"
kind = "documentation"
path = "ARGUMENTS.txt"
authority = "first_party_documentation_and_installed_package_semantic_review"
description = "Semantic review on 2026-09-30 of 13 active configuration fields in both languages. A text seed takes precedence over the hashed seed. Creative versus non-creative mode cannot be switched after world generation. Remaining unconfirmed effects or precise units: max_players, max_packets_per_frame, network_send_rate. Native key presence is not gameplay acceptance. No fresh server/client run was performed; existing evidence dates and status remain unchanged."

[[sources]]
id = "native_semantic_resolution_20260930"
kind = "documentation"
path = "CoreKeeperServer_Data/Managed/Pug.Other.dll"
authority = "read_only_installed_package_static_consumer_analysis"
description = "2026-09-30: Build 25537714 Pug.Other.dll confirms maxNumberPlayers limits simultaneous connections (SteamNetworking.OnConnecting, 06009323). The CLI accepts positive Int32 values; 1 through 100 is the LGSM supported UI range, not an asserted native hard cap. PrefsManager.SetDefault initializes 100 before platform and saved-setting overrides, while ARGUMENTS.txt reports 8 for an omitted CLI argument. The 100 default is therefore not claimed as universal. StartGameRPCSystem.OnUpdate (06003049) converts maxNumberPacketsSentPerFrame into a remote-client snapshot target of min(value * 1200, 9440) bytes. Value 1 retains the default target; the local player instead receives the 9440-byte target. NetworkingManager.SetNetworkTickRates (06006593) assigns networkSendRate to ClientServerTickRate.NetworkTickRate and clamps it to the simulation rate. This is the target state-snapshot frequency per client in Hz. EN/ZH names and help now reflect these consumers. The previous three semantic unknowns are resolved without claiming gameplay or load testing. Primary binary SHA256 042b6db4b62a34c5354b19e478302b723b3c89a4e6c6912ffd0ce91c78311938."
