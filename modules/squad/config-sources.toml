authority = "isolated_local_package_owned_endpoint_udp_probe"
description = "2026-09-21, existing local build 25149748, source snapshot aa0eba1f602d: after current-world/session readiness and authenticated complete RCON ListPlayers, eight A2S_INFO cases compared loopback versus local physical IPv4, connected versus unconnected UDP, and absent versus FFFFFFFF initial challenge. Each case had a 700-ms total budget; all 16 sends received zero UDP packets and no accepted INFO. The query endpoint was owned by the same fixture process generation before and after the matrix. One additional standard 25-byte INFO request to the same process's owned game UDP 7787 received zero packets within 300 ms, with unchanged process identity. Actual metadata: task-work/squad-a2s-wire-1789957143623069300.jsonl, squad-a2s-matrix-1789957143623069300.json, and squad-a2s-gameport-aa0eba1f602d.jsonl. Native output native-squad-verified-1789957143674815600.log reports one test passed in 132.11 seconds and completed cleanup, but the managed wrapper returned exit 1 as recorded in squad-a2s-driver-1789957143623069300.log; this is not an additional successful full lifecycle run. A2S remains unverified/nonresponsive, independently of RCON success. No shared parser, module defaults, installed package, or firewall policy was changed."

