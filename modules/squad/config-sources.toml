id = "native_lifecycle_build_25149748"
kind = "runtime_probe"
path = "../../apps/desktop/src-tauri/src/commands_native_lifecycle_tests.rs"
authority = "isolated_local_package_lifecycle_probe"
description = "2026-09-21: the existing local appmanifest reports build 25149748. Source snapshot 7419b939f6d7 passed the native command lifecycle in 84.48 seconds: current-run LogGameState WaitingToStart and LogSquadOnlineServices session-created markers, an owned UDP game endpoint, authenticated complete ListPlayers response, stop, uninstall preserving 5 declared-data files and 20 native configuration files, verified instance archive, and cleanup. Squad has no recoverable persistent world save; declared-data file preservation does not establish world-save support. Earlier A2S requests to the same owned query port timed out while authenticated RCON succeeded. A 2026-09-21 standalone follow-up on the same build preserved the installed LayerVoting.cfg exactly as the production materializer does, loaded BP_GameMode_AAS_C with the default RedpointEOS provider, and confirmed the complete authenticated 80-byte empty roster. An AFD trace with socket lifetime and process ownership correlation recorded all eight query-port INFO datagrams reaching that endpoint, but no receive calls or replies there; the game port and independent loopback UDP control both received normally, with zero trace-event loss. This locates the timeout in native query-socket servicing, not response parsing or datagram delivery. The exact inactive branch in the default provider is not directly observed. A separate disposable-copy override selected STEAM as the default, but native autologin failed and FOnlineSessionSteam::CreateSession rejected unequal bUsesPresence and bUseLobbiesIfAvailable values before the SteamCreateServer task; full readiness was not achieved. That counterfactual is not a compatible repair, and no production provider or session flags are changed. This does not establish that every Squad mode lacks A2S. The smoke contract proves startup through independent world/session/management signals and does not certify A2S, public listing, a player join, or a fresh package download. The previous July package/config-key audit remains separately dated."

