id = "runescapedragonwilds"
name = "RuneScape: Dragonwilds Dedicated Server"
version = "0.1.0"
description = "Dedicated server module for RuneScape: Dragonwilds via SteamCMD."
steam_app_id = 4019830
supported_platforms = ["windows"]

[install]
shared_game_dir = "runescapedragonwilds"
verification_path = "RSDragonwildsServer.exe"

[process]
executable = "RSDragonwildsServer.exe"
args_template = [
  "-log",
  "-NewConsole",
  "-stdout",
  "-FullStdOutLogOutput",
  "-Port={{ports.game.port}}",
  "-QueryPort={{ports.query.port}}",
  "{{runescapedragonwilds.extra_launch_args}}"
]
working_directory_template = "{{paths.install_root}}"
window_policy = "background"
host_surface = "managed_terminal"
host_notes = "Steam appinfo for app 4019830 reports RSDragonwildsServer.exe as the current Windows launch executable. RuneScape: Dragonwilds reads RSDragonwilds/Saved/Config/WindowsServer/DedicatedServer.ini under [/Script/Dominion.DedicatedServerSettings] for owner identity, server name, default world name, admin password, and optional world password. An empty owner_id represents no assigned owner: LanGame writes the explicit non-account marker LGSM_UNASSIGNED_OWNER required by the tested native startup gate. Real owner permissions require the complete in-game Player ID, at most 32 UTF-16 units. LanGame preserves ServerGuid and passes the managed UDP game/query ports. The official -log -NewConsole profile runs on the private desktop with full managed standard output. Shutdown uses the owned Unreal console's game-thread quit rather than Ctrl+C, which exited build 25811348 with STATUS_CONTROL_C_EXIT before normal teardown. Native quit completes orderly teardown but does not flush a new world save; only the most recent completed native autosave is recoverable. Additional arguments remain operator controlled."

[[default_ports]]
name = "game"
protocol = "udp"
port = 7777

[[default_ports]]
name = "query"
protocol = "udp"
port = 27057

[runtime.player_query]
protocol = "none"

[runtime.player_list]
scope = "online"
source = "file_ipc"
response_codec = "dragonwilds_players"
identity_kind = "eos_id"
refresh_interval_ms = 30000
player_action_ids = ["kick_player", "ban_player"]

[[runtime.player_actions]]
id = "save_world"
label = "Save world"
label_zh_cn = "保存世界"
transport = "dragonwilds_save"
command_template = "save"

[[runtime.player_actions]]
id = "kick_player"
label = "Kick player"
label_zh_cn = "踢出玩家"
target_label = "Current EOS account ID"
target_label_zh_cn = "当前 EOS 账号 ID"
target_placeholder = "Select the current player from the verified online list"
target_placeholder_zh_cn = "从已验证在线名单选择当前玩家"
transport = "dragonwilds_native"
command_template = "kick {{target}}"
target_required = true
target_encoding = "raw"
destructive = true

[[runtime.player_actions]]
id = "ban_player"
label = "Ban player"
label_zh_cn = "封禁玩家"
target_label = "Current EOS account ID"
target_label_zh_cn = "当前 EOS 账号 ID"
target_placeholder = "Select the current player from the verified online list"
target_placeholder_zh_cn = "从已验证在线名单选择当前玩家"
transport = "dragonwilds_native"
command_template = "ban {{target}}"
target_required = true
target_encoding = "raw"
destructive = true

[[runtime.player_actions]]
id = "unban_player"
label = "Unban player"
label_zh_cn = "解除封禁"
target_label = "EOS account ID"
target_label_zh_cn = "EOS 账号 ID"
target_placeholder = "32 lowercase hexadecimal digits"
target_placeholder_zh_cn = "32 位小写十六进制账号 ID"
transport = "dragonwilds_native"
command_template = "unban {{target}}"
target_required = true
target_encoding = "raw"
destructive = true

[runtime.shutdown]
grace_period_ms = 15000

[[runtime.shutdown.commands]]
transport = "unreal_console"
command = "quit"
wait_after_ms = 12000

[player_management]
status = "runtime_actions"
planned_surface = "instance-owned dragonwilds_native file_ipc player moderation extension"
reason = "The separately owned UE4SS control extension binds online moderation to the current boot, connection and complete EOS account. Kick uses the native authority function; ban and unban use the pinned game build's native moderation state and confirm the game's persisted KnownPlayerList. Owner/admin grants remain in-game. The read-only roster remains available when control has not been prepared."
verification = "Follow extensions/README.md for loader and control admission. Native capabilities are advertised only after game-thread interface checks; action replies require confirmed effects. Standard Steam A2S_INFO remains unavailable on the verified QueryPort."

[storage]
runtime_copy_exclusions = ["RSDragonwilds/Saved", "langame_player_query", "langame_player_control"]
saves_path_template = "{{paths.install_root}}/RSDragonwilds/Saved/SaveGames"
retained_paths = ["RSDragonwilds/Saved/Config/WindowsServer/DedicatedServer.ini"]

[[runtime.port_roles]]
role = "player"
port_names = ["game", "query"]
