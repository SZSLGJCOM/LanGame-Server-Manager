authority = "official_steam_package_disassembly_and_isolated_native_session_failure"
description = "2026-10-15: Steam public build 25811348, Windows depot 4019831 manifest 201953044557705869, Shipping SHA256 89ed65335a46db067a361d35ae4e6be80857a4c1f2453510600d632879dfbeed, native file version ++dominion+staging-CL-248854. An isolated native server loaded an existing world but rejected an overlong ASCII OwnerId while publishing/consuming session settings, failed EOS session creation and remained ReadyToJoin=0. Fresh disassembly locates the writer's OwnerId length comparison at preferred VA 0x145d6d9e9 and the consuming comparison at 0x145d635e2; both compare FString Num minus its terminator, which counts Windows UTF-16 code units. Both select a limit of 32 for ordinary online operation or 128 when DominionNetworkSubsystem+0x80 is true. The initializer at 0x145dc0420 reads OnlineSubsystem/DefaultPlatformService and enables that flag only when it equals NULL. LanGame's supported online configuration therefore declares one x-lsgm-max-utf16-length value of 32 for owner_id; the generic JSON Schema maxLength scalar-count semantics are unchanged. Empty user IDs continue to materialize as the 21-unit non-account marker LGSM_UNASSIGNED_OWNER. IDs are rejected intact rather than truncated. Real owner authorization and multiplayer joins are outside this evidence."

