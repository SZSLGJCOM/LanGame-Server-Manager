id = "dragonwilds_world_rules_build_25501739"
kind = "runtime_probe"
path = "world-settings.json; RSDragonwilds/Saved/SaveGames/*.sav"
authority = "official_steam_package_metadata_native_autosave_and_production_storage_api"
description = "2026-10-09: Current 1.0 build 25501739, Shipping SHA256 fc7754fe633f55f51abdae828626819d2c0ab243f233a4c33221935e56bfcb1c. The canonical world-settings.json records 66 cooked difficulty definitions with native ranges, precision, defaults and permissions: 63 allow existing-world edits in Custom, FriendlyFire also allows other modes; two Never fields and creation-only NoBuildingStability cannot be submitted as edits. Native getters prefer saved overrides in every mode; Custom missing values fall back to Normal. The verified offline SPUD system-version-8 codec updates both CINF named float entries and the WorldSaveSettings persistence map, preserving unknown data and level chunks. A fresh isolated empty server accepted Custom and BuildingMaterialCostScale=1.5, automatically saved them, and the native golden round-tripped byte-identically. The production storage API then made a verified pre-change backup and wrote 2.0; a native restart logged the matching Applied custom setting and Load: Success. Backend and UI refuse running writes and stale revisions. This proves world-rule loading and persistence for this build, not multiplayer gameplay, graceful shutdown, arbitrary save formats or all later game builds."

