status = "best_effort_verified"
last_verified = "2026-10-09"
notes = "Installed Steam build 24574222 was launched in an isolated copy on 2026-09-08 with fresh DedicatedServer.ini and no original saves. UE 5.6.1 loaded L_World, reached ReadyToJoin=1 and honored the explicit loopback game port. The independent LgsmPlayerQuery extension returned current complete empty rosters through the production bootstrap and native file-IPC reader. Existing configuration keys remain based on the official guide and earlier configuration-specific probes below; this player-query test does not claim a new acceptance run for every setting. Native A2S and moderation remain unavailable."

[[sources]]
id = "configuration_review_20260930"
kind = "documentation"
path = "https://runescapedragonwilds.help.jagex.com/hc/en-gb/articles/45365343055249-Dedicated-Servers-How-to-Guide"
authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: After the managed update, the installed app 4019830 manifest reports build 25501739 and Windows depot 4019831 manifest 8698681730846329652. The Shipping executable SHA256 is fc7754fe633f55f51abdae828626819d2c0ab243f233a4c33221935e56bfcb1c. The packaged DedicatedServer.ini SHA256 is 4c4ae402747c05f4fe89dcbf4d29b94aae0f08fa79f090e675a1c28179973577; its five keys remain OwnerId, ServerName, DefaultWorldName, AdminPassword and WorldPassword, matching the current Jagex guide. PlatformPolicy is still omitted from that file. Fresh string cross-references, PE exception-table lookup and disassembly of this executable independently confirm the PlatformPolicy key reference at preferred VA 0x14595817c, missing/empty-value assignment of zero at 0x1459581b5, and nonempty-name enum parsing. The current reflected enum remains Crossplay=0, PC=1, PlayStation=2, Xbox=3 and Nintendo=4, matching the existing schema. The separate build-25465077 source and acceptance fixture remain historical evidence; their binary offsets are not carried forward. No newly documented configuration keys or launch options were found in the guide or September 29 hotfix notes. The unresolved crash-dump field and player/world-management boundaries remain unchanged. This is read-only package and documentation evidence; no server or client was launched."

