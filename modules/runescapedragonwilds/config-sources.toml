authority = "official_steam_package_static_analysis"
description = "Steam app 4019830 public build 25465077, Windows depot 4019831 manifest 1952040889757266716, officially validated on 2026-09-28. Shipping executable SHA256 479c7a9e59aed86ad999febfa91e3975b4183e26f66a82c242992e50d72fdc18. PlatformPolicy is a uint8-backed EDomPlatformFamily property at object offset 0xA8. Its reflected enum table names Crossplay=0, PC=1, PlayStation=2, Xbox=3, Nintendo=4. The native reader at preferred VA 0x145958100 reads PlatformPolicy from the dedicated-server configuration, explicitly assigns Crossplay for missing/empty values, parses nonempty names through that enum and reports invalid names. The shipped WindowsServer INI omits this key. LanGame leaves it unwritten unless explicitly selected, preserving existing native restrictions. This is static configuration evidence, not a multiplayer or extension-compatibility test."
