id = "dragonwilds_world_selection_build_25501739"
kind = "install_probe"
path = "RSDragonwilds/Binaries/Win64/RSDragonwildsServer-Win64-Shipping.exe: dedicated startup world selection"
authority = "current_native_configuration_reflection_and_startup_consumer"
description = "Build 25501739: DefaultWorldName is reflected at dedicated settings offset 0x98. Startup consumer 0x145bee850 matches it against metadata WorldName using ASCII-insensitive comparison, then at 0x145beec28 selects maximum CINF TimeOfSave; 0x145beecfd loads that saved world. Filesystem mtime and SPUD INFO Timestamp are not the selector. The manager reads bounded INFO metadata, matches the configured name and refuses ambiguous highest timestamps. No matching save is treated as a world that has not yet been created."

