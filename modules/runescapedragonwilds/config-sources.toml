authority = "repository_behavior_and_browser_acceptance"
description = "2026-10-10: Gameplay settings use nine peer sidebar categories based on purpose, rather than a shared World Rules parent. World owns mode and event frequencies; friendly fire belongs to Player rules. All 63 saved-world controls are individually searchable and appear exactly once. Ordinary rule edits debounce and automatically save; mode transitions preserve native order and Custom values. Saves participate in the existing start barrier, retain newer in-flight edits, preserve drafts on compare-and-swap failures and never blindly resend them. Range and step remain input constraints without duplicate prose. Browser acceptance substitutes only the native transport and verifies both languages at 1280 and 1024 px, including actual mouse slider interaction, readonly guards and unmount cleanup. The production saved-world codec and backup boundary are unchanged; this source does not expand the prior native or multiplayer acceptance scope."
