status = "exhaustive_verified"
last_verified = "2026-07-13"
notes = "SteamCMD public app info and the installed manifest match at buildid 3488796 on 2026-07-13. The current Assembly-CSharp.dll embeds the exact generated server.cfg inventory and defaults; its SteamDSConfig accessors also prove that the consumed cheat key is allowCheats and that the generated serverContact line has no current accessor. The historical Steam community guide independently documents the operator surface and -configfilepath startup flow. A 2026-09-08 isolated exact-build A2S probe established the zero-player query contract; read-only player queries are now enabled. Host-callable moderation remains unavailable."

[[sources]]
id = "native_loader_control_20261001"
kind = "install_probe"
path = "modules/theforest/control/LanGameTheForestControl.cs"
authority = "installed_build_3488796_metadata_and_isolated_native_loader_probe"
description = "2026-10-01 exact Assembly-CSharp hash BC0C9B79B125CE9A6D96D532359FDE8A539159378BD9F558309572B9744A9D7E: enabled DllModLoader in level0 loads DllMods DLLs and invokes exported static entry methods whose names start with two underscores. Isolated snapshot 03cddfb41cb4 logged execution of an inert marker and Dedicated Server Running. Checkpoint synchronously renames the old resume file and writes its replacement when serialization is not suspended; native shutdown is a separate coroutine. The BCL-only bridge accepts help, status, save and shutdown over owned stdin on the Unity main thread. Isolated snapshot 899e30c927e4 passed current-run help/status/save acknowledgements, changed nonempty checkpoint data in the declared saves directory, a 30-second observation, two native saves and normal shutdown with matching run identity and exit code zero in 2454 ms. The owned stdin reader is cancelled and joined before the native shutdown coroutine. The game build and bridge remain fingerprint-gated; this isolated probe does not establish multiplayer/client or UI behavior. The installed old Mono requires ReferenceEquals, the one-argument Monitor.Enter and a bridge-owned save callback delegate; emitted type/method checks cover these differences. Installed FileStream.SafeFileHandle creates another owning wrapper without transferring its raw handle, so metadata uses independently owned Win32 handles across native garbage collections. Real anonymous-pipe cancellation tests cover an idle reader and partial frame. The showLogs option was excluded as a shutdown fix because it attached the parent console and failed managed console ownership verification."

[[sources]]
id = "native_world_readiness_20261001"
kind = "install_probe"
path = "modules/theforest/control/LanGameTheForestControl.cs"
authority = "installed_build_3488796_metadata_and_existing_instance_observation"
description = "Existing-instance run 128 on 2026-10-01 reached the native Dedicated Server Running banner and previous ready health while the bridge status still reported world_ready=False and serialization_suspended=False. Help and subsequent normal shutdown worked, but the earlier readiness claim was invalid. Installed IL confirms DedicatedHost is set during bootstrap and the Running banner precedes Scene.FinishGameLoad. The bridge now observes DedicatedHost, FinishGameLoad and unsuspended serialization on the Unity main thread together with its live owned input reader; exact world_ready=True and world_ready=False transition lines drive health and startup checks. Status replies with additional fields are not standalone transition markers. A C# regression calls the production idle MoveNext path with native-state fixtures: the previous implementation emitted no transition, and the corrected implementation verifies all gates, one emission per change and revocation. Final exported source 453921bdccc0, existing-instance run 130, verified native and backend readiness, a 30-second stable observation, visible CMD help/status/save with fresh acknowledgements and status world_ready=True serialization_suspended=False, a 196240-byte manual save, and normal exit code zero in 2688 ms. No independent native window was visible; all 647 event lines matched the persisted log, and three stopped UI snapshots exactly matched the retained same-source tail. This does not establish multiplayer/client or save-restart recovery behavior."

[[sources]]
id = "native_save_directory_20261001"
kind = "install_probe"
path = "modules/theforest/templates/server.cfg.hbs"
authority = "installed_build_3488796_metadata_and_isolated_native_save_probe"
description = "Installed SaveSlotUtils.GetUserPath returns nonempty SteamDSConfig.SaveFolderPath unchanged; GetLocalSlotPath concatenates that string directly with player mode, a separator, save slot and a final separator. The storage renderer emits paths.saves_dir without a trailing separator. The previous template therefore placed multiplayer saves in a sibling savesMultiplayer directory, outside the declared saves inventory. Snapshot 95936879caf1 received the bridge's new-file-identity save proof but failed that inventory check. The template now appends a separator. Startup rejects nonempty or non-plain old sibling save directories with recovery instructions rather than silently starting a new world. Snapshot 899e30c927e4 then verified the new checkpoint beneath the declared Multiplayer save slot, with both manual save and shutdown-save acknowledgements. No existing worlds are automatically moved or overwritten."

