id = "semantic_review_20260930"
kind = "documentation"
path = "https://github.com/SmartlyDressedGames/U3-SDK/blob/aba323a81558487ad8d2167ac20da9c0fd72b6d9/Assets/Runtime/Assembly-CSharp/Unturned/Settings/PlayConfigData.cs"
authority = "native_package_and_documentation_semantic_review"
description = "2026-09-30: 301 presentation entries reviewed in EN/ZH against the referenced package/docs. Armor multipliers affect damage received, with the correct direction; barricade/structure gun/melee/repair controls include the object in their names. PvP/PvE experience and skill fractions are retained, not lost. Legacy rain/snow settings apply only to maps using legacy weather; intervals/durations use game days; modern frequency is inverse and duration 0 disables. Respawn_Time governs cleanup of wrecked vehicles; explosion-through-attached-barricade scope clarified. Full-moon spawn multiplier is not every night; non-headshot value is damage received; boss quest interval is seconds. Team count rather than individual players; stage-radius retained fraction; shrink speeds m/s. Automatic bleeding-stop and leg-healing controls, airdrop speed/drop-force direction, server mode versus mode-config override distinguished. Boundaries: Pinned upstream source comments are not proof that every current-build runtime default/effect was retested; changes since the pinned revision outside the existing current-package inventory remain a boundary."

[[sources]]
id = "native_semantic_resolution_20260930"
kind = "documentation"
path = "Unturned_Data/Managed/Assembly-CSharp.dll"
authority = "read_only_installed_package_static_consumer_analysis"
description = "2026-09-30: Build 25444106 Assembly-CSharp.dll contains 282 public native fields across 13 configuration categories. The current official U3-SDK main still resolves to aba323a81558487ad8d2167ac20da9c0fd72b6d9. PlayConfigData.cs remains byte-identical to the reviewed source, SHA256 c5e6a7961c465faa289dc9ca0cb01e09b56c04e86985e32a09146d62bc72369f. All 281 source fields are present, and their primitive types match. The package additionally contains Server.BattlEye_Secure, already modeled in LGSM and initialized to true by ServerConfigData..ctor (06004298). The two obsolete fields are marked NotSerialized in the actual assembly; six shutdown/update fields remain owned by Maintenance. The 274 active configuration controls need no additional keys. This resolves the current-package inventory difference without claiming whole-assembly source equivalence or fresh multiplayer acceptance. Primary binary SHA256 269794d065f9f115eec269c80a62c09f3fe2beee34da818063bd1d5b3491692a."
