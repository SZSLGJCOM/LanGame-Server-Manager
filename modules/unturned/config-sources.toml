status = "best_effort_verified"
last_verified = "2026-09-28"
notes = "The historical anonymous app_update 1110390 validate probe recorded buildid 24080174, TargetBuildID 24080174, SizeOnDisk 1860413320, and depots 1004/1110391/1110393/1110394. Current first-party 3.26.3.12 source and installed build 25107012 identify 282 native fields in Config.txt dictionary blocks: 274 settings are covered, six scheduled shutdown/update controls remain maintenance-owned, and two obsolete fields are not serialized. This corrects the earlier metadata-only interpretation of dotted property paths: Browser/Server/Players are native DAT dictionaries, not literal dotted keys. Unset values retain unowned native values; clearing an unchanged managed override releases it to native difficulty/map defaults. Unknown fields/comments and externally changed released values are retained."

[[sources]]
id = "windows_console_input_build_25444106"
kind = "documentation"
path = "https://github.com/SmartlyDressedGames/U3-SDK/blob/aba323a81558487ad8d2167ac20da9c0fd72b6d9/Assets/Runtime/Assembly-CSharp/Unturned/Command/ThreadedConsoleInputOutput.cs"
authority = "first_party_source_and_read_only_installed_managed_assembly"
description = "2026-10-01: the pinned official Windows handler selects ThreadedWindowsConsoleInputOutput. ThreadedConsoleInputOutput.consoleMain checks Console.KeyAvailable before Console.ReadLine. Installed app 1110390 build 25444106 Assembly-CSharp.dll SHA256 269794d065f9f115eec269c80a62c09f3fe2beee34da818063bd1d5b3491692a contains the same call sequence, and its XML describes the Win32 console handler. Ordinary redirected-pipe writes do not establish keyboard input availability. LanGame selects its existing managed pseudo-console transport while retaining native Save and Shutdown commands. This is static contract evidence and a candidate adaptation; new real-server Help, Save, Shutdown and complete output acceptance remain required."

[[sources]]
id = "configuration_review_20260930"
kind = "documentation"
path = "https://docs.smartlydressedgames.com/en/latest/servers/server-configuration.html"
authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: Publisher news identifies 3.26.3.12 on 2026-09-21; installed app 1110390 reports build 25444106. Current official U3-SDK master PlayConfigData.cs is byte-identical to the recorded aba323a81558487ad8d2167ac20da9c0fd72b6d9 source (SHA256 c5e6a7961c465faa289dc9ca0cb01e09b56c04e86985e32a09146d62bc72369f). The 282-field inventory therefore has no source delta: 274 controls, six maintenance exclusions and two obsolete fields. This checks source inventory and does not repeat native DAT preservation or multiplayer acceptance."

[[sources]]
id = "native_config_3_26_3_12"
kind = "config_file"
path = "Servers/<ServerID>/Config.txt"
url = "https://github.com/SmartlyDressedGames/U3-SDK/blob/aba323a81558487ad8d2167ac20da9c0fd72b6d9/Assets/Runtime/Assembly-CSharp/Unturned/Settings/PlayConfigData.cs"
authority = "installed_build_25107012_and_official_source_3_26_3_12"
description = "2026-09-28 full inventory: installed generated Config.txt and official source commit aba323a81558487ad8d2167ac20da9c0fd72b6d9 agree on 282 fields in 13 categories. 11 fields were previously modeled; 263 are now typed. Six automatic shutdown/update policies belong to maintenance and two obsolete fields are excluded. New fields remain unset by default, preserving existing native values and difficulty/map defaults. Config.txt uses real nested DAT category dictionaries; dotted paths are metadata only. The renderer and preservation merge are independent implementations; no SDK source or prose is redistributed."

