[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://playwindrose.com/dedicated-server-guide"
authority = "native_package_and_documentation_semantic_review"
description = "Semantic review on 2026-09-30 of 23 presentation entries in English and Chinese against the referenced native package and documentation. P2pProxyAddress and DirectConnectionProxyAddress are local listen/interface addresses. Invite codes follow native character and case rules, and the EU region identifies the service scope. DirectConnectionServerAddress is reserved and currently unused; it has no editable control or generated template entry. Existing unknown native file values remain preserved. Boundaries: No new native runtime/gameplay acceptance is claimed; historical verification dates remain unchanged."

[[exclusions]]
source = "steamcmd_server_package"
key = "-log"
reason = "Fixed first-party native console logging flag for the managed private-desktop launch profile; runtime control remains subject to real-server acceptance."

[[sources]]
id = "native_bootstrap_and_stdout_20261001"
kind = "runtime_probe"
path = "R5/Binaries/Win64/WindroseServer-Win64-Shipping.exe and R5/Saved/Logs/R5.log"
authority = "installed_package_and_existing_instance_startup_failure_observation"
description = "The 2026-10-01 existing-instance attempt reused a complete retained world before its new engine initialized and stopped without confirming normal exit. The installed engine contains stdout, FullStdOutLogOutput and Engine is initialized. Leaving FEngineLoop::Init(); an earlier native transcript places that stage before world startup and records ConsoleCtrl RequestExit with orderly shutdown. Engine initialization belongs to the lobby: the observed world reached its explicit R5LogCoopProxy Host server is ready for owner to connect declaration 18.7 seconds later. Bootstrap now requires that new host-ready declaration after its pre-spawn managed-log cursor plus matching native world IDs, and uses non-forceful complete-tree shutdown. Formal health observes the same current-run stage; lobby map completion and listeners cannot establish readiness, and later map loading or exit revokes it. Both bootstrap and formal launch include full stdout logging. Isolated regression tests establish old-world/old-log rejection and ownership retention after native control failure; fresh real-server acceptance of the changed lifecycle remains required."

[[exclusions]]
source = "steamcmd_server_package"
key = "-stdout"
reason = "Fixed native standard-output routing for both initialization and formal server runs; not an operator setting."

[[exclusions]]
source = "steamcmd_server_package"
key = "-FullStdOutLogOutput"
reason = "Fixed output verbosity so ordinary native lifecycle messages reach the managed console."

[[sources]]
id = "native_console_quit_20261001"
kind = "runtime_probe"
path = "R5/Binaries/Win64/WindroseServer-Win64-Shipping.exe"
authority = "installed_binary_and_isolated_native_runtime"
description = "Installed build 24913903 supports Unreal -NewConsole with FConsoleWindow, Edit 0x8804 and RunCommand Button 0x8805. Three local crash dumps reproduce Ctrl+C shutdown access violation at shipping RVA 0x12af547 after an off-game-thread SaveBackupsSync retains a promise until static teardown. An isolated private-desktop copy reached HostReady, accepted exactly one native GUI quit, completed both synchronous backups on the game thread with Result true, and exited code 0 with its complete owned Job empty. The observer's initial whitespace mismatch and separate successful sender are recorded independently. Product bootstrap and shutdown now share this native command channel; full managed-instance acceptance is tracked separately."

[[exclusions]]
source = "steamcmd_server_package"
key = "-NewConsole"
reason = "Fixed native GUI command channel hosted on the managed private desktop. Unlike ConsoleCtrl RequestExit, quit executes the native shutdown and backup work on the game thread. Standard output remains captured with stdout and FullStdOutLogOutput."
