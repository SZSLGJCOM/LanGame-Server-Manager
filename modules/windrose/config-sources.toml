status = "best_effort_verified"
last_verified = "2026-07-13"
notes = "SteamCMD anonymous app_update 4129620 validate completed on 2026-07-13 at build 24094403 (SizeOnDisk 3101317483). The installed DedicatedServer.md and current official guide document the R5/ServerDescription.json surface plus RocksDB_v2 per-world settings. LanGame renders stable server fields and stages world parameters only after one exact existing world passes folder, WorldDescription islandId, selected schema ID, and ServerDescription WorldIslandId identity checks. Immediately before a stopped instance starts, it applies the staged JSON and runs the official R5WorldDescriptionUpdater.exe with the verified relative world path. Unknown JSON keys are preserved."

[[sources]]
id = "configuration_review_20260930"
kind = "documentation"
path = "https://playwindrose.com/dedicated-server-guide/"
authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: Installed app 4129620 reports build 24913903. Its DedicatedServer.md (SHA256 f4f55eb4f2d72faa142479df17903f1b450af354301eca7b8d8d9a941818dbe3) and the current official guide agree on the server fields and ten custom world parameters. Both mark DirectConnectionServerAddress as reserved and currently unused, so it is excluded from editing and omitted from the generated overlay; existing native values remain preserved. A read-only inspection of a native-generated world from build 24913903 confirmed the case-sensitive WorldDescription.islandId field matches both its folder name and ServerDescription_Persistent.WorldIslandId. No fresh world-updater or completed lifecycle acceptance is claimed."

