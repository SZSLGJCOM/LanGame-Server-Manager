id = "enshrouded"
name = "Enshrouded Dedicated Server"
version = "0.1.0"
description = "Dedicated server module for Enshrouded via SteamCMD."
steam_app_id = 2278520
supported_platforms = ["windows"]

[install]
shared_game_dir = "enshrouded"

[process]
executable = "enshrouded_server.exe"
args_template = []
working_directory_template = "{{paths.install_root}}"
window_policy = "background"
host_surface = "managed_terminal"
host_notes = "The dedicated server runs in the background from the instance's private runtime. Its native enshrouded_server.json is written before launch, and server output is captured in the instance logs."

[[default_ports]]
name = "query"
protocol = "udp"
port = 15637

[runtime.bind_address]
mode = "strict"
port_names = ["query"]
startup_timeout_ms = 120000

[runtime.player_query]
protocol = "a2s_info"
port_names = ["query"]

[player_management]
status = "runtime_actions"
planned_surface = "instance-owned enshrouded_native file_ipc identity and moderation; persistent enshrouded_server.json roster"
reason = "The fingerprinted native extension captures the server's own copied player identities and dispatches moderation on its server thread, preserving native protection. Ban and unban require canonical bannedAccounts readback; kick and ban require confirmed departure. Unknown builds or unavailable extensions retain read-only query/log names."
verification = "Read the file_ipc player list through the enshrouded_native command surface, verify executable identity, native-copy generation and protected targets, then test ban, rejected reconnect and unban recovery with a disposable account. Confirm canonical bannedAccounts in enshrouded_server.json; native function return alone is not confirmation."

[runtime.shutdown]
grace_period_ms = 15000

[[runtime.shutdown.commands]]
transport = "console_ctrl_c"
command = "CTRL_C"
wait_after_ms = 12000

[storage]
runtime_copy_exclusions = ["enshrouded_server.json", "mods", ".langame-enshrouded-control", ".langame-enshrouded-control-owner.json", ".langame-enshrouded-control-state.json"]
saves_path_template = "{{paths.instance_root}}/savegame"
retained_paths = ["enshrouded_server.json"]

[mods.source]
provider = "nexus"
label = "Nexus Mods"
url = "https://www.nexusmods.com/enshrouded"
install_note = "Enshrouded has no official server mod API; install and patch Shroudtopia or EML separately, then stage downloaded Nexus packages into the loader-created mods directory. Some mods must also be installed on every player client."

[mods.manual_staging]
target_template = "{{paths.install_root}}/mods"
target_label = "mods"
accepts = ["folder", "zip", "dll"]

[[runtime.port_roles]]
role = "player"
port_names = ["query"]

[runtime.player_list]
source = "file_ipc"
response_codec = "enshrouded_native_players"
identity_kind = "enshrouded_account_id"
player_action_ids = ["kick_player", "ban_player"]
refresh_interval_ms = 15000

[[runtime.player_actions]]
id = "kick_player"
label = "Kick player"
label_zh_cn = "踢出玩家"
target_label = "Current native accountId"
target_label_zh_cn = "当前原生账号 accountId"
target_placeholder = "Select the current player from the verified online list"
target_placeholder_zh_cn = "从已验证在线名单选择当前玩家"
transport = "enshrouded_native"
command_template = "kick {{target}}"
target_required = true
target_encoding = "raw"
destructive = true

[[runtime.player_actions]]
id = "ban_player"
label = "Ban player"
label_zh_cn = "封禁玩家"
target_label = "Current native accountId"
target_label_zh_cn = "当前原生账号 accountId"
target_placeholder = "Select the current player from the verified online list"
target_placeholder_zh_cn = "从已验证在线名单选择当前玩家"
transport = "enshrouded_native"
command_template = "ban {{target}}"
target_required = true
target_encoding = "raw"
destructive = true

[[runtime.player_actions]]
id = "unban_player"
label = "Unban native accountId"
label_zh_cn = "解除原生账号封禁"
target_label = "Native accountId"
target_label_zh_cn = "原生 accountId"
target_placeholder = "Account ID from the native ban roster"
target_placeholder_zh_cn = "原生黑名单中的 accountId"
transport = "enshrouded_native"
command_template = "unban {{target}}"
target_required = true
target_encoding = "raw"
destructive = true

# Verified native server-thread world save; independent of player moderation.
[[runtime.player_actions]]
id = "save_world"
label = "Save current world"
label_zh_cn = "立即保存世界"
transport = "enshrouded_save"
command_template = "save"
