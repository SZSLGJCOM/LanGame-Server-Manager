status = "best_effort_verified"
last_verified = "2026-09-08"
notes = "Enshrouded Dedicated Server app 2278520 public build 23178631 and the installed enshrouded_server_readme.txt Version 0.9.0.0 were verified on 2026-07-13. The generated clean configuration still matches LanGame's 74 modeled root, gameSettings, preset userGroup, custom-userGroup, and bans fields, so no schema or launch change was required. On 2026-09-29 the same installed build's Version 0.9.0.0 README was rechecked: all 19 documented tags match the schema checklist and native-output allowlist. Player bans remain owned by Player Access, not Configuration. On 2026-09-30 static inspection of the same current executable established bans.accountId as uint64 and bans.banDate.value as sint64. AccountAction carries a HashKey64 into the native ban table; the player editor therefore accepts native decimal account hashes without converting platform IDs. This evidence does not establish a Steam64-to-hash algorithm or native ban/rejoin enforcement and does not renew historical native-launch evidence."

