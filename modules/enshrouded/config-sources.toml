status = "best_effort_verified"
last_verified = "2026-10-16"
notes = "Official Enshrouded 1.0.0.1 app 2278520 build 25967645, depot 2278521 manifest 3715394091293008757 and native SVN 1267041 were verified in isolation on 2026-10-16. LanGame models 75 fields: 74 in Configuration and one ban roster owned by Player Access. The packaged Version 1.0.0.0 README covers all 38 modeled gameSettings. Flame Level for Shroud Removal is validated at effective integer 1-11 (default 11), and Automatic belongs only to randomSpawnerAmount; build 25936466 previously clamped README inputs 0 and 20 to 1 and 11, while the final hotfix probe directly accepted 1 and 11. Updraft charge duration has no verified dedicated-server key. Five native cycles passed old-world upgrade, restart, post-migration manual restore, pre-migration manual restore and re-upgrade, and native rotating-backup restore; every fresh log reached world deserialization and Run, matched all 38 requested gameplay values, and retained all four role groups. Production saves preserve synthetic nonempty bannedAccounts records and unknown metadata in managed JSON through native typed rewrite; only an explicit target removal unbans that account. Production DLL/folder/ZIP staging retained exact payloads and removed them before native launch. Original saves, configurations, executable and verified recovery copies remained unchanged; owned processes and the disposable fixture were released. The old-world sample is three files totaling 3634 bytes with no persisted entities. Complex worlds, real clients, native ban enforcement, Steam64 conversion, community loader execution and the full 1.0.0.1 Tauri/AutoStop lifecycle remain outside this evidence; historical sources retain their original build and scope."

[[sources]]
id = "native_1_0_0_1_five_cycle_25967645"
kind = "runtime_probe"
path = "apps/desktop/src-tauri/src/commands_enshrouded_compatibility_tests.rs: isolated_enshrouded_old_world_upgrade_restart_and_backup_restore"
authority = "isolated_official_native_with_production_storage_backup_restore_and_mod_staging"
description = "2026-10-16, official 1.0.0.1 build 25967645, depot 2278521 manifest 3715394091293008757, executable SHA256 4de2acdd3b18e562f129bc488a2daea2da16b00341497304423e1e18c49a83ba, SVN 1267041. The managed test exited 0 with five tests and unchanged hashes for all 47 bound inputs. Its five real native phases were upgrade, restart, restored-restart, premigration-restored-upgrade and native-backup-restored-restart. Each fresh launch log established successful world deserialization and LoadEcsScene to Run, all 38 requested effective Custom gameplay values matched, and all four role groups survived native typed rewrite. Flame inputs 1 and 11 and randomSpawnerAmount=Automatic were directly accepted. The first 330-second observation captured a 42833-byte running world and ten native backup generations with ten distinct SHA256 values. Original old-format payloads remained byte-identical under migrated/. Production Manual backups matched every stopped save byte; production post-migration and pre-migration restores retained exact safeguards, and an actual native rotating backup loaded on the fifth cycle. Synthetic nonempty canonical bannedAccounts records retained exact uint64 IDs, names and dates; unknown metadata survived in managed JSON after native serialization removed it, and explicit Player Access removal affected only added target 42. Real production staging imported exact synthetic DLL/folder/ZIP payloads, rejected EXE, preserved existing files and removed owned payloads before native launch; no loader or third-party Mod was executed. A separate loopback A2S observation verified an empty player roster and closed its socket. Query and TCP listeners stayed loopback; two wildcard UDP transport ports were explicitly authorized for temporary testing. Final SHA256 audit confirmed all six original save/configuration files, their six recovery copies, three immutable golden save files and the original installed executable unchanged, with zero owned native processes and the disposable fixture removed. Evidence is retained under <validation-root>/validation-final/report.json, <validation-root>/native-run.json, <validation-root>/original-data-final-audit.json and <validation-root>/player-query-nativefull.json. The three-file 3634-byte source world has no persisted entities: complex-world preservation, real clients/gameplay, native ban/rejoin enforcement, Steam64 conversion, community loaders, the Tauri start/stop path and AutoStop backups are not established."

