description = "2026-10-15/16, public build 25936466 / engine SVN 1265863. An immutable three-file, 3634-byte old-world copy was launched in an isolated lower-level native probe. Native savedata2-migration selected its index/container and logged Read result:ok; the initial world0.ksd and native backup were both 598 bytes (SHA256 bbee7db91a2067d428dd7ef72cd36c5227a8b8f9bfdf491ac477377ab9791fb7). All three prior payloads remain byte-identical under migrated/. Current logs from upgrade, restart and restored-restart each show successful savegame deserialization followed by LoadEcsScene to Run and orderly Run/Shutdown/Destroy/Invalid/CloseLog. A live world checkpoint was 42833 bytes; its hash reappears in the rotating native backups, and all ten native backup generations were retained. Production manual backups match every stopped save byte; production restore removed a post-backup sentinel and preserved an exact safeguard. Each native launch exited 0 and its complete owned process tree was released; the disposable fixture was removed. The native effective setting echoes accept Automatic, clamp Flame input 0 to 1 and 20 to 11. Two additional wildcard UDP transport ports were explicitly authorized; query and TCP listeners stayed loopback. Steam interface warnings and a Benchmark component error were present, with no observed save-load, migration, write or checksum failure. This tiny empty-entity sample is not evidence of complex-world preservation, gameplay/client compatibility, or the full Tauri/AutoStop lifecycle (scoped firewall admission required administrator rights)."

