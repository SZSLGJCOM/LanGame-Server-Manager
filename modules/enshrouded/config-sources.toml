id = "native_ban_contract_build_23178631"
kind = "documentation"
path = "<validated-install-root>/enshrouded_server.exe"
authority = "installed_enshrouded_dedicated_server_package"
description = "Read-only static inspection on 2026-09-30; build 23178631 exe SHA256 001c1b40ed091d8c1aee583adde3800d7c858ae2c7f4dff54fca2938b2be1637. Native keen::ds::g38_config::AccountBan fields are accountId:uint64, displayName:string, characterName:string, banDate:CalendarTimeStamp with value:sint64. JSON deserialization at VA 0x1404b53e7 and serialization at VA 0x1404ba148 read/write numeric accountId; date read/write uses nested value. AccountAction.accountIdHash has type keen::HashKey64 (descriptor VA 0x141064ef0), offset 8; VA 0x14069db63-0x14069db6f passes its value to Ban/UnBan, and config loading at VA 0x140686b60-0x140686b63 copies accountId unchanged into the ban table. No native process or player session was started for this inspection. Synthetic fixtures validate exact serialization and storage only, not ban enforcement or a Steam64 conversion algorithm."

