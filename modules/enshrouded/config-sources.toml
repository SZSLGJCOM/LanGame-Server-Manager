[[sources]]
id = "installed_server_readme"
kind = "documentation"
path = "<validated-install-root>/enshrouded_server_readme.txt"
authority = "installed_enshrouded_dedicated_server_package"
description = "Installed build 23178631 README Version: 0.9.0.0 rechecked 2026-09-29; SHA256 3027462ef20c0839f13e3f8dd3b4981672bb6f6abc6ccd596c9e0d26c15d9495. Server tags allow describing availability, language and gameplay focus. Its 19 tag values exactly match the schema checklist and materializer allowlist: LookingForPlayers, English, German, French, Italian, Japanese, Korean, Polish, Portuguese, Russian, Spanish, Thai, Turkish, Ukrainian, Chinese, Taiwanese, BaseBuilding, Exploration, Roleplay. It also documents preset/custom userGroups and bans fields accountIDHash, displayName, characterName and Unix banDate. Bans are player-access data and must not gain a duplicate Configuration editor. Rechecked 2026-09-30: installed build 23178631 README SHA256 3027462ef20c0839f13e3f8dd3b4981672bb6f6abc6ccd596c9e0d26c15d9495 has 58 distinct documented JSON keys, all represented by typed, grouped or excluded contracts. The official gameplay reference still identifies version 0.9.0.0. No new native run is claimed."

