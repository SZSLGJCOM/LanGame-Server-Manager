description = "Seven isolated native launches on 2026-09-08 with public build 23178631 verify role ordering by enabled permission count, including equal-count disjoint roles. Omitted custom permissions become canEditWorld=true and the other four permissions=false. The fixture records sanitized inputs and native outcomes; it describes this tested build rather than guaranteeing future native behavior."

[[sources]]
id = "ban_records"
kind = "generated_roster"
path = "enshrouded_server.json"
authority = "official_enshrouded_bans_array"
description = "The official default JSON includes bans, owned by Player Access. The packaged Version 0.9.0.0 README describes accountIDHash and a Unix banDate semantically. Static inspection of build 23178631 confirms numeric uint64 accountId and object-shaped banDate with sint64 value; native account hashes are entered as exact decimal strings, with no Steam64 conversion. Existing numeric text is not reinterpreted as a platform ID. Enforcement after a real player ban/rejoin remains untested."
url = "https://enshrouded.zendesk.com/hc/en-us/articles/20453241249821-Server-Gameplay-Settings"

[[sources]]
id = "native_ban_contract_build_23178631"
kind = "documentation"
path = "<validated-install-root>/enshrouded_server.exe"
authority = "installed_enshrouded_dedicated_server_package"
description = "Read-only static inspection on 2026-09-30; build 23178631 exe SHA256 001c1b40ed091d8c1aee583adde3800d7c858ae2c7f4dff54fca2938b2be1637. Native keen::ds::g38_config::AccountBan fields are accountId:uint64, displayName:string, characterName:string, banDate:CalendarTimeStamp with value:sint64. JSON deserialization at VA 0x1404b53e7 and serialization at VA 0x1404ba148 read/write numeric accountId; date read/write uses nested value. AccountAction.accountIdHash has type keen::HashKey64 (descriptor VA 0x141064ef0), offset 8; VA 0x14069db63-0x14069db6f passes its value to Ban/UnBan, and config loading at VA 0x140686b60-0x140686b63 copies accountId unchanged into the ban table. No native process or player session was started for this inspection. Synthetic fixtures validate exact serialization and storage only, not ban enforcement or a Steam64 conversion algorithm."

