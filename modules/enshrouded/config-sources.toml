[[exclusions]]
source = "server_config"
key = "saveDirectory"
reason = "Save path is instance storage state; LanGame writes the per-instance savegame directory so worlds cannot bleed between instances."

[[exclusions]]
source = "server_config"
key = "logDirectory"
reason = "Log path is instance runtime state; LanGame writes the per-instance logs directory."

[[exclusions]]
source = "server_config"
key = "ip"
reason = "Bind address is instance network state, not a game-rule setting."

[[exclusions]]
source = "server_config"
key = "queryPort"
reason = "Query port is instance port-binding state written from ports.query.port."

[[exclusions]]
source = "role_groups"
key = "password"
reason = "Legacy root password is explicitly documented as no longer used for dedicated-server access; role passwords replace it."

[[exclusions]]
source = "role_groups"
key = "userGroups.Admin.name"
reason = "LanGame keeps the official preset role name stable; arbitrary extra role names are covered by custom_user_groups_json."

[[exclusions]]
source = "role_groups"
key = "userGroups.Friend.name"
reason = "LanGame keeps the official preset role name stable; arbitrary extra role names are covered by custom_user_groups_json."

[[exclusions]]
source = "role_groups"
key = "userGroups.Guest.name"
reason = "LanGame keeps the official preset role name stable; arbitrary extra role names are covered by custom_user_groups_json."

[[exclusions]]
source = "role_groups"
key = "userGroups.Visitor.name"
reason = "LanGame keeps the official preset role name stable; arbitrary extra role names are covered by custom_user_groups_json."

