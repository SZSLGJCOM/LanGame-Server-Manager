[[sources]]
id = "native_stdout_and_realm_readiness_20261001"
kind = "runtime_probe"
path = "NWX/Binaries/Win64/NWXServer-Win64-Shipping.exe and NWX/Saved/Logs/NWX.log"
authority = "installed_package_and_existing_instance_runtime_observation"
description = "The existing-instance run on 2026-10-01 completed OnAllLevelsLoaded world restoration and navigation, then set ready_for_players=true; native Control-C stopped it with exit 0. Its inherited output contained Display/Warning/Error lines but omitted ordinary LogNWXGameMode readiness lines. The installed engine contains stdout, FullStdOutLogOutput and the exact final OnAllLevelsLoaded ready message. LanGame now supplies both stdout flags and recognizes the final realm phase from the current run's bounded managed-log checkpoint. A listener, map load, no-Agones initial flag or SimStateManager waiting message is not realm readiness. This source establishes the original capture defect and native markers; the changed launch arguments still require a fresh server acceptance run."

[[exclusions]]
source = "launch_args"
key = "-stdout"
reason = "Fixed native standard-output routing so the managed console receives engine log output; not an operator setting."

[[exclusions]]
source = "launch_args"
key = "-FullStdOutLogOutput"
reason = "Fixed native output verbosity so ordinary realm-readiness messages reach the managed console, not only warnings and display messages."

