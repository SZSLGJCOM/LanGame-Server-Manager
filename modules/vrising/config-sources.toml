authority = "stunlock_studios_official_dedicated_server_instructions"
description = "2026-09-28 official 1.1.x host-settings table confirms empty-server FPS controls, LAN mode and reconnect reservations. The installed build 24686592 default JSON omits these fields and the package uses IL2CPP; the documented examples are not claimed as defaults. Unset overrides remain absent from generated JSON. Binding remains instance-owned; reset/wipe policy belongs to maintenance."

