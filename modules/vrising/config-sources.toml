authority = "isolated_installed_server_and_official_host_settings"
url = "https://github.com/StunlockStudios/vrising-dedicated-server-instructions/blob/master/1.1.x-pc/INSTRUCTIONS.md#firewall--port-forwarding"
description = "2026-09-20 independent native package-copy run uses installed build 24686592. With ListOnSteam/ListOnEOS false, the process owns both gameplay/query UDP sockets, completes world startup, and writes a real Saves/v4/world1/AutoSave_0.save.gz, while A2S does not reply. Official instructions distinguish direct gameplay from optional server-list queries. The private smoke now explicitly selects that mode and requires current-run startup-complete and persistence-complete markers plus owned endpoints; its 30-second autosave fixture does not change product defaults. Public A2S and remote client joins are separate verification scopes."

