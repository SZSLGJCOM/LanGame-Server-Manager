status = "best_effort_verified"
last_verified = "2026-09-28"
notes = "SteamCMD anonymous app_update 1829350 validate succeeded against the validated package on 2026-07-13. The installed public manifest reports V Rising Dedicated Server buildid 23401381, TargetBuildID 23401381, SizeOnDisk 2021415384, and depots 1004/1829351. The validated package includes the current ServerHostSettings.json and ServerGameSettings.json defaults plus GameDifficultyPresets and GameSettingPresets. The official Stunlock instructions currently document the 1.1.x PC server surface. Native verification on 2026-09-08 confirmed that empty admin/ban overrides must be omitted, and that ListOnSteam=false disables the A2S endpoint. Enabling ListOnSteam returned a complete zero-player list; the original visibility setting was restored. LanGame crosswalks every leaf in the installed host/game defaults: scalar paths are typed, and the three open-ended arrays remain editable through the validated specialized JSON editor."

[[sources]]
id = "configuration_review_20260930"
kind = "documentation"
path = "https://github.com/StunlockStudios/vrising-dedicated-server-instructions/blob/master/1.1.x-pc/INSTRUCTIONS.md"
authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: Publisher news lists V Rising 1.1 Hot Fix 12 on 2026-09-11; installed app 1829350 reports build 25169871. All 166 leaves of the packaged ServerGameSettings.json are covered. All 23 ServerHostSettings.json leaves are covered or supplied by the three instance-owned ports. The current official host table still includes the separately modeled empty-server FPS, LAN and reconnect options. Native reset scheduling remains excluded from Configuration. No current-build process, RCON or client-join result is claimed."

