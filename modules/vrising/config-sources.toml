[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://github.com/StunlockStudios/vrising-dedicated-server-instructions/blob/master/1.1.x-pc/INSTRUCTIONS.md"
authority = "native_package_and_documentation_semantic_review"
description = "Semantic review on 2026-09-30 of 194 presentation entries in English and Chinese against the referenced native package and documentation. Power denotes attack, physical or spell strength. Received-damage multipliers and equipment-stat contribution multipliers have distinct scopes. The five level settings identify their level and floor, servant or height limits. WarEventGameSettings uses Rift Incursion terminology. Reconnect reservation uses seconds, and V Blood tracking controls journal tracking. Boundaries: WarEventGameSettings.Interval, MajorDuration and MinorDuration exact numeric enum-to-frequency/duration mapping remains unconfirmed by first-party documentation. Community PDF not promoted to authoritative enum options. UI retains native integer contract and no fabricated time unit or zero behavior. No real gameplay/client run was performed for stat multiplier effects."

[[sources]]
id = "native_semantic_resolution_20260930"
kind = "documentation"
path = "GameAssembly.dll"
authority = "read_only_installed_package_static_consumer_analysis"
description = "2026-09-30: Build 25169871 static IL2CPP analysis resolves all three WarEventGameSettings enums. IDs 0 through 7 map Interval to 1800, 3600, 5400, 7200, 14400, 28800, 43200 and 86400 seconds. MajorDuration and MinorDuration use 900, 1200, 1500, 1800, 2100, 2700, 3600 and 7200 seconds. Metadata field references 139 and 137 identify the arrays at default-data offsets 20042736 and 20042656; WarEventGameSettings .cctor (06001069) initializes them. StructData.GetTotalDuration (0600106F) and GetTimeBetweenEvents (06001072) index these arrays; WarEventSystem converts their seconds to DateTime ticks. The interval is downtime in addition to active event duration. The UI now presents eight time presets and preserves native integer IDs. Zero selects the minimum preset and does not disable events. This resolves the earlier mapping uncertainty; no connected-client acceptance is claimed. Primary binary SHA256 ff366577fb0c707c42b8bde242304653aaa37f6ff0665ab9520150ceb692aed1."
