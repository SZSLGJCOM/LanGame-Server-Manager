id = "facepunch_september_2026"
kind = "documentation"
path = "https://rust.facepunch.com/news/breach-and-clear"
authority = "Facepunch Rust September 2026 release notes"
description = "Published 2026-09-03, checked 2026-09-28. Documents group-size upkeep scaling and the optional -useNewNavmesh server startup switch. The default remains the old navigation mesh in the inspected build; this is not a claim about a future hotfix."

