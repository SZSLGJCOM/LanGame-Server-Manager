[[sources]]
id = "native_semantic_resolution_20260930"
kind = "documentation"
path = "RustDedicated_Data/Managed/Assembly-CSharp.dll"
authority = "read_only_installed_package_static_consumer_analysis"
description = "2026-09-30: Build 25454815 contains 2230 generated console command registrations. All modeled config-file convars resolve except server.secure and rcon.password, which require launch handling. Bare censorplayerlist remains a valid Server.GlobalDict alias. Facepunch removed server.secure on 2025-09-04 in favor of -insecure. LGSM now emits that flag only for explicit secure=false; true, missing and null values keep the secure default. Removed the ineffective RCON password line from server.cfg; RCon.Initialize (06008AE8) reads the already-provided +rcon.password launch argument. Current IL confirms freeBuild, freeRepair and unlimitedIo require IsInCreativeMode. Free building also avoids consuming deployed items, free repair removes damage cooldown and costs, and WireTool.GetMaxWireLength (060038E2) returns 200 meters instead of 30. These findings establish the questioned contracts; they do not claim a connected-client gameplay run. Primary binary SHA256 c747d6c58b01848e0fd70617f24b6e09a5c22a487bb79b8364211b1fe98ac4c9."

