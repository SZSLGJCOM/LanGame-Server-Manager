[[sources]]
id = "facepunch_server_save_command"
kind = "runtime_console"
path = "https://rust.facepunch.com/changelist/2734"
authority = "Facepunch Rust changelog, 2015-10-16"
description = "Rechecked 2026-09-20: documents the canonical server.save command and clean saves during server shutdown. LanGame sends server.save then quit using the instance rcon port and rcon_password. The Rust shutdown boundary selects WebSocket or Source RCON from the explicit rcon_web boolean before dispatch. Facepunch useful_commands documents server-side quit as saving and closing the server; its sv prefix is for forwarding from a game client. Both protocol paths have mock wire-command and authentication coverage; native lifecycle evidence currently covers default WebRCON only."

[[sources]]
id = "native_rcon_modes_build_25129933"
kind = "documentation"
path = "<validated-install-root>/RustDedicated_Data/Managed/Assembly-CSharp.dll"
authority = "installed_rust_dedicated_server_build_25129933_read_only_il"
description = "2026-09-20 read-only PE/IL inspection, Assembly-CSharp.dll SHA256 CE9884CA79446BDA128FB7358DB56E6E11CE0C9400CD5CB2C482481013ED709D: Facepunch.RCon.Initialize branches on Web at IL_0174/IL_0179. True starts listenerNew as WebSocket RCON; false enters IL_027b, creates the Source RCON listener, and logs its deprecation. RConListener..ctor binds Ip/Port and calls Start. Facepunch commit https://commits.facepunch.com/510813 removes the old protocol on the remove_legacy_rcon branch, but that branch behavior is not present in this verified local build. This inspection does not claim native false-mode command or shutdown execution."

[[sources]]
id = "native_source_rcon_completion_build_25129933"
kind = "documentation"
path = "<validated-install-root>/RustDedicated_Data/Managed/Assembly-CSharp.dll"
authority = "installed_rust_dedicated_server_build_25129933_read_only_il"
description = "RConClient.HandleMessage_UnAuthed replies with the auth request id/type 0 followed by success id/type 2, or rejection id -1/type 2. After executing a command, HandleMessage emits an empty id -1/type 0 completion; Output_OnMessage sends matching command id/type 0 and separate console id 0/type 4 broadcasts. Reply writes these ids unchanged. LanGame reuses Source framing and authentication with the existing eight-second total deadline and three-second socket I/O limit; its Rust-only completion reader is bounded to 64 frames and 256 KiB of response bodies. Unknown frames, nonempty or wrong-type completions, and negative authentication ids remain errors. Mock tests replay this native contract without executing a real false-mode server."

