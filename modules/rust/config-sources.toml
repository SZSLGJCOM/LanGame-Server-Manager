description = "2026-09-29 read-only PE metadata and IL inspection; SHA256 C747D6C58B01848E0FD70617F24B6E09A5C22A487BB79B8364211B1FE98AC4C9. ConVar.DeepSea.terrain_everywhere is boolean (field signature 06-02, token 0x0400982E), defaults to false (ldc.i4.0 followed by stsfld in .cctor), and has a Saved=true console attribute. The native help describes applying deep-sea terrain configuration and foliage to the whole map. Saved denotes persistent configuration, not world autosave or backup policy. Deterministic fixtures cover default and enabled cfg output; no game code or terrain gameplay was executed by this inspection."

