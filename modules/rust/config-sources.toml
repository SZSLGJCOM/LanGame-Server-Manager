description = "2026-09-28 PE metadata and IL inspection, SHA256 CE9884CA79446BDA128FB7358DB56E6E11CE0C9400CD5CB2C482481013ED709D. ConVar.Decay field metadata and .cctor establish eleven group-upkeep convars and defaults. BuildingPrivlidge.CalculateGroupUpkeepMultiplier returns min(1 + tier increases, max multiplier), so the default cap 3 is the total multiplier. RefreshDoorGroupMembers excludes locks with user count <= upkeep_lock_min_users, including the default 2. PruneGroupMembers clamps the history window to nonnegative hours, and TrimGroupMembersToMax clamps history capacity to nonnegative integers. UI accepts nonnegative tier rates and a total cap of at least 1; native field setters declare no narrower maximum. Bootstrap.Init_Tier0 IL_00fb-0108 reads -useNewNavmesh and negates it into AI.useUnityNavmesh. No game code was executed and no client-join or live gameplay result is claimed."

