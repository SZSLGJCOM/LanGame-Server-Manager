source = "shared_config_26_8_31_1"
key = "Assets/WorldValuesFile.json"
reason = "Persistent planet state is supplied by a client, and Program.Load(path, false) deliberately does not generate a default world file. Seed, terrain, factions and generated values require world management, not ordinary configuration overwrite."

[[exclusions]]
source = "shared_config_26_8_31_1"
key = "BackupsConfig/ModConfig"
reason = "Backup operations/retention and client mod requirements belong to Maintenance and Mods; do not duplicate these surfaces in Configuration."

[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://github.com/RimWorld-Together/Rimworld-Together/tree/26.8.31.1/Source/Server"
authority = "source_and_native_contract_semantic_review"
description = "Semantic review on 2026-09-30 checked all 117 fields against tagged 26.8.31.1 server source and read-only metadata/IL from the official RTClient and RTShared assemblies. Metadata documents market pricing, client-save choice, browser/telemetry dependency, road movement difficulty, silver costs/rewards, millisecond timers, map preview and custom-scenario behavior. Scenario cooldown is stored but not consumed by this release. Native types/defaults are retained; client gameplay was not launched."
