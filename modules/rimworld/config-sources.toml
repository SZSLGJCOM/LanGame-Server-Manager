status = "best_effort_verified"
last_verified = "2026-09-28"
notes = "Official latest release 26.8.31.1 and tagged source verified on 2026-09-28. The published Server-win-x64.zip digest/size match the previously downloaded analysis archive; no game process was launched for this update. RTServer.exe uses UseClientSave and SHA256 PasswordConfig.json. Retired whitelist settings/files remain preserved and formerly restricted instances require a password before starting. Semantic review on 2026-09-30 checked all 117 fields against tagged 26.8.31.1 server source and read-only metadata/IL from the official RTClient and RTShared assemblies. Corrected market pricing, client-save choice, browser/telemetry dependency, road movement difficulty, silver costs/rewards, millisecond timers, map preview and custom-scenario behavior. Scenario cooldown is stored but not consumed by this release. Preserved native types/defaults; client gameplay was not launched."

[[sources]]
id = "configuration_review_20260930"
kind = "documentation"
path = "https://github.com/RimWorld-Together/Rimworld-Together/releases/tag/26.8.31.1"
authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: GitHub latest-release API still resolves to 26.8.31.1 (published 2026-08-31), and Server-win-x64.zip still reports 29443247 bytes with SHA256 f16c703f1e3e4e6de0f4877d8ae502a817c85482681956aa01e8a4b619bab68c. The module already targets this release and its split configuration contract. No later official server release or additional configuration change was found. This review did not launch the server."

