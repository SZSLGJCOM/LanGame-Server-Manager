id = "rimworld"
name = "RimWorld Together Server"
version = "0.1.0"
description = "RimWorld Together community server for RimWorld 1.7 unstable with the matching Together client mod."
supported_platforms = ["windows"]

[install]
shared_game_dir = "rimworld"
download_url_windows = "https://github.com/RimWorld-Together/Rimworld-Together/releases/download/26.11.2.1/Server-win-x64.zip"
verification_path = "RTServer.exe"

[install.download_integrity_windows]
sha256 = "87bbf4e0fa3f37cf87a7f579bbd486040314d024311fb20086c638ea0a4accb7"
size = 31763053

[process]
executable = "RTServer.exe"
args_template = [
  "{{launch.extra_args}}"
]
working_directory_template = "{{paths.install_root}}"
window_policy = "background"
host_surface = "managed_terminal"
host_notes = "RimWorld Together 26.11.2.1 targets RimWorld 1.7 unstable and requires the matching Together client mod and Harmony. Market settings select the local market or the upstream cross-server marketplace. Players on RimWorld 1.6 need Together 26.10.15.1."

[[default_ports]]
name = "game"
protocol = "tcp"
port = 25555

[workshop]
provider = "steam"
consumer_app_id = 294100
supports_collections = false

[mods.source]
provider = "steam"
label = "Steam Workshop"
url = "https://steamcommunity.com/sharedfiles/filedetails/?id=3005289691"
install_note = "Install the unmodified 26.11.2.1 community server from the maintainers' GitHub release. Players need RimWorld 1.7 unstable, Together 26.11.2.1 (Workshop 3005289691) and Harmony (2009463077). Together 26.10.15.1 is the final release for RimWorld 1.6."

[runtime.player_query]
protocol = "none"

[[runtime.player_actions]]
id = "save_world"
label = "Request active client saves"
label_zh_cn = "立即保存在线客户端"
transport = "rimworld_save"
command_template = "save"

[[runtime.player_actions]]
id = "list_players"
label = "Players"
label_zh_cn = "玩家列表"
transport = "stdin"
command_template = "list"
process_key = "main"

[[runtime.player_actions]]
id = "list_bans"
label = "Bans"
label_zh_cn = "封禁列表"
transport = "stdin"
command_template = "banlist"
process_key = "main"


[[runtime.player_actions]]
id = "kick_user"
label = "Kick"
label_zh_cn = "踢出"
transport = "stdin"
command_template = "kick {{target}}"
target_label = "Username"
target_label_zh_cn = "用户名"
target_placeholder = "RimWorld Together username"
target_placeholder_zh_cn = "RimWorld Together 用户名"
target_required = true
process_key = "main"
destructive = true

[[runtime.player_actions]]
id = "ban_user"
label = "Ban"
label_zh_cn = "封禁"
transport = "stdin"
command_template = "ban {{target}}"
target_label = "Username"
target_label_zh_cn = "用户名"
target_placeholder = "RimWorld Together username"
target_placeholder_zh_cn = "RimWorld Together 用户名"
target_required = true
process_key = "main"
destructive = true

[[runtime.player_actions]]
id = "unban_user"
label = "Unban"
label_zh_cn = "解除封禁"
transport = "stdin"
command_template = "pardon {{target}}"
target_label = "Username"
target_label_zh_cn = "用户名"
target_placeholder = "Username from banlist"
target_placeholder_zh_cn = "banlist 输出中的用户名"
target_required = true
process_key = "main"
destructive = true



[[runtime.player_actions]]
id = "op_player"
label = "OP"
label_zh_cn = "设为 OP"
transport = "stdin"
command_template = "op {{target}}"
target_label = "Username"
target_label_zh_cn = "用户名"
target_placeholder = "RimWorld Together username"
target_placeholder_zh_cn = "RimWorld Together 用户名"
target_required = true
process_key = "main"
destructive = true

[[runtime.player_actions]]
id = "deop_player"
label = "De-op"
label_zh_cn = "取消 OP"
transport = "stdin"
command_template = "deop {{target}}"
target_label = "Username"
target_label_zh_cn = "用户名"
target_placeholder = "RimWorld Together username"
target_placeholder_zh_cn = "RimWorld Together 用户名"
target_required = true
process_key = "main"
destructive = true

# RTServer CMD_Modlist prints Configs/ModConfig.json required and
# optional Mods; CMD_ToggleModBypass flips and saves AllowAllMods.
[[runtime.player_actions]]
id = "list_mods"
label = "Mod list"
label_zh_cn = "Mod 列表"
transport = "stdin"
command_template = "modlist"
process_key = "main"

[[runtime.player_actions]]
id = "toggle_mod_bypass"
label = "Toggle Mod bypass"
label_zh_cn = "切换 Mod 校验跳过"
transport = "stdin"
command_template = "togglemodbypass"
process_key = "main"
destructive = true

[runtime.shutdown]
grace_period_ms = 12000

[[runtime.shutdown.commands]]
transport = "stdin"
command = "backup"
wait_after_ms = 2500

[[runtime.shutdown.commands]]
transport = "stdin"
command = "quit"
wait_after_ms = 8000

# Server-win-x64.zip contains RTServer.exe; these roots are generated at runtime.
[storage]
runtime_copy_exclusions = ["Assets", "Configs", "Logs", "Backups"]
saves_path_template = "{{paths.install_root}}/Assets"
retained_paths = ["Configs"]

[player_management]
status = "runtime_actions"
planned_surface = "managed_terminal_console_and_json_rosters"
reason = "RimWorld Together RTServer.exe accepts list, banlist, kick, ban, pardon, op, and deop through managed stdin. Server passwords control admission; historical whitelist files are retained without exposing obsolete commands."
verification = "The official 26.11.2.1 archive contains RTServer.exe. Tagged source retains list, deeplist, forcesave and the moderation commands. Client authentication, settlement saves and completed marketplace trades require matching game clients."

[[runtime.port_roles]]
role = "player"
port_names = ["game"]

[runtime.startup_readiness]
timeout_ms = 600000

[runtime.startup_readiness.probe]
kind = "runtime_log"
source = { kind = "managed" }
