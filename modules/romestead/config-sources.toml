[[sources]]
id = "dotnet_apphost_runtime_discovery"
kind = "documentation"
path = "DOTNET_ROOT_X64 / DOTNET_ROOT apphost runtime discovery"
url = "https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-environment-variables"
authority = "official_microsoft_dotnet_documentation"
description = "Verified 2026-09-20: generated x64 apphosts consult DOTNET_ROOT_X64 before DOTNET_ROOT. Microsoft app-launch troubleshooting also documents that a selected private .NET root can prevent discovery of an otherwise usable system installation (https://learn.microsoft.com/en-us/dotnet/core/runtime-discovery/troubleshoot-app-launch). LanGame supplies these child-process environment values only when the configured SteamCMD sibling dotnet directory contains dotnet.exe, a .NET 8 hostfxr.dll, and the Microsoft.NETCore.App runtime files coreclr.dll, hostpolicy.dll and System.Private.CoreLib.dll at a version matching Server.runtimeconfig.json; otherwise the existing system resolver remains unchanged. Unit and real two-instance creation regressions cover shared, private-copy, relocated install roots, missing files, incompatible versions, and exact-patch policy."

[[sources]]
id = "isolated_launch_lifecycle_2026_09_20"
kind = "runtime_probe"
path = "Steam app 4763510 build 25128761; isolated command-pipeline fixture"
authority = "exact_installed_server_lifecycle_probe"
description = "2026-09-20: the old install-relative wrapper reproducibly exited with x64 apphost 8.0.22 error 0x80008083, reporting no .NET location and no hostfxr.dll. Server.runtimeconfig.json requires Microsoft.NETCore.App 8.0.0. With the launch plan resolving the configured portable 8.0.28 runtime, both a fresh shared install and an actual second private-copy instance reached their owned UDP game endpoint, generated and retained four save files through stop and server-package removal, preserved backup data in the deleted-instance archive, and removed all disposable fixture resources. The second-instance run also verified the first unstarted instance's configuration and saves were unchanged, explicitly archived that instance, and checked that no instance database rows remained. Existing worlds were excluded from the independent package copies; the official package and tool runtime were read-only inputs. No client join or nonempty player-list claim is made."

