[[sources]]
id = "installed_save_root_build_25128761"
kind = "install_probe"
path = "Server.dll: StandaloneServerManager / Program.Main; CandideServer.dll: BaseServer.CheckCommand / GameSaveManager"
authority = "downloaded_steamcmd_server_package"
description = "2026-09-20 read-only IL inspection of installed Steam build 25128761 verifies the save root independently of the older configuration and smoke evidence. StandaloneServerManager initializes SaveGamesFolder to saved_worlds and creates worlds under Path.Join(SaveGamesFolder, world.Name). Program.Main sets BaseServer.SaveGamePath to Path.Combine(SaveGamesFolder, world.Name); manual save, stop, and autosave pass that path through QueueSave to SaveGameToDirectory. GameSaveManager writes game_state and world_desc plus their temporary and backup files under that world directory. Preserve the complete saved_worlds directory while allowing server payload removal. Server.dll SHA256 8e11b02f594a1e08e9d1e8fc4ef663728193951b595eccd966425c5b1f2c8e69; CandideServer.dll SHA256 64434004d53b50908c6b18769f540c24ea5cf4105e4eec9c5f9656b202169a44. No server process was started for this inspection."

