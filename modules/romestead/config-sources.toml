[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://steamcommunity.com/games/1805320/announcements/detail/672870313012233904"
authority = "native_package_and_documentation_semantic_review"
description = "2026-09-30: 9 presentation entries reviewed in EN/ZH against the referenced package/docs. Name includes milliseconds; -1 disables sleeping and may increase CPU use. World name, seed and size explain creation-only effect; random seed preserves nullable native behavior. Boundaries: enable_cheats: official guide describes a reserved switch; no current native gameplay verification establishes whether it is effective."

[[sources]]
id = "native_semantic_resolution_20260930"
kind = "documentation"
path = "Server.dll"
authority = "read_only_installed_package_static_consumer_analysis"
description = "2026-09-30: Build 25128761 static IL confirms EnableCheats is active. Server.dll Program.Main (06000001), offsets 015D through 0169, applies it to loaded worlds; StandaloneServerManager.GenerateNewWorld (06000008), offsets 005D through 0069, applies it to new worlds. CandideServer.dll BossServerService.OnReceive_BossSpawnCheat (060005F8), SimpleInventoryServerService.OnReceive_AddItemCheat (06000737), TimeServerService.OnReceive_Time (0600074A), and WeatherServerService.OnReceive_SetWeather (06000776) return immediately when GameConfig.CheatsEnabled is false. Removed the stale reserved-for-future-use claim and described the confirmed server-side effects. This establishes the configuration gate, without claiming that client command accessibility was exercised. Primary binary SHA256 8e11b02f594a1e08e9d1e8fc4ef663728193951b595eccd966425c5b1f2c8e69."

[[sources]]
id = "guided_choices_review_20261010"
kind = "documentation"
path = "modules/romestead/schema.json and apps/desktop/src/views/settings/RomesteadSleepThresholdField.tsx"
authority = "existing_native_config_contract_and_actual_bilingual_browser_save_readback"
description = "World size is an integer selector for native 0 small, 1 standard and 2 large. SleepThresholdMs remains one native field under Runtime/Performance: enabled thresholds accept the existing 1..16.5 ms range including fractional values; disabling writes -1 and remembers the last valid threshold within the editor. No extra persisted switches are introduced. Bilingual browser checks exercised selection, 13.875 -> -1 -> 13.875 across category changes, validation refusal, autosave/readback and archived read-only rendering. These checks do not update prior exact-build runtime acceptance."
