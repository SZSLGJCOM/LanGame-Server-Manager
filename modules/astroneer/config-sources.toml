status = "best_effort_verified"
last_verified = "2026-10-10"
notes = "The configuration inventory was originally verified against build 23473323. Native TCP player collection was additionally verified against the installed app 728470 build 24411584 on 2026-09-08 in an isolated package copy with a fresh Saved tree: DSListPlayers returned complete empty JSON and DSServerShutdown exited normally. ConsolePort is now managed instance network state and is disabled when console_password is empty. Online identity fields and inGame filtering are cross-checked against the AstroLauncher protocol implementation and synthetic fixtures; non-empty real-player collection was not exercised."

[[sources]]
id = "native_public_ip_registration_2026_10_01"
kind = "runtime_probe"
path = "Astro/Binaries/Win64/AstroServer-Win64-Shipping.exe, Steam app 728470 build 25119807"
authority = "existing_instance_single_setting_comparison"
description = "With PublicIP empty, the native RegisterDedicatedServer CloudScript error path reported JavascriptException with address-validation frames, then requested quit. Changing only PublicIP to the host's detected public IPv4 allowed authenticated DSListGames and DSServerStatistics to report the same nonempty current world through a 30-second observation; the existing managed Ctrl+C stop then completed with exit code 0. This establishes the address requirement for the observed installed build and current-world readiness, not an external client join or arbitrary native popup coverage. No address, credential or world name is included in this evidence. Startup preflight now rejects a missing or malformed IPv4 PublicIP without changing saved drafts or performing automatic network discovery."

[[sources]]
id = "native_active_world_probe_2026_09_20"
kind = "runtime_probe"
path = "Astro/Binaries/Win64/AstroServer-Win64-Shipping.exe, Steam app 728470 build 24411584"
authority = "isolated_exact_package_native_console_observation"
description = "2026-09-20 isolated build 24411584 (1.43.2.0-DS-SHP), fresh Saved state and no client: the owned gameplay UDP endpoint and authenticated DSListPlayers JSON became available while DSListGames.activeSaveName and DSServerStatistics.saveGameName were both empty. After a further 75-second diagnostic observation, both native replies reported the same nonempty selected world, zero players, and an idle rate of approximately 3 FPS. No DSNewGame, save command or player connection was used. The declared SaveGames directory remained empty through stop, so this evidence establishes active-world selection and empty-data uninstall/archive behavior, not save persistence or client join. Smoke now requires owned gameplay UDP, a complete authenticated player reply, and matching nonempty active-world names from both bounded read-only console commands; it uses state polling rather than a fixed observation delay. The world-state probe does not print names, credentials or runtime identity."

