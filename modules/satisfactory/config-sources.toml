[[sources]]
id = "native_semantics_build_24656085"
kind = "install_probe"
path = "Engine/Binaries/Win64/FactoryServer-Engine-Win64-Shipping.dll and matching shipped PDB"
authority = "current_official_package_read_only_consumer_evidence"
description = "2026-09-30: Read-only native code and matching PDB inspection: UNetDriver MaxInternetClientRate offset 0xcc and MaxClientRate 0xd0; UPlayer CurrentNetSpeed offset 0x38. NotifyControlMessage and SetNetSpeed clamp the negotiated value to MaxClientRate with floor 1800. UNetConnection::Tick multiplies CurrentNetSpeed by elapsed time and 8.0 before subtracting the bit budget, establishing bytes/second. UWorld::Listen checks the LAN option and lowers MaxClientRate to MaxInternetClientRate only when the latter is >2500 and below the former. Function RVAs: NotifyControlMessage 0x014f6c10, SetNetSpeed 0x0109de50, Tick 0x00dea600, Listen 0x014f3b60. SHA256: FactoryServer-Engine-Win64-Shipping.dll 0a0b567bf2853f4c4e9845d8a66a01881c354c15da52ecb8db7d33fa7f0a84d9."

