notes = "Installed Steam build 24656085 (CL 502094) was started and its HTTPS API exercised on 2026-09-08. -UserDir selects instance-owned INI files; process-scoped USERPROFILE, LOCALAPPDATA and APPDATA separately isolate the native server identity and saves. CreateNewGame requires bSkipOnboarding and GameModeSettings in NewGameData on this build. Claim, credentials and active-world selection remain game API state. Native save creation was verified without changing another server profile. The formal instance environment loaded and saved its world without changing the global server identities. SML 3.12.0 and FRM 1.5.3 loaded. The game HTTPS frm/getPlayer extension returned HTTP 404 bad_function, while the independently enabled FRM HTTP service returned HTTP 200 and a complete empty player array. Its native autostart and port options are persisted in the instance GameUserSettings.ini; client joins were not part of this probe."

