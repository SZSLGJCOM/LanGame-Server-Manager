status = "best_effort_verified"
last_verified = "2026-09-08"
notes = "Installed Steam build 24656085 (CL 502094) was started and its HTTPS API exercised on 2026-09-08. -UserDir selects instance-owned INI files; process-scoped USERPROFILE, LOCALAPPDATA and APPDATA separately isolate the native server identity and saves. CreateNewGame requires bSkipOnboarding and GameModeSettings in NewGameData on this build. Claim, credentials and active-world selection remain game API state. Native save creation was verified without changing another server profile. The formal instance environment loaded and saved its world without changing the global server identities. SML 3.12.0 and FRM 1.5.3 loaded. The game HTTPS frm/getPlayer extension returned HTTP 404 bad_function, while the independently enabled FRM HTTP service returned HTTP 200 and a complete empty player array. Its native autostart and port options are persisted in the instance GameUserSettings.ini; client joins were not part of this probe."

[[sources]]
id = "native_console_entry_build_24656085"
kind = "install_probe"
path = "FactoryServer.exe resources 201 and 202; Engine/Binaries/Win64/FactoryServer-Win64-Shipping-Cmd.exe"
authority = "read_only_installed_package_and_native_log_observation"
description = "2026-10-01: build 24656085 bootstrap resource 201 selects Engine/Binaries/Win64/FactoryServer-Win64-Shipping-Cmd.exe and resource 202 supplies FactoryGame. The bootstrap's CreateProcessW call at RVA 0x1f8b inherits handles but passes a zeroed STARTUPINFO without explicit standard handles. The native CL 502094 log confirms the Cmd executable receives -stdout and -FullStdOutLogOutput, yet the managed parent stream contains no game output. LanGame now directly launches that same packaged console entry with FactoryGame and all existing flags, working directory and profile environment, giving the child the runtime's explicit standard handles. This removes the intermediate launch boundary; output capture and normal stop still require real post-change verification."

