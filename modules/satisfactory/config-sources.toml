id = "native_world_rule_catalog_24656085"
kind = "install_probe"
path = "modules/satisfactory/world-settings.json"
authority = "exact_shipped_iostore_asset_defaults_choices_and_current_api"
description = "The canonical 18 definitions retain shipped asset hashes, defaults, scopes and native choices: six creation GameMode fields, four creation-progress fields, five current-world rules and three default-player rules. Percent selectors serialize integers such as 25/100/125, not floating multipliers. Node purity UI order is 0,1,5,2,6,3,4. StartingTier and GiveAllTiers share one UI selector. GiveItems and SetGamePhase are immediate actions outside Configuration; KeepInventory and CreatureHostilityMode are absent from the current dedicated-server API reply. Player-rule readback and saved defaults do not establish when real players receive changes. These API editors own game state outside instance JSON/schema properties; existing INI controls retain one editor with read-only API context."

[[sources]]
id = "native_configuration_ownership_review_20261010"
kind = "documentation"
path = "apps/desktop/src/views/settings/modules/satisfactory-native-presentation.ts and apps/desktop/src-tauri/src/commands_satisfactory_world.rs"
authority = "implemented_configuration_categories_and_management_permission_boundary"
description = "Room owns claim, native server name, join password, startup-session selection and confirmed save loading. Administration & Permissions owns management authorization and explicit saved-password retrieval; both the local command boundary and the LAN management token apply, without a separate LAN viewer role. Credentials use the system store and never enter instance JSON or generic snapshots. World/New World owns creation-only generation and starting-progress choices; World/Creative Mode owns five world and three default-player rules. Creative Mode is permanent for a save and disables achievements; already granted unlocks persist after switches turn off. Ordinary auto-pause, network-quality, weather and gameplay-data controls keep one INI override editor with read-only API state. Saving, backup policy, restart scheduling, network ports and individual player actions keep their existing workspace owners. Draft conflicts, HTTP 202 and uncertain transport results require state refresh and review before another mutation; no automatic mutation retry is introduced."

[[sources]]
id = "production_world_service_acceptance_20261010"
kind = "runtime_probe"
path = "apps/desktop/src-tauri/src/satisfactory_world_native_tests.rs, satisfactory_world_service_tests.rs and satisfactory_world_credentials.rs"
authority = "production_rust_service_against_isolated_official_server_and_native_save_readback"
description = "2026-10-10: commands_satisfactory_world --include-ignored passed 22 tests, including the real native service case on build 24656085/CL 502094. The production endpoint resolver checked process birth, runtime-supervisor ownership and the owned TCP listener; requests used the real local HTTPS service. A fresh UUID profile completed generated-password claim and permanent API-token authorization, created a world with PartsCostMultiplier=125 and seed=42, applied NoPower=True with before/after native saves, changed server name/join password/startup session, loaded the rule-save version and read NoPower=True back, then created a second world while retaining the first world's before-change save. The retained report records native_service_verified=true and old_world_preserved=true. Only credential storage used an isolated memory boundary; the system credential store was not touched by this integration test. A separate explicit Windows-store smoke passed one test: it confirmed a unique UUID synthetic entry was absent, wrote and read a synthetic secret through the production credential adapter, deleted only that entry and confirmed it was absent again; existing entries and real administrator credentials were not used. Original profiles and user saves were not modified. This verifies the production service, native persistence and separate Windows credential boundary, not the GUI-to-server chain, real-player rule adoption, client achievements or later builds."

[[sources]]
id = "native_authentication_and_operation_budget_20261010"
kind = "runtime_probe"
path = "apps/desktop/src-tauri/src/satisfactory_world_protocol.rs and satisfactory_world_api.rs"
authority = "independent_native_handler_contract_negative_protocol_probes_and_regression_tests"
description = "VerifyAuthenticationToken receives AuthenticationToken as the 128-hex fingerprint after the full token's dot, PrivilegeLevel=APIToken, and the complete token in the Bearer authorization header. Matching native requests returned 204; a full-token body or altered fingerprint returned 401, and a missing header returned 403. Production regression tests assert the separate body fingerprint and complete header token. HTTP success status alone is insufficient: native error bodies are rejected. A cold CreateNewGame returned an empty-body 202 after approximately 5.8 seconds, including a 5.734-second native map load. CreateNewGame, LoadGame and SaveGame therefore use the remaining bounded 45-second operation budget while short reads retain six-second limits. Accepted or uncertain mutations are not automatically retried."

[[sources]]
id = "native_settings_autosave_presentation_20261010"
kind = "documentation"
path = "apps/desktop/src/views/settings/SatisfactoryWorldSettingsContext.tsx; apps/desktop/src/views/settings/useSatisfactoryNativeAutosave.ts"
authority = "repository_behavior_and_browser_acceptance"
description = "2026-10-10: Existing room properties and current-world rules automatically save via a serialized native queue, coalescing edits without clearing newer drafts. INI controls present concrete configured/API-read values; reads do not add overrides or turn unknown native values into defaults. Running-only API saves use the stop barrier rather than a circular startup dependency. In-flight writes keep their real completion after editor disposal. Failures retain drafts and are not blindly resent; world creation, load, authorization and explicit password removal retain action controls. Both languages and 1280/1024 px browsers verify these behaviors using a substituted transport. This presentation source does not extend the separate build-24656085 production backend and credential-store acceptance into a complete GUI-to-native or multiplayer claim."
