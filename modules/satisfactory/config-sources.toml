kind = "runtime_probe"
path = "FactoryDedicatedServer-Win64-Shipping.dll and isolated CL 502094 server"
authority = "isolated_official_server_protocol_and_saved_world_readback"
description = "2026-10-09 UTC direct native protocol probes used a fresh isolated profile, precreated AppData directories and independent ports. InitialAdmin login, claim, fixed server.GenerateAPIToken, room identity/password/autoload changes and CreateNewGame/LoadGame were accepted and read back. HTTPS uses the game_tcp port, not the reliable port. Create and load return 202 before world travel completes; the application uses bounded read-only state refresh instead of resending accepted requests. Native saves showed Energy 25 -> 0.25, Parts 125 -> 1.25, SpaceParts 1000 -> 10.0, resource distribution 2, purity 5 and seed 42. A separate six-GameMode-only creation retained creativeModeEnabled=false; creation AGS and subsequent world AGS changes read back separately. The world-rule workflow requests native saves before and after mutation and verifies resulting state; these snapshots are separate from recoverable LanGame backups. Production-service acceptance and the verified token body/header contract are recorded separately below. No multiplayer gameplay, achievements earned by clients or later-build acceptance is established."

