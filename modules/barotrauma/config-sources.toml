[[sources]]
id = "installed_v1_13_4_0_package"
kind = "install_probe"
path = "<validated-install-root>/steamapps/appmanifest_1026340.acf / DedicatedServer.deps.json / changelog.txt / DedicatedServer.pdb"
authority = "installed_barotrauma_dedicated_server_package"
description = "Validated package reports StateFlags 4, UpdateResult 0, buildid and TargetBuildID 23799137, SizeOnDisk 220381562, and DedicatedServer 1.13.4.0. Its changelog includes the 30-second respawn default introduced in v1.12.6.0, and its PDB SourceLink identifies exact development commit 6029cd01d7c46dd084c28a43d7c21c0894a6139a."

[[sources]]
id = "private_server_readiness"
kind = "install_probe"
path = "DedicatedServer.dll: Barotrauma.Steam.SteamManager.CreateServer / Barotrauma.Networking.GameServer.StartServer"
authority = "installed_barotrauma_1_13_4_0_and_official_release_source"
description = "Read-only IL inspection on 2026-09-20 of installed build 23799137 v1.13.4.0 confirms CreateServer writes Steam QueryPort=0 when isPublic=false and uses the configured QueryPort only when true. Official v1.13.4.0 release source at ca7f5976fe16de7b153585ac4f6a12bdccbbbf8e has the same branch; StartServer passes ServerSettings.IsPublic, starts Lidgren on the game port, then logs Server started. The smoke fixture explicitly selects private mode and disables UPnP; readiness requires the owned game UDP endpoint plus a new startup log marker. The real private fixture completed creation, startup readiness, stop, uninstall, instance archival and cleanup on 2026-09-20. No players joined and no native world save was produced, so that run does not certify native save backup, public listing or the public query endpoint."
url = "https://github.com/FakeFishGames/Barotrauma/blob/ca7f5976fe16de7b153585ac4f6a12bdccbbbf8e/Barotrauma/BarotraumaServer/ServerSource/Steam/SteamManager.cs#L15-L25"

