[[sources]]
id = "conpty_clientlist_response"
kind = "install_probe"
path = "DedicatedServer.exe clientlist via Windows ConPTY"
authority = "isolated_barotrauma_1_13_4_0_console_probe"
description = "An isolated v1.13.4.0 runtime through production spawn_launch_plan accepted two clientlist commands with distinct nonce arguments through ConPTY, emitted each exact command echo and both *************** delimiters for zero connected clients, and exited with code 0 after exit. The native save command was rejected as unknown. Non-empty fixtures are source-derived. The native client display text can include an unescaped playing Character.LogName suffix; LanGame preserves that text and a non-stable session ID without creating moderation targets."
url = "https://github.com/FakeFishGames/Barotrauma/blob/master/Barotrauma/BarotraumaServer/ServerSource/DebugConsole.cs"

