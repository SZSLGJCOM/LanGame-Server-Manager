authority = "installed_barotrauma_dedicated_server_package"
description = "Read-only IL inspection of build 23799137 v1.13.4.0 confirms Program.Main warns that redirected stdin is unsupported and will be ignored. The console input loop only reads Console.KeyAvailable/ReadKey when both input and output are not redirected. LanGame uses an instance-owned executable and ConPTY for this module."
