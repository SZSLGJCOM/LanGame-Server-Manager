status = "best_effort_verified"
last_verified = "2026-09-30"
notes = "Barotrauma Dedicated Server app 1026340 public build 23799137 is v1.13.4.0. The 106 root and 18 campaign XML attributes are cross-checked against the installed package and official v1.13.4.0 release source ca7f5976fe16de7b153585ac4f6a12bdccbbbf8e. All 125 managed fields have reviewed types, English/Chinese semantics and section ownership. Closed enums follow the release source; new numeric limits follow property setters, while UI-only slider ranges do not restrict native configuration. XML spelling alone is not used to infer types. Per-admin command lists remain an explicit permission-surface exclusion. The 2026-09-30 semantic recheck retains the full 125-field explicit metadata review against v1.13.4.0 source/build 23799137: native float types, clamping, enum values, units and bilingual labels are explicit; mod/admin owners remain outside configuration. Fractional XML regressions and five frontend contracts cover the corrected types, bounds, labels and grouping. No new live server probe was performed in this recheck."

