[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://github.com/FakeFishGames/Barotrauma/blob/ca7f5976fe16de7b153585ac4f6a12bdccbbbf8e/Barotrauma/BarotraumaShared/SharedSource/Networking/ServerSettings.cs"
authority = "source_and_native_contract_semantic_review"
description = "Semantic review on 2026-09-30 of 125 fields against v1.13.4.0 source/build 23799137. Native float types, clamping, enum values, units and bilingual labels are explicit; mod/admin owners remain outside configuration. Fractional XML regressions and five frontend contracts cover native types, bounds, labels and grouping. No new live server probe was performed in this recheck."
