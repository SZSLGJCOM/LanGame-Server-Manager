id = "evolved_native_user_settings_version"
kind = "runtime_probe"
path = "ShooterGame/Saved/Config/WindowsServer/GameUserSettings.ini"
authority = "installed_ark_survival_evolved_dedicated_server"
description = "On 2026-09-08, Windows dedicated-server build 21241282 reset an unversioned GameUserSettings.ini, disabling the configured RCON endpoint and replacing the session name. Adding Version=5 under [/Script/ShooterGame.ShooterGameUserSettings] retained the custom session name, player limit and RCON settings through startup and the game's UTF-16 writeback; authenticated ListPlayers returned a complete empty roster. Unreal ValidateSettings deletes invalid-version user settings; the required ARK section and version are also documented by the ark-server-tools maintainer."
url = "https://github.com/arkmanager/ark-server-tools/issues/722#issuecomment-274333283"

