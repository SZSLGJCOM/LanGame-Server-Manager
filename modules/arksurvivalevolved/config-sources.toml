[[exclusions]]
source = "launch_args"
key = "server_url.listen"
reason = "Fixed dedicated-listen mode for ARK Survival Evolved server startup."

[[exclusions]]
source = "launch_args"
key = "server_url.AltSaveDirectoryName"
reason = "LanGame fixes the save directory to the instance id so multiple servers cannot collide."

[[exclusions]]
source = "launch_args"
key = "server_url.Port"
reason = "Game port is instance port-binding state and is rendered into the ASE session URL."

[[exclusions]]
source = "launch_args"
key = "server_url.QueryPort"
reason = "Query port is instance port-binding state and is rendered into the ASE session URL."

[[exclusions]]
source = "launch_args"
key = "server_url.MaxPlayers"
reason = "Mirrors the structured max_players setting into the ASE session URL."

[[exclusions]]
source = "launch_args"
key = "server_url.MultiHome"
reason = "Bind address is instance network state, rendered by LanGame when the instance bind IP is explicit."

[[exclusions]]
source = "launch_args"
key = "-MULTIHOME"
reason = "Bind-address presence flag mirrors the instance bind IP and is not a gameplay setting."

[[exclusions]]
source = "launch_args"
key = "-server"
reason = "Fixed dedicated-server mode flag required for the managed host."

[[exclusions]]
source = "launch_args"
key = "-NullRHI"
reason = "Fixed headless rendering flag for a background-hosted server."

[[exclusions]]
source = "launch_args"
key = "-Unattended"
reason = "Fixed non-interactive Unreal server flag for the managed host."

[[exclusions]]
source = "launch_args"
key = "-NoSplash"
reason = "Fixed startup UI suppression for the managed host."

[[exclusions]]
source = "launch_args"
key = "-abslog"
reason = "LanGame owns the per-instance ARK log path."

