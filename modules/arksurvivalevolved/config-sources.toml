description = "Run 101 delivered the managed transcript, but its selected native game-log document remained empty through ready observations until 08:51:37Z, when the file was written and all 29 current-run lines became visible exactly. The installed build 21241282 parses FORCELOGFLUSH and invokes the file writer's flush path when enabled; Epic documents this flag as flushing after each line. The module now requests it to prevent native log buffering from hiding startup progress. Current-run timestamp filtering is unchanged. Run 107 on desktop build d34c6df544ca subsequently passed native readiness, 30 seconds of observation and normal stop (exit 0); all 32 recorded same-source game-log UI samples matched, including startup output while running. This is bounded sampled evidence, not an all-dialog or raw-byte guarantee."

