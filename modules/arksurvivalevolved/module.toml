id = "arksurvivalevolved"
name = "ARK: Survival Evolved Dedicated Server"
version = "0.1.0"
description = "Dedicated server module for ARK: Survival Evolved via SteamCMD."
steam_app_id = 376030
supported_platforms = ["windows"]

[install]
shared_game_dir = "arksurvivalevolved"

[process]
executable = "ShooterGame/Binaries/Win64/ShooterGameServer.exe"
args_template = [
  "{{arkse.server_url}}",
  "-NullRHI",
  "-Unattended",
  "-NoSplash",
  "-abslog={{arkse.native_log_path}}",
  "-stdout",
  "-AllowStdOutLogVerbosity",
  "-FORCELOGFLUSH",
  "{{arkse.multihome_flag}}",
  "{{arkse.cluster_dir_override_flag}}",
  "{{arkse.official_launch_flags}}",
  "{{arkse.custom_launch_flags}}",
]
working_directory_template = "{{paths.install_root}}/ShooterGame/Binaries/Win64"
window_policy = "background"
host_surface = "managed_terminal"
host_notes = "The dedicated server runs in the instance's private runtime. Native WindowsServer configuration is written before launch. AllowStdOutLogVerbosity includes normal Log-level output in the managed console; abslog retains the native map log and FORCELOGFLUSH makes each written line available during the run."

[storage]
runtime_copy_exclusions = ["ShooterGame/Saved", "ShooterGame/Binaries/Win64/PlayersExclusiveJoinList.txt", "ShooterGame/Binaries/Win64/PlayersJoinNoCheckList.txt"]
saves_path_template = "{{paths.install_root}}/ShooterGame/Saved/{{instance.id}}"
retained_paths = [
  "ShooterGame/Binaries/Win64/PlayersExclusiveJoinList.txt",
  "ShooterGame/Binaries/Win64/PlayersJoinNoCheckList.txt",
]

[[default_ports]]
name = "game"
protocol = "udp"
port = 7777

[[default_ports]]
name = "peer"
protocol = "udp"
port = 7778

[[default_ports]]
name = "query"
protocol = "udp"
port = 27015

[[default_ports]]
name = "rcon"
protocol = "tcp"
port = 27020

[[runtime.port_groups]]
id = "game_peer"
members = ["game", "peer"]
member_offsets = { game = 0, peer = 1 }

[runtime.bind_address]
mode = "strict"
port_names = ["game"]
startup_timeout_ms = 300000

[runtime.player_query]
protocol = "a2s_info"
port_names = ["query"]

[[runtime.player_actions]]
id = "broadcast"
kind = "broadcast"
label = "Broadcast"
label_zh_cn = "广播"
transport = "source_rcon"
command_template = "Broadcast {{target}}"
target_label = "Message"
target_label_zh_cn = "广播内容"
target_placeholder = "Single-line broadcast message"
target_placeholder_zh_cn = "单行广播内容"
target_required = true
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"

[runtime.player_list]
scope = "online"
source = "runtime_action"
action_id = "list_players"
player_action_ids = ["kick_player", "ban_player"]
response_codec = "ark_list_players"
identity_kind = "ark_account_id"
refresh_interval_ms = 30000

[[runtime.player_actions]]
id = "list_players"
label = "List players"
label_zh_cn = "玩家列表"
transport = "source_rcon"
command_template = "ListPlayers"
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"

[[runtime.player_actions]]
id = "kick_player"
label = "Kick"
label_zh_cn = "踢出"
transport = "source_rcon"
command_template = "KickPlayer {{target}}"
target_label = "SteamID"
target_label_zh_cn = "SteamID"
target_placeholder = "SteamID from ListPlayers"
target_placeholder_zh_cn = "ListPlayers 输出中的 SteamID"
target_required = true
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"
destructive = true

[[runtime.player_actions]]
id = "ban_player"
label = "Ban"
label_zh_cn = "封禁"
transport = "source_rcon"
command_template = "BanPlayer {{target}}"
target_label = "SteamID"
target_label_zh_cn = "SteamID"
target_placeholder = "SteamID from ListPlayers"
target_placeholder_zh_cn = "ListPlayers 输出中的 SteamID"
target_required = true
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"
destructive = true

[[runtime.player_actions]]
id = "unban_player"
label = "Unban"
label_zh_cn = "解封"
transport = "source_rcon"
command_template = "UnbanPlayer {{target}}"
target_label = "SteamID"
target_label_zh_cn = "SteamID"
target_placeholder = "SteamID"
target_placeholder_zh_cn = "SteamID"
target_required = true
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"
destructive = true

[[runtime.player_actions]]
id = "allow_no_check"
label = "Allow no-check join"
label_zh_cn = "允许免检加入"
transport = "source_rcon"
command_template = "AllowPlayerToJoinNoCheck {{target}}"
target_label = "SteamID"
target_label_zh_cn = "SteamID"
target_placeholder = "SteamID"
target_placeholder_zh_cn = "SteamID"
target_required = true
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"
destructive = true

[[runtime.player_actions]]
id = "disallow_no_check"
label = "Remove no-check join"
label_zh_cn = "移出免检名单"
transport = "source_rcon"
command_template = "DisallowPlayerToJoinNoCheck {{target}}"
target_label = "SteamID"
target_label_zh_cn = "SteamID"
target_placeholder = "SteamID"
target_placeholder_zh_cn = "SteamID"
target_required = true
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"
destructive = true

[runtime.shutdown]
grace_period_ms = 12000

[[runtime.shutdown.commands]]
transport = "source_rcon"
fallback_transport = "stdin"
command = "saveworld"
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"
wait_after_ms = 5000

[[runtime.shutdown.commands]]
transport = "source_rcon"
fallback_transport = "stdin"
command = "DoExit"
port_name = "rcon"
password_setting_key = "admin_password"
enabled_setting_key = "rcon_enabled"
wait_after_ms = 6000

[workshop]
provider = "steam"
consumer_app_id = 346110
supports_collections = false

[mods.source]
provider = "steam"
label = "Steam Workshop"
url = "https://steamcommunity.com/app/346110/workshop/"

[mods.enablement]
setting_key = "active_mod_ids"
setting_label = "ActiveMods"

[player_management]
status = "runtime_actions"
planned_surface = "source_rcon_and_server_rosters"
reason = "ARK Survival Evolved renders RCON settings and schema-backed admin, exclusive join, and ban/no-check rosters. LanGame dispatches ListPlayers, kick, ban, unban, and no-check join commands through the instance RCON port."
verification = "Start ShooterGameServer.exe on Windows, confirm GameUserSettings.ini and roster files are materialized, run ListPlayers over RCON, and verify kick/ban/unban/no-check join side effects against a test Steam64 ID."

[[runtime.port_roles]]
role = "player"
port_names = ["game", "peer", "query"]

[[runtime.port_roles]]
role = "service"
port_names = ["rcon"]
