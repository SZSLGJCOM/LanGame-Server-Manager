id = "building_limit_documentation_review"
kind = "documentation"
path = "DefaultPalWorldSettings.ini / official configuration guide 1.0.4"
authority = "official_palworld_configuration_and_packaged_defaults"
url = "https://docs.palworldgame.com/settings-and-operation/configuration/"
description = "2026-09-30: installed build 25247047 DefaultPalWorldSettings.ini SHA256 062b57202ed841de7227108c2ebb3e03e9a420e51c828859c3e314f3fe0a4d3c matches the previously reviewed file. The 1.0.4 guide calls MaxBuildingLimitNum a per-player cap and omits MaxBuildingLimitNumPerPlayer. Current native consumers instead check the former against the base containing the placement location and the latter against player-attributed buildings plus pending reservations. The controls now reflect those separate current-build checks; see native_semantics_build_25247047. No runtime gameplay test is claimed."

[[sources]]
id = "semantic_review_2026_09_30"
kind = "documentation"
path = "https://docs.palworldgame.com/settings-and-operation/configuration/"
authority = "first_party_documentation_and_installed_package_semantic_review"
description = "Semantic review on 2026-09-30 of 118 active configuration fields in both languages. Current native consumers distinguish per-base and per-player building limits, conditional UNKO creation and its separate drop count. Blueprint consumers establish that bInvisibleOtherGuildBaseCampAreaFX hides other-guild base boundary effects. CoopPlayerMaxNum and bIsMultiplay are local-host controls skipped by dedicated paths; Difficulty is menu preset/telemetry metadata whose menu multipliers are not applied at dedicated startup. Those three controls are excluded. bEnableDefenseOtherGuildPlayer and bEnableNonLoginPenalty are also excluded as unsupported_semantics: their actual gameplay consumers remain unestablished, not proven absent. Existing stored JSON and native option values are retained; INI formatting may be normalized during merge. No new server/client gameplay run was performed; historical verification status is unchanged."

[[sources]]
id = "native_semantics_build_25247047"
kind = "install_probe"
path = "Pal/Binaries/Win64/PalServer-Win64-Shipping-Cmd.exe"
authority = "read_only_official_package_static_analysis"
description = "2026-09-30 read-only build 25247047 analysis; executable SHA256 6f929673e7ac637d591d6f3454dbd396be7911093311cb8b24af3a152b217f49. RVAs use PE image base 0x140000000. FPalOptionWorldSettings field offsets are MaxBuildingLimitNum 0x18c, MaxBuildingLimitNumPerPlayer 0x190, bActiveUNKO 0x80, DropItemMaxNum_UNKO 0x8c, CoopPlayerMaxNum 0xcc and ServerPlayerMaxNum 0xd0. RVA 0x2f0bbd0 checks the 0x18c limit through PalPlayerState -> PalBaseCampManager -> GetInRangedBaseCamp -> GetBuildingNum for the placement location. RVA 0x2f254d0 independently checks 0x190 against player-attributed counts and pending reservations; either limit <=0 skips its check. RVA 0x317d9d0 gates Unko_S/Unko_L creation on bActiveUNKO, the separate ActiveUNKO feature flag and character conditions. RVAs 0x2fa0910/0x2fa5bd0 apply the separate UNKO-category drop count. Reflection enum metadata at file offset 0x6f96f30 lists None=0, Easy=1, Normal=2, Hard=3, Hardcore=4, Custom=5; this does not prove preset precedence. Capacity initialization at RVA 0x2dde8b0 calls the dedicated-server predicate through RVA 0x31ad330 -> 0x4e90390, which returns true in this dedicated executable; it reads ServerPlayerMaxNum and skips the CoopPlayerMaxNum branch. No native asset modification or server/client execution was performed."

