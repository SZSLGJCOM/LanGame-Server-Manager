id = "native_blueprint_semantics_build_25247047"
kind = "install_probe"
path = "PalServer-Win64-Shipping-Cmd.exe; BP_BuildObject_PalBoxV2; BP_PalGameInstance; WBP_TitleLocalWorldSelect; WBP_Title_WorldSettings"
authority = "read_only_official_package_static_analysis"
description = "Build 25247047, executable SHA256 6f929673e7ac637d591d6f3454dbd396be7911093311cb8b24af3a152b217f49. Package index/directory and compressed entry hashes and decoded lengths were checked. Accepted Kismet functions consume the complete serialized stream and match declared runtime bytecode sizes. BP_BuildObject_PalBoxV2 .uexp SHA256 891f9e4a7b659d164e83245ff8df24a3036f02dc433fd7a5b4b99aa9140ef74e: ReceiveTick enters Ubergraph offset 98; offset 178 tests bInvisibleOtherGuildBaseCampAreaFX. True reaches UpdateVisibleAreaRange at 201, which calls SetHiddenInGame(!IsSameGuildInLocalPlayer,false) on AreaRange/AreaRange1; false skips this filtering. This affects boundary effects, not structures or map markers. WBP_TitleLocalWorldSelect .uexp SHA256 616a5d76c615629f3268313b2a365c7f57edb245b0550875971424ded8c47429: offset 1836 passes bIsMultiplay to StartGame as bListenServer. BP_PalGameInstance .uexp SHA256 793e7be0d693ea5b7bb5aff25d271f2b503cb6d3622708545011d582dd437839: offset 4884 branches on bListenServer; true reaches CreateSessionAsyncFunction at 5409, false loads the local level at 5625. Dedicated IsDedicatedServer and IsMultiplayer paths are independent of this flag. Native ApplyWorldPreset VA 0x142fbe8f0 writes menu preset multipliers; initialization at 0x142fcfacf takes the dedicated branch to 0x142fcfaec and copies explicit CDO OptionSettings at 0x142fcfb23, skipping the non-dedicated preset application at 0x142fcfad3..0x142fcfae5. Difficulty has a verified telemetry read at 0x142ddb799 and menu consumers, so it is not declared unused. No runtime gameplay execution is claimed."

[[sources]]
id = "unsupported_boolean_semantics_build_25247047"
kind = "install_probe"
path = "PalServer-Win64-Shipping-Cmd.exe; Pal/Content/Pal/Blueprint; official configuration guide 1.0.4"
authority = "bounded_read_only_native_consumer_search"
url = "https://docs.palworldgame.com/settings-and-operation/configuration/"
description = "bEnableDefenseOtherGuildPlayer (struct offset 0xc3) and bEnableNonLoginPenalty (0xbe) are native reflected fields and receive world-mode preset assignments at VAs 0x142fbe8c7 and 0x142fbe8a9. The current official parameter guide omits both. Exact-property scans of 10,311 Blueprint .uasset files (85,082,888 decoded bytes) locate them only in menu/parameter carriers. Static native byte-read/compare candidates at displacements 0xbe/0xc3 and subsystem-relative 0x42e/0x433 resolve to known structure copies/serialization or unrelated structures, without an established gameplay effect consumer. This bounded search does not exclude indirect or wider-load consumers and is not proof the fields are dead. They are excluded as unsupported_semantics rather than exposed with invented defense or offline-penalty descriptions. Existing stored JSON and native option values remain retained."
