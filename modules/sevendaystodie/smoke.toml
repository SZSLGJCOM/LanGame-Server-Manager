schema_version = 1
module_id = "sevendaystodie"
primary_process_key = "main"
readiness_timeout_ms = 180000
poll_interval_ms = 1000
stability_window_ms = 3000
probe_mode = "all"

[fixture.settings]
telnet_enabled = true

[[probes]]
id = "server-network-ready"
kind = "log_marker"
sources = [{ kind = "process", process_key = "main" }]
any_of = ["StartAsServer", "LiteNetLib"]

# Steam build 24994542: Telnet opens during world creation; StartAsServer is earlier.
# Require the native world-start completion observed in the 2026-10-19 isolated run.
[[probes]]
id = "world-started"
kind = "log_marker"
sources = [{ kind = "process", process_key = "main" }]
any_of = ["INF StartGame done"]

[[probes]]
id = "telnet-connect"
kind = "tcp_connect"
port_name = "telnet"
