[[sources]]
id = "installed_player_moderation_24994542"
kind = "runtime_console"
path = "<validated-install-root>/7DaysToDieServer_Data/Managed/Assembly-CSharp.dll"
authority = "installed_7_days_to_die_build_24994542_managed_assembly"
description = "Static IL inspected on 2026-09-27: listplayers provides canonical platform accounts; ban add saves native blacklist data and removes the target administrator; ban remove accepts offline namespaced accounts. AdminBlacklist.Write uses yyyy-MM-dd HH:mm:ss via Utils.StandardCulture, and AdminTools.Save can catch write failures. The manager confirms the target in native XML before persisting its result. Detailed evidence and synthetic protocol fixtures are recorded in apps/desktop/src-tauri/test-data/live-players/seven-days/SOURCE.md; this is not a live multiplayer moderation test."

