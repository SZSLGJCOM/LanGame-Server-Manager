[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "<validated-install-root>/serverconfig.xml"
authority = "native_package_and_documentation_semantic_review"
description = "2026-09-30: 70 presentation entries reviewed in EN/ZH against the referenced package/docs. Official recommended RWG sizes 6144, 8192, 10240 clarified without forbidding custom values. Clarifies real days, not in-game days. Concurrent dynamic-mesh work items instead of workers. Boundaries: No new native runtime/gameplay acceptance is claimed; historical verification dates remain unchanged."
