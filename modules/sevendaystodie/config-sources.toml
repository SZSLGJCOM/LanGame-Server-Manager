description = "An isolated anonymous SteamCMD update and validate on 2026-10-28 completed public app 294420 build 26167630 with StateFlags 4 and UpdateResult 0. The 68 packaged serverconfig.xml properties and defaults are unchanged from build 25661908/V3.3.0; the current template covers them, with UserDataFolder as the additional instance boundary. Executable, Assembly-CSharp, config and startup-file identities are recorded in the portable fixture. A separate non-elevated production lifecycle passed four native-ready runs and normal exit-0 stops, current-run Telnet save requests, fresh-process reload, 70-file backup restoration, archive/deferred-commit recovery, uninstall retention and fixture cleanup. Telnet receipts remain requested; no request-caused durable checkpoint, client join or player progress is claimed. The publisher identifies V3.4.0 Stable and separately warns about pre-3.4 shared-quest multiplayer crashes. Historical moderation evidence keeps its original scope."

