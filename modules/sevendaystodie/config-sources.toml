status = "best_effort_verified"
last_verified = "2026-10-31"
notes = "Read-only review on 2026-10-31 of freshly validated public app 294420 build 26237934 confirms V3.4.0 (b9) from its managed assembly. All 68 packaged serverconfig.xml properties/defaults, the startup script and entry executable match build 26167630; the current template covers every property and adds only the instance-isolation UserDataFolder. Native SandboxCode version-A framing and the saveworld/sa command remain present. A separate managed backend lifecycle on build 26237934 passed four native-ready runs, four current-run Telnet save requests, normal exit-0 stops, 70-file backup restoration, archive interruption recovery and final cleanup. Save completion remains requested; no request-caused durable checkpoint, saved player progress or client acceptance is claimed. This verification date covers that package/configuration and lifecycle scope; the build 26167630 lifecycle and historical moderation evidence retain their original dates. Earlier build 25661908/V3.3.0 (b18) SandboxCode observations remain below. The V2.6 runtime-generated serveradmin.xml and build 24994542 blacklist-expiry observations remain separately dated below. Duration zero expires immediately; the online command explicitly bans for 10 years and records its confirmed native result. Blacklist removal sends the offline account unban command while running; arbitrary blacklist additions and edits remain restart-scoped."

