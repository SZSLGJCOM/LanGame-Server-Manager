status = "best_effort_verified"
last_verified = "2026-08-10"
notes = "SteamCMD app 294420 build 24392395 and the locally launched V2.6 (b14) server were re-audited on 2026-08-10. The runtime-generated serveradmin.xml uses adminTools/users, commands, a platform namespace plus userid for Steam/EOS/XBL/PSN user identities, and a parseable date string for blacklist unbandate. A 2026-09-27 static IL check of build 24994542 confirms native saves preserve local expiry time to seconds. Duration zero expires immediately; the online command therefore explicitly bans for 10 years and records its confirmed native result. Blacklist removal sends the offline account unban command while running; arbitrary blacklist additions and edits remain restart-scoped."

[[sources]]
id = "configuration_review_20260930"
kind = "documentation"
path = "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=251570&count=8&maxlength=0&feeds=steam_community_announcements"
authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: The publisher feed distinguishes V3.2.0 Stable (2026-08-26) from opt-in V3.3.0 EXP (2026-09-24); experimental is not treated as the default stable target. The installed app 294420 manifest reports build 24994542. All 68 properties in its packaged serverconfig.xml are covered by the template; UserDataFolder is an additional instance-isolation property. SandboxCode already replaces the retired gameplay properties. Player rosters and maintenance actions retain their separate workspaces."

