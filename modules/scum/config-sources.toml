[[sources]]
id = "native_semantics_build_25247308"
kind = "documentation"
path = "SCUM/Binaries/Win64/SCUMServer.exe"
authority = "first_party_installed_executable_static_analysis"
description = "2026-09-30 read-only analysis of Steam app 3792580 build 25247308; executable SHA256 4ca11449c4c8d3a243c797c719f66e33192eefad53a9c64cca9aac925c9e39ad. Native localized setting descriptions confirm fifteen MinPurchasedAmount controls are minimum quantities available to buy (some include engines), LogoutTimerInBunker is seconds, virtualization visitor movement/bounds and assumed item bounds are centimeters, update period is seconds and processing budget is milliseconds. Numeric registration confirms MaxPing=200, MaxAllowedKillboxKeycards=4 and its PoliceStation variant=3. Explicit stored values remain unchanged. Seven apparent numeric differences are single-player branches: the multiplayer branch (identified by the PartialWipe_Multiplayer description path) retains ZombieDamageMultiplier, both spawner expiration multipliers, PuppetHealthMultiplier and both encounter multipliers at 1, and NighttimeDarkness at 0. ServerSettingsVersion remains the generated version 7, not its pre-initialization constructor value 0. Of 437 inventory defaults, 304 numeric constructor registrations were examined; 133 Boolean/text registrations retain the dated generated baseline because their current default construction was not fully resolved. The bunker logout tooltip says maximum 36000 while the registered bound is 86400; no restrictive maximum is added. This evidence does not require launching a user instance."

