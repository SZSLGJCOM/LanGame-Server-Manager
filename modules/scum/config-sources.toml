path = "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=513710&count=8&maxlength=0&feeds=steam_community_announcements"
authority = "first_party_documentation_and_read_only_installed_package_review"
description = "2026-09-30: The official publisher feed lists hotfix 1.3.3.4.149664 (2026-09-11). The installed app 3792580 manifest reports build 25247308. The existing ServerSettings.ini contains 436 scum-prefixed keys, all represented in the current ledger; its generated version marker is separately owned. The four August settings are already modeled. This was a key-only read of an existing generated file, not a fresh elevated launch or proof that a newer executable cannot generate more settings."

[[sources]]
id = "elevated_native_start_build_25187656"
kind = "runtime_probe"
path = "../../apps/desktop/src-tauri/src/commands_native_lifecycle_tests.rs"
authority = "authorized_elevated_isolated_local_package_probe"
description = "2026-09-21: source snapshot aa0eba1f602d ran native_package_lifecycle with the operator-authorized SCUM elevation acknowledgement against an isolated copy of existing local Steam build 25187656. The actual elevated worker was verified, its owned SCUMServer process reached current-world execution, and fresh Global Stats continued during observation. The managed wrapper returned exit 0; the owned process, fixture root and temporary firewall rules were absent after completion. PowerShell stream redirection captured the wrapper header but omitted native stdout, so individual stage lines and save/config file counts are not claimed from that log. A fully captured repeat and final integration checks were subsequently blocked by concurrent Assistant interface changes before any new native process started. This closes the non-elevated startup gap but does not establish fresh-download, populated-player, A2S or public-listing support. The prior generated-settings audit remains separately dated."

