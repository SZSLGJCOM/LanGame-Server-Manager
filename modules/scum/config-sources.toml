kind = "documentation"
path = "https://dev.epicgames.com/documentation/en-us/unreal-engine/command-line-arguments?application_version=4.27"
authority = "first_party_engine_documentation"
description = "2026-10-01: Epic's Unreal Engine 4.27 command-line reference documents -log as requesting a separate live log window, distinct from LOG=filename. LanGame requests this engine surface as a fixed SCUM launch argument on its managed private desktop. This is an engine contract, not a SCUM publisher guarantee or proof of a successful new graceful-stop run."

[[sources]]
id = "existing_instance_console_absent_20261001"
kind = "runtime_probe"
path = "SCUM/Binaries/Win64/SCUMServer.exe"
authority = "authorized_existing_instance_and_elevated_read_only_native_inspection"
description = "2026-10-01: the existing SCUM instance reached fresh world statistics but graceful Ctrl+C failed. A read-only elevated inspector pinned the exact process creation identity and verified that AttachConsole returned ERROR_INVALID_HANDLE (6), the GUI-subsystem game owned no top-level window, and its only descendant was crashpad. The elevated launch helper had a separate hidden console. The launch lacked -log; adding it and routing normal Ctrl+C through the already approved owner addresses these two observed boundaries. A fresh SCUM launch and natural stop remain required to verify the resulting behavior."

