[[sources]]
id = "packaged_defaults_crosscheck_25247308"
kind = "documentation"
path = "SCUM/Content/Paks and multiplayer settings registration"
authority = "independent_current_official_package_and_native_review"
description = "2026-09-30 independent review read all 47 current package indices with SHA1 verification and checked all 50 packaged INI files. None contains MaxPing, MaxAllowedKillboxKeycards or MaxAllowedKillboxKeycards_PoliceStation; there is no DefaultServerSettings.ini and DedicatedServerEngine.ini is empty. DefaultEngine.ini SHA256 60a19344f8b8842bfe4a213d9e1b28f4b370e62bf46d65b6c4abea54fc245fa2; DefaultGame.ini SHA256 61677ca246ebfd285cffaf6e2b7a223cd022aa32cc6634ca7846436251ebdfa4. The multiplayer initialization branch at 0x142303e8d passes mode1 to0x142308c00. Float and integer setting constructors0x1422cbe10 and0x1422cb920 use the same parameter for the default text and initial CVar when absent. This supports effective uncustomized multiplayer defaults200/4/3 without inferring them solely from a preinitialization constructor. Existing user values and console overrides retain precedence; no game instance was executed."
