status = "download_verified_requires_elevation"
last_verified = "2026-09-08"
notes = "The archived generated v7 baseline plus four official August 2026 additions provide 436 specialized controls and one generated version key. The four new keys and default values also match the existing installed build 25187656 configuration inspected read-only on 2026-09-28; this is not a new clean-launch verification. Three generated JSON contracts are structured. Player identity rosters remain in Player Access. Runtime still requires elevation. The later authorized elevated startup observation is separately dated below; it does not replace the configuration acceptance baseline."

