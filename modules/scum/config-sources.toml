[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://store.steampowered.com/news/posts/?appids=513710&enddate=1716386557&feed=steam_community_announcements"
authority = "native_package_and_documentation_semantic_review"
description = "2026-09-30: 448 presentation entries reviewed in EN/ZH against the referenced package/docs. Removed 436 native and 37 JSON generated title/key echoes. Added eight evidence-backed native helps and 17 JSON helps; unsupported help remains absent. Notification duration seconds, repeat wait minutes, raid announcement lead minutes, day weekday-rule and RGB color labels corrected. Four broken NP Cs acronym labels normalized to NPCs in inventory and matching schema. partial_wipe, gold_wipe, full_wipe moved to explicit Maintenance editor; ordinary Configuration retains 433 native controls. Stops require status Stopped, zero processes and no active run. Enabling still requires per-field confirmation. Saves use scoped nested merge, CAS, persisted readback and save coordinator; local conflicts/failures block starts until retry or discard. The three saved wipe switches persist across materialization; the shared notice and every per-switch confirmation require manual disabling, without promising automatic one-shot consumption. Boundaries: Vehicle MinPurchasedAmount precise interpretation is not established by retrieved current first-party text. disable_examine_ghost precise game behavior is not established by its variable name. logout_timer_in_bunker uses a large numeric default but its unit was not inferred as milliseconds. item_virtualization_visitor_bounds, virtualized_item_bounds and visitor_distance_travelled_for_update spatial units remain undocumented in retrieved sources. Inventory/nativeDefault equality is a serialization check, not proof that every old generated value is the pristine current-build engine default. Most native settings have no retrieved detailed behavior reference beyond native names and current generated inventory; absence of an extra help bubble is intentional, not a claim that all gameplay effects were tested."

