[[sources]]
id = "master_worldgenoverride"
kind = "config_file"
path = "clusters/main/Master/worldgenoverride.lua"
authority = "installed_dst_dedicated_server_package"
description = "Master shard world-generation and world-setting overrides. Native options were enumerated from the validated first-party scripts.zip. Independently selectable settings_preset and worldgen_preset follow Klei update 528116: SURVIVAL_TOGETHER, RELAXED, ENDLESS, WILDERNESS, and LIGHTS_OUT. Custom preset IDs must exist in the installed game or mods. With a non-default preset, schema-default fields inherit the preset; changed fields and explicit extra Lua overrides take precedence."
url = "https://kleiforums.com/game-updates/dst/528116-r1891/"

[[sources]]
id = "caves_worldgenoverride"
kind = "config_file"
path = "clusters/main/Caves/worldgenoverride.lua"
authority = "installed_dst_dedicated_server_package"
description = "Caves shard world-generation and world-setting overrides: 86 independently editable native options plus 34 inherited Master options. settings_preset and worldgen_preset default independently to DST_CAVE; custom IDs must exist in the installed game or mods. Independent schema-default fields inherit a non-default Caves preset; shared fields inherit the effective Master values and known Master settings preset. Explicit Caves extra Lua overrides and full-file scripts retain their authority."
url = "https://forums.kleientertainment.com/forums/topic/53014-worldgenoverridelua-with-the-new-post-caves-settings/"

