status = "best_effort_verified"
last_verified = "2026-09-19"
notes = "Klei official CLI/cluster documentation and game 747465 first-party scripts.zip SHA-256 99a2efdbb439c7e1386e8c8a503887e14c87689ae2c91958c2922f8f877c5354. The tracked world-options.json inventory contains all 236 built-in declarations: Master world generation/settings 64/126 and Caves 38/48 independently editable fields. Page membership and enum values are checked against schema.json; native-package comparison additionally checks groups, group and option order, visibility, version and hash. Caves additionally receives 34 inherited masteroption values. Mod configuration_options remain dynamically defined by each installed modinfo.lua and are represented by independent structured Master/Caves maps and raw expert escape hatches."

