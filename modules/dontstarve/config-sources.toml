kind = "documentation"
authority = "island_adventures_author_release_source"
path = "scripts/map/levels/shipwrecked.lua; scripts/map/levels/volcano.lua"
url = "https://gitlab.com/IslandAdventures/IslandAdventures/-/tree/1.0.61/scripts/map/levels"
description = "Author Shipwrecked release 1.0.61 defines SURVIVAL_SHIPWRECKED_CLASSIC (shipwrecked) and SURVIVAL_VOLCANO_CLASSIC (volcanoworld). Independent Volcano uses Islands volcanoisland=none. Shipwrecked Workshop 1467214795 requires Core 3435352667; both are server Mods required by clients. Raw overrides remain operator-owned."

