[[sources]]
id = "installed_package_masteroption_inheritance"
kind = "config_file"
path = "data/databundles/scripts.zip!/scripts/map/customize.lua:GetMasterOptions; scripts/screens/redux/servercreationscreen.lua:onCreate; scripts/map/levels/forest.lua"
authority = "installed_dst_dedicated_server_package"
description = "2026-09-19 inspection of game 747465, Steam build 24700372, scripts.zip SHA-256 99a2efdbb439c7e1386e8c8a503887e14c87689ae2c91958c2922f8f877c5354: the official creation screen copies 34 masteroption values to every secondary world before starting it. Only 15 of those options have master_sync; the 13 extra activities and specialevent are not runtime-synchronized. Caves has 86 independent options plus 34 inherited values, not 120 independently editable controls. Known built-in settings presets supply inherited defaults; explicit Master Lua literals take precedence, while arbitrary scripts and unknown mod presets remain operator-owned."

[[sources]]
id = "installed_package_location_defaults"
kind = "config_file"
path = "data/databundles/scripts.zip!/scripts/map/locations.lua; scripts/map/customize.lua:GetLocationDefaultForOption"
authority = "installed_dst_dedicated_server_package"
description = "Read-only verification on 2026-09-08 of installed Steam build 24700372: scripts.zip SHA-256 99a2efdbb439c7e1386e8c8a503887e14c87689ae2c91958c2922f8f877c5354. The 236 built-in options still cover Master 190 and Caves 86. Location overrides must be applied after customize.lua base values: cave uses task_set=cave_default and start_location=caves. Writing the forest values default/default into the cave preset replaces its task graph and prevents successful cave generation. Custom Lua scripts remain operator-owned. This source records package configuration inspection; game-client admission is validated separately."

[[sources]]
id = "steamcmd_anonymous_validate_343050"
kind = "install_probe"
path = "<validated-install-root>/steamapps/appmanifest_343050.acf"
authority = "steamcmd_anonymous_app_update_validate"
description = "2026-07-13 SteamCMD app_update 343050 validate completed successfully. Manifest name Don't Starve Together Dedicated Server, StateFlags 4, UpdateResult 0, buildid and TargetBuildID 24080846, SizeOnDisk 4509552230, installed depots 1004 and 343051."

[[sources]]
id = "installed_package_world_options"
kind = "config_file"
path = "data/databundles/scripts.zip!/scripts/map/customize.lua; scripts/map/tasksets.lua; scripts/map/tasksets/*.lua; scripts/map/startlocations.lua; scripts/widgets/redux/worldsettings/worldsettingsmenu.lua; modules/dontstarve/world-options.json"
authority = "installed_dst_dedicated_server_package"
description = "2026-09-19 read-only extraction from game 747465, scripts.zip SHA-256 99a2efdbb439c7e1386e8c8a503887e14c87689ae2c91958c2922f8f877c5354. All 236 declarations, 5 worldgen groups and 10 settings groups are recorded in world-options.json. PC description branches, ocean-prefixed values, group fallbacks, all loaded task-set/start-location registrations and location/master_controlled visibility yield 64/126/38/48 controls; all 276 page-specific enum sets match schema.json. scripts/verify_dst_world_options.py checks the tracked contract by default; --install-root compares an owned native package and --write refreshes only the inventory. Unknown data expressions and dynamic registrations fail explicitly without executing Lua. This is a maintained source inventory, not automatic runtime discovery of game updates or mod options. The read-only native inventory verifier was rerun on 2026-09-30 against installed Steam build 24700372 / game 747465. All 236 declarations, groups, ordering, locations and enum values match the tracked inventory and schema; scripts.zip remains SHA256 99a2efdbb439c7e1386e8c8a503887e14c87689ae2c91958c2922f8f877c5354."

