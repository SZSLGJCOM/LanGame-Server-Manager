[[exclusions]]
source = "launch_args"
key = "-persistent_storage_root"
reason = "Derived from this instance config directory so each managed cluster is isolated."

[[exclusions]]
source = "launch_args"
key = "-conf_dir"
reason = "Fixed to the managed clusters directory."

[[exclusions]]
source = "launch_args"
key = "-cluster"
reason = "Fixed to the managed main cluster directory."

[[exclusions]]
source = "launch_args"
key = "-shard"
reason = "Derived independently for the Master and optional Caves process plans."

[[exclusions]]
source = "launch_args"
key = "-offline"
reason = "The typed NETWORK.offline_cluster setting controls native offline mode without a duplicate launch switch."

[[exclusions]]
source = "launch_args"
key = "-bind_ip"
reason = "Derived from instance network state for both shard process plans."

[[exclusions]]
source = "launch_args"
key = "-port"
reason = "Derived from independent Master and Caves instance UDP port bindings."

[[exclusions]]
source = "launch_args"
key = "-players"
reason = "The typed GAMEPLAY.max_players setting is the canonical native control."

[[exclusions]]
source = "launch_args"
key = "-steam_master_server_port"
reason = "Derived from independent per-shard Steam query port bindings in server.ini."

[[exclusions]]
source = "launch_args"
key = "-steam_authentication_port"
reason = "Derived from independent per-shard Steam authentication port bindings in server.ini."

[[exclusions]]
source = "launch_args"
key = "-tick"
reason = "The typed NETWORK.tick_rate setting is the canonical native control."

[[exclusions]]
source = "launch_args"
key = "-ugc_directory"
reason = "Always generated as the instance-owned data/ugc/<shard> path so native UGC downloads cannot collide across instances or shard processes."

[[exclusions]]
source = "launch_args"
key = "-token"
reason = "The cluster_token.txt setting is the canonical secret surface and avoids placing the token in process arguments."

[[exclusions]]
source = "launch_args"
key = "-monitor_parent_process"
reason = "LanGame supervises both shard processes directly and does not delegate their lifecycle to an arbitrary external PID."

[[exclusions]]
source = "launch_args"
key = "-console"
reason = "Always generated because the managed terminal, live-player query, kick, save, and shutdown actions require native console stdin."

[[exclusions]]
source = "master_server_ini"
key = "NETWORK.server_port"
reason = "Derived from the Master instance port binding."

[[exclusions]]
source = "master_server_ini"
key = "SHARD.is_master"
reason = "Generated true for the canonical Master shard."

[[exclusions]]
source = "master_server_ini"
key = "SHARD.name"
reason = "Generated as the canonical Master shard name."

[[exclusions]]
source = "master_server_ini"
key = "STEAM.master_server_port"
reason = "Derived from the Master Steam query port binding."

[[exclusions]]
source = "master_server_ini"
key = "STEAM.authentication_port"
reason = "Derived from the Master Steam authentication port binding."

[[exclusions]]
source = "caves_server_ini"
key = "NETWORK.server_port"
reason = "Derived from the Caves instance port binding."

[[exclusions]]
source = "caves_server_ini"
key = "SHARD.is_master"
reason = "Generated false for the canonical Caves shard."

[[exclusions]]
source = "caves_server_ini"
key = "SHARD.name"
reason = "Generated as the canonical Caves shard name."

[[exclusions]]
source = "caves_server_ini"
key = "SHARD.id"
reason = "Generated deterministically from immutable instance identity so display-name edits cannot change shard identity."

[[exclusions]]
source = "caves_server_ini"
key = "STEAM.master_server_port"
reason = "Derived from the Caves Steam query port binding."

[[exclusions]]
source = "caves_server_ini"
key = "STEAM.authentication_port"
reason = "Derived from the Caves Steam authentication port binding."

[[exclusions]]
source = "cluster_ini"
key = "SHARD.master_ip"
reason = "Generated as loopback because LanGame co-locates the managed Master and Caves shard processes."

[[exclusions]]
source = "cluster_ini"
key = "SHARD.master_port"
reason = "Derived from the instance shard coordination port binding."

[[exclusions]]
source = "cluster_ini"
key = "SHARD.cluster_key"
reason = "Generated from immutable instance identity to isolate shard coordination."

[[exclusions]]
source = "cluster_ini"
key = "MISC.console_enabled"
reason = "Always generated because managed stdin actions and graceful shutdown require the native console."

[[exclusions]]
source = "master_modoverrides"
key = "arbitrary mod configuration schema"
reason = "Each installed Workshop mod defines its own configuration_options in modinfo.lua; the Configuration renderer introspects that first-party mod payload and validates primitive leaves."

[[exclusions]]
source = "caves_modoverrides"
key = "arbitrary mod configuration schema"
reason = "Each installed Workshop mod defines its own configuration_options in modinfo.lua; the Configuration renderer introspects that first-party mod payload and validates primitive leaves."

[[sources]]
id = "semantic_review_2026_09_30"
kind = "documentation"
path = "data/databundles/scripts.zip"
authority = "first_party_documentation_and_installed_package_semantic_review"
description = "Semantic review on 2026-09-30 of 311 active configuration fields in both languages. Pond frog population and replenishment are separate from Frog Rain. Gate cooldown values are 40/30/20/10/5 game days. Antlion fields control tribute and rage timing. Log retention is a count; the log backup interval uses seconds. Language, shard, friends and sandbox-write fields have bilingual labels. Configuration is the sole raw Lua editing surface; Mods detects raw Lua and disables structured writes. No fresh server/client run was performed; existing evidence dates and status remain unchanged."

