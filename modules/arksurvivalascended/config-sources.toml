id = "asa_server_patch_notes_v93_36"
kind = "documentation"
path = "ASA official server changelog"
authority = "studio_wildcard_official_server_patch_notes"
url = "https://survivetheark.com/index.php?/forums/topic/773786-asa-server-patch-notes-server-v9336-updated-09242026/"
description = "Reviewed 2026-09-30 from the official changelog index. The current server page reports v93.36 dated 2026-09-24; the v93.22, v93.25, v93.33 and v93.36 changes after the previous review add no documented native configuration keys. The installed library manifest reports build 25535041. This does not establish a new exhaustive binary inventory or native runtime acceptance."

[[sources]]
id = "semantic_review_20260930"
kind = "documentation"
path = "https://ark.wiki.gg/wiki/Server_configuration"
authority = "source_and_native_contract_semantic_review"
description = "Semantic review on 2026-09-30 compared all 273 settings and both rendered locales with the official ARK wiki crosswalk and native bindings. Bilingual help covers nearby text chat, resource-regrowth delay direction and structure pickup using canonical field descriptions. Native defaults and keys are unchanged; gameplay effects were not newly exercised."
