[[exclusions]]
source = "launch_args"
key = "-server"
reason = "Fixed dedicated-server mode flag required for the managed host."

[[exclusions]]
source = "launch_args"
key = "-NullRHI"
reason = "Fixed headless rendering flag for a background-hosted server."

[[exclusions]]
source = "launch_args"
key = "-Unattended"
reason = "Fixed non-interactive Unreal server flag for the managed host."

[[exclusions]]
source = "launch_args"
key = "-NoSplash"
reason = "Fixed startup UI suppression for the managed host."

[[exclusions]]
source = "launch_args"
key = "-abslog"
reason = "LanGame owns the per-instance ARK log path."

[[exclusions]]
source = "launch_args"
key = "-port"
reason = "Game port is instance port-binding state, not a gameplay setting."

[[exclusions]]
source = "launch_args"
key = "server_url.AltSaveDirectoryName"
reason = "LanGame fixes the save directory to the instance id so multiple servers cannot collide."

[[exclusions]]
source = "launch_args"
key = "server_url.QueryPort"
reason = "Query port is instance port-binding state."

[[exclusions]]
source = "launch_args"
key = "server_url.MaxPlayers"
reason = "Mirrors the structured max_players setting, which is recorded against [SessionSettings].MaxPlayers."

[[exclusions]]
source = "launch_args"
key = "server_url.MultiHome"
reason = "Bind address is instance network state, not a game setting."

[[exclusions]]
source = "launch_args"
key = "server_url.ServerPassword"
reason = "Stored only in [ServerSettings].ServerPassword in GameUserSettings.ini to keep the password out of OS command lines and native startup logs."

[[exclusions]]
source = "launch_args"
key = "server_url.SessionName"
reason = "Mirrors [SessionSettings].SessionName to the startup URL for ARK's launch parser."

[[exclusions]]
source = "launch_args"
key = "server_url.ServerAdminPassword"
reason = "Stored only in [ServerSettings].ServerAdminPassword in GameUserSettings.ini to keep the password out of OS command lines and native startup logs."

