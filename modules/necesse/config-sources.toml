id = "native_server_cfg_build_24926481"
kind = "config_file"
path = "Server.jar:necesse/engine/Settings.class"
authority = "installed_necesse_dedicated_server_build_24926481_read_only_bytecode"
description = "2026-09-28: Necesse 1.3.3 Settings class SHA256 b5eed1bb24e7d9589ed3e2add612e40814f16081bfa22900d7065fafb464954b. getServerSaveData, loadServerData and clinit confirm SERVER keys and defaults: maxClientLatencySeconds 30, unloadLevelsCooldown 30 (minimum 2), droppedItemsLifeMinutes 0, unloadSettlements false, maxSettlementsPerPlayer -1, maxSettlersPerSettlement -1. loadServerData also accepts worldBorderSize >= -1, default -1, although native saves omit that key. Optional LGSM overrides preserve current instance cfg values when unset. ServerLoader explicitly loads -settings via Settings.loadServerSettings(File,false); it accepts -strictserverauthority 1/true or 0/false and no longer reads -giveclientspower. Internal strict_server_authority values are retained. The selected -settings file is instance data/cfg/server.cfg; worlds and archives are not edited. Read-only recheck on 2026-09-30 confirms the installed build remains 24926481 and Settings.class retains the recorded SHA256. The official multiplayer guide still lists the older -giveclientspower argument; the exact native ServerLoader evidence remains authoritative for -strictserverauthority."
url = "https://necessewiki.com/Multiplayer"

