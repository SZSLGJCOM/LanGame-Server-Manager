kind = "documentation"
path = "https://necessewiki.com/Multiplayer"
authority = "first_party_documentation_and_installed_package_semantic_review"
description = "Semantic review on 2026-09-30 of 18 active configuration fields in both languages. The reviewed validation setting checks client actions on the server. The island-only boundary behavior is resolved by current-build consumer evidence below. No fresh server/client run was performed; existing evidence dates and status remain unchanged."

[[sources]]
id = "native_semantics_build_24926481"
kind = "install_probe"
path = "Server.jar:WorldEntity.isWithinWorldBorder, GameMath.squareDistance, IslandData.generateIslandData"
authority = "current_official_package_read_only_consumer_evidence"
description = "2026-09-30: Read-only bytecode inspection: isWithinWorldBorder applies only when the spawn identifier is an island position and worldBorderSize >= 0. squareDistance returns max(abs(dx), abs(dy)); IslandData uses the predicate for travel eligibility. -1 disables the boundary and 0 retains only the spawn island. The 1.0 official release notes removed the world-border setting for the seamless-world transition; the retained native consumer applies to island-coordinate worlds, not the seamless map. SHA256: necesse/engine/Settings.class b5eed1bb24e7d9589ed3e2add612e40814f16081bfa22900d7065fafb464954b; necesse/engine/world/WorldEntity.class 3cd4982f5224cc2001218c937742e15ee5952ce328d0f24fa33fb83ba1c61a3b; necesse/engine/util/GameMath.class b50b13a377a4b48a9ff12fd3e0462234e4f1cbf8a31f9625fb2c44b24dc633b5; necesse/inventory/container/travel/IslandData.class 77f1f873f4bb521067558370423f8e619eb1b295436c6b94c87f0e027e92b318."
