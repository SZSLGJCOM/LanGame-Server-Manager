[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/app-core",
    "crates/app-storage",
    "crates/app-runtime",
    "crates/app-modules",
    "crates/app-platform-win",
    "crates/app-steamcmd",
    "crates/app-network",
    "crates/app-knowledge",
]
resolver = "3"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
rust-version = "1.99.0"
version = "0.0.6"

[workspace.dependencies]
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tauri = { version = "2.12.1" }
tauri-build = { version = "2.7.1" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.7"
uuid = { version = "1.27.0", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
