[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/app-core",
    "crates/app-storage",
    "crates/app-runtime",
    "crates/app-modules",
    "crates/app-platform-win",
    "crates/app-steamcmd",
    "crates/app-network",
    "crates/app-knowledge",
]
resolver = "3"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
rust-version = "1.99.0"
version = "0.1.6"

[workspace.dependencies]
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tauri = { version = "2.12.4" }
tauri-build = { version = "2.7.3" }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

# The local desktop hashes multi-GiB server packages in development builds.
# Optimize compression without changing assertions, algorithms or CPU dispatch.
[profile.dev.package."sha1:0.11.0"]
opt-level = 3

[profile.dev.package."sha2:0.11.1"]
opt-level = 3

# The desktop test harness exceeded the managed compiler memory budget with
# full debug information and the default non-incremental codegen unit count.
# Keep test assertions and overflow checks while splitting code generation.
[profile.test.package.langame-desktop]
debug = 0
incremental = false
codegen-units = 512
