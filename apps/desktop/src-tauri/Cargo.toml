[package]
name = "langame-desktop"
default-run = "langame-desktop"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
app-core = { path = "../../../crates/app-core" }
app-knowledge = { path = "../../../crates/app-knowledge" }
app-modules = { path = "../../../crates/app-modules" }
app-network = { path = "../../../crates/app-network" }
app-platform-win = { path = "../../../crates/app-platform-win" }
app-runtime = { path = "../../../crates/app-runtime" }
app-storage = { path = "../../../crates/app-storage" }
app-steamcmd = { path = "../../../crates/app-steamcmd" }
base64 = "0.23.1"
dunce = "=1.0.5"
dom_query = "=0.28.0"
encoding_rs = "0.8.42"
if-addrs = "0.15.0"
keyring = "4.2.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = "0.6.5"
subtle = "2.6.1"
tauri = { workspace = true, features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-updater = "2.13.1"
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
desktop-reliability = []

[dev-dependencies]
sqlx.workspace = true
tauri = { workspace = true, features = ["test"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
