version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: rust-toolchain
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
