name: Mirror desktop release to GitCode

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag, for example v0.0.3
        required: true
        type: string

permissions:
  contents: read

# One domestic pointer is shared by all versions. Never interrupt an upload to
# start another release; stale/manual versions cannot move the pointer backward.
concurrency:
  group: gitcode-desktop-release
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'SZSLGJCOM/LanGame-Server-Manager' && (github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The maintained publisher is trusted code, not code from an older
          # manually selected tag. Artifacts are independently pinned by ID.
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
      - name: Verify publication and signature contracts
        run: |
          python -B -m unittest scripts.tests.test_sync_desktop_release_to_gitcode
          node --test scripts/tests/verify_desktop_update_signature.test.cjs
      - name: Verify and mirror the frozen release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITCODE_RELEASE_TOKEN: ${{ secrets.GITCODE_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          args=(--tag "$RELEASE_TAG" --work-dir "$RUNNER_TEMP/gitcode-mirror" --execute)
          if [[ -n "$RELEASE_ID" ]]; then args+=(--release-id "$RELEASE_ID"); fi
          python -B scripts/sync_desktop_release_to_gitcode.py "${args[@]}"
