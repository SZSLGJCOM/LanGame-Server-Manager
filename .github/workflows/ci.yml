name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "15 20 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Complete regression is also the pre-release automated gate
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  scope:
    name: Select verification tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      frontend_full: ${{ steps.scope.outputs.frontend_full }}
      frontend_changed: ${{ steps.scope.outputs.frontend_changed }}
      frontend_files: ${{ steps.scope.outputs.frontend_files }}
      rust_full: ${{ steps.scope.outputs.rust_full }}
      rust_packages: ${{ steps.scope.outputs.rust_packages }}
      rust_matrix: ${{ steps.scope.outputs.rust_matrix }}
      policy_full: ${{ steps.scope.outputs.policy_full }}
      native_full: ${{ steps.scope.outputs.native_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          TIER: ${{ (github.event_name == 'schedule' || inputs.tier == 'full') && 'full' || 'quick' }}
        run: python -B scripts/verify_project.py --component scope --tier "$TIER" --base "$BASE_SHA" --event "$EVENT" --github-output "$GITHUB_OUTPUT"

  policy:
    name: Python and publication policy
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi
      - name: Run shared policy checks
        run: python -B scripts/verify_project.py --component policy --tier ${{ needs.scope.outputs.policy_full == 'true' && 'full' || 'quick' }}

  frontend-build:
    name: Frontend contracts and build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Audit dependencies
        run: npm audit --prefix apps/desktop --audit-level=high
      - name: Run shared frontend contracts and build
        run: python -B scripts/verify_project.py --component frontend-build
      - name: Share the exact frontend used by the Rust build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  frontend-tests:
    name: Frontend unit and contract tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - run: python -B scripts/verify_project.py --component frontend-tests --tier quick

  frontend-browser:
    name: Desktop UI regression (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.frontend_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Verify selected desktop UI behavior
        env:
          BROWSER_FILES_JSON: ${{ needs.scope.outputs.frontend_files }}
        run: python -B scripts/verify_project.py --component frontend-browser --tier ${{ needs.scope.outputs.frontend_full == 'true' && 'full' || 'quick' }} --browser-files-json "$env:BROWSER_FILES_JSON" --shard-index ${{ matrix.shard }} --shard-count 4

  rust:
    name: Rust format, types, lints and licenses
    needs: frontend-build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-checks
          save-cache: "true"
      - name: Check Rust format, types, lints and licenses
        run: python -B scripts/verify_project.py --component rust-checks

  rust-tests:
    name: Rust ${{ matrix.group }} (${{ matrix.shard }}/${{ matrix.count }})
    needs: [scope, frontend-build]
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.rust_matrix) }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.group == 'desktop'
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ matrix.cache_writer }}
      - name: Run the selected isolated Rust group
        env:
          RUST_PACKAGES_JSON: ${{ needs.scope.outputs.rust_packages }}
        run: python -B scripts/verify_project.py --component rust-tests --rust-packages-json "$env:RUST_PACKAGES_JSON" --rust-group ${{ matrix.group }} --shard-index ${{ matrix.shard }} --shard-count ${{ matrix.count }} --output "${{ runner.temp }}/verification"
      - name: Retain test group evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.group }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native Tauri and WebView2 recovery
    needs: [scope, frontend-build]
    if: needs.scope.outputs.native_full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-native
          save-cache: "true"
      - name: Verify native Tauri and WebView2 recovery
        run: python -B scripts/verify_project.py --component native --tier full --output "${{ runner.temp }}/verification"
      - name: Retain native acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acceptance
          path: ${{ runner.temp }}/verification
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency and license review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
