name: Set up frontend checks
description: Install the repository's pinned npm and locked dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26.11.1"
        cache: npm
        cache-dependency-path: apps/desktop/package-lock.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
    - name: Install the pinned npm and locked dependencies
      shell: pwsh
      run: |
        $packageManager = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).packageManager
        if ($packageManager -notmatch '^npm@(\d+\.\d+\.\d+)$') { throw "packageManager must pin an exact npm version" }
        $expectedVersion = $Matches[1]
        $npmPrefix = Join-Path $env:RUNNER_TEMP 'lgsm-npm'
        npm install --global --prefix $npmPrefix $packageManager
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:PATH = "$npmPrefix;$env:PATH"
        $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if ((npm.cmd --version) -ne $expectedVersion) { throw "Pinned npm is not active" }
        npm.cmd ci --prefix apps/desktop --strict-allow-scripts
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
