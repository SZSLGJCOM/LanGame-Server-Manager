name: Feature request / 功能建议
description: Propose a scoped product or engineering improvement / 提议范围明确的产品或工程改进
title: "[Feature] "
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing issues and documentation for the same request. / 我已检索现有 Issue 和文档，未发现相同建议。
          required: true
        - label: This request contains no credentials, private addresses, player data, proprietary game files, or unlicensed media. / 本建议不含凭据、私有地址、玩家数据、专有游戏文件或未经许可的媒体。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 需要解决的问题
      description: Describe the operator or contributor problem without assuming a specific implementation. / 说明运维或开发问题，不预设具体实现。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome / 预期结果
      description: State the observable result and who benefits from it. / 说明可观察结果及适用角色。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach / 建议方案
      description: If you have an approach in mind, describe a possible workflow, interface, or API. An implementation plan is optional. / 如有想法，可说明可能的流程、界面或 API；无需提供实现方案。

  - type: textarea
    id: impact
    attributes:
      label: Optional engineering impact / 可选工程影响
      description: If known, describe affected data flow, lifecycle, storage, concurrency, security, i18n, game evidence, or migration behavior. / 如已了解，可说明受影响的数据流、生命周期、存储、并发、安全、国际化、游戏证据或迁移行为。

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
